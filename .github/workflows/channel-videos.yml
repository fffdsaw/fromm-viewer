name: Channel videos regression
on:
  pull_request:
    paths: ['index.html', 'web-live-pip.js', 'web-live-chat-probe.js', 'test/live-chat-probe*.cjs', 'test/votes*.cjs', 'test/my-replies*.cjs', 'test/live-ui-pip*.cjs', 'test/channel-videos*.cjs', 'test/channel-history*.cjs', 'test/channel-player*.cjs', 'test/replay-player*.cjs', 'test/direct-selection*.cjs', 'test/selection-gestures*.cjs', '.github/workflows/channel-videos.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Channel and existing Native LIVE contracts
        run: node --test test/*.test.cjs native-live/test/*.test.cjs
      - name: Whitespace
        run: git -c core.whitespace=cr-at-eol diff --check HEAD^ HEAD
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser and local video fixtures
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb xdotool
      - name: Channel features and viewport layout
        env:
          CHANNEL_SCREENSHOT_DIR: screenshots
          LIVE_SCREENSHOT_DIR: screenshots
          VOTE_SCREENSHOT_DIR: screenshots
          REPLY_SCREENSHOT_DIR: screenshots
        run: |
          node test/channel-videos.browser.cjs
          node test/channel-player.browser.cjs
          node test/replay-player.browser.cjs
          node test/direct-selection.browser.cjs
          node test/selection-gestures.browser.cjs
          node test/live-ui-pip.browser.cjs
          node test/live-chat-probe.browser.cjs
          node test/votes.browser.cjs
          node test/my-replies.browser.cjs
          node test/live-chat-probe-extension.browser.cjs
      - name: Chromium browser Back and Forward (desktop UI, mobile viewport emulation)
        run: xvfb-run -a env CHANNEL_HISTORY_UI=1 node test/channel-videos.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: channel-browser-screenshots
          path: screenshots/
          retention-days: 7
