name: Channel videos regression
on:
  pull_request:
    paths: ['glowme.css', 'web-glowme.js', 'web-pwa.js', 'sw.js', 'manifest.webmanifest', 'assets/glowme/**', 'test/glowme*.cjs', 'test/liquid-glass*.cjs', 'test/pwa*.cjs', 'test/helpers/shell-assets.cjs', 'test/helpers/liquid-glass-report.cjs', 'index.html', 'web-live-pip.js', 'web-live-controls.js', 'web-native-live.js', 'test/native-diagnostics*.cjs', 'web-live-chat-probe.js', 'test/live-chat-probe*.cjs', 'test/votes*.cjs', 'test/my-replies*.cjs', 'test/live-ui-pip*.cjs', 'test/channel-videos*.cjs', 'test/channel-history*.cjs', 'test/channel-player*.cjs', 'test/replay-player*.cjs', 'test/video-quality*.cjs', 'test/player-settings*.cjs', 'test/helpers/player-controls-fade.cjs', 'test/video-startup*.cjs', 'test/direct-selection*.cjs', 'test/selection-gestures*.cjs', '.github/workflows/channel-videos.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Channel and existing Native LIVE contracts
        run: node --test test/*.test.cjs native-live/test/*.test.cjs
      - name: Whitespace
        run: git -c core.whitespace=cr-at-eol diff --check HEAD^ HEAD
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser and local video fixtures
        timeout-minutes: 15
        run: |
          # Keep signed Ubuntu packages, avoiding the slow hosted Azure mirror.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          npm install --no-save --package-lock=false playwright@1.62.1 axe-core@4.11.1
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb xdotool
      - name: Channel features and viewport layout
        env:
          CHANNEL_SCREENSHOT_DIR: screenshots
          LIVE_SCREENSHOT_DIR: screenshots
          VOTE_SCREENSHOT_DIR: screenshots
          REPLY_SCREENSHOT_DIR: screenshots
          UI_ICON_SCREENSHOT_DIR: screenshots
          QUALITY_SCREENSHOT_DIR: screenshots
          GLOWME_SCREENSHOT_DIR: screenshots/glowme
          LIQUID_SCREENSHOT_DIR: screenshots/liquid-glass
        run: |
          node test/glowme.browser.cjs
          node test/liquid-glass.browser.cjs
          node test/ui-icons.browser.cjs
          node test/video-list-autoload.browser.cjs
          node test/channel-videos.browser.cjs
          node test/channel-player.browser.cjs
          node test/replay-player.browser.cjs
          GLOWME_INSTALLED_MODE=1 CHANNEL_SCREENSHOT_DIR=screenshots/glowme-installed node test/channel-player.browser.cjs
          GLOWME_INSTALLED_MODE=1 CHANNEL_SCREENSHOT_DIR=screenshots/glowme-installed node test/replay-player.browser.cjs
          node test/player-settings.browser.cjs
          node test/video-quality.browser.cjs
          STARTUP_RUNS=1 STARTUP_RESULTS_PATH=screenshots/video-startup.json node test/video-startup.browser.cjs
          node test/direct-selection.browser.cjs
          node test/selection-gestures.browser.cjs
          node test/live-ui-pip.browser.cjs
          node test/native-diagnostics.browser.cjs
          node test/live-chat-probe.browser.cjs
          node test/votes.browser.cjs
          node test/my-replies.browser.cjs
          node test/live-chat-probe-extension.browser.cjs
      - name: Chromium browser Back and Forward (desktop UI, mobile viewport emulation)
        run: xvfb-run -a env CHANNEL_HISTORY_UI=1 node test/channel-videos.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: channel-browser-screenshots
          path: screenshots/
          retention-days: 7
