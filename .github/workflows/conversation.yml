name: Conversation receive send and persistence
on:
  pull_request:
    paths: ['index.html', 'web-conversation*.js', 'web-unread.js', 'web-chat-audio.js', 'conversation.css', 'web-view-state.js', 'chrome_extension/**', 'chrome_extension.zip', 'vendor/firebase/**', 'test/conversation*.cjs', 'test/unread.test.cjs', 'test/conversation-unread-rail.browser.cjs', 'test/rail-glyph-lens.browser.cjs', 'test/chat-history-progressive.browser.cjs', 'test/chat-history-scale.browser.cjs', 'test/my-replies.browser.cjs', 'test/search-calendar-panel.browser.cjs', 'web-glowme.js', 'web-glass-controls.js', 'glowme.css', 'test/helpers/phase3-fixture.cjs', 'test/helpers/shell-assets.cjs', '.github/workflows/conversation.yml']
permissions:
  contents: read
jobs:
  browser:
    name: Conversation / ${{ matrix.channel }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            channel: chromium
          - os: windows-latest
            channel: chrome
          - os: windows-latest
            channel: msedge
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Incremental reads and message rules
        run: node --test test/conversation.test.cjs test/unread.test.cjs
      - name: Browser tooling
        run: npm install --no-save --package-lock=false playwright@1.62.1 axe-core@4.14.0
      - name: Chromium
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Browser recording helper
        run: npx playwright install ffmpeg
      - name: Real browser storage, rendering and synthetic send contracts
        env:
          PLAYWRIGHT_CHANNEL: ${{ matrix.channel }}
          CONVERSATION_DIR: conversation-results
        run: |
          node test/conversation.browser.cjs
          node test/conversation-state.browser.cjs
          node test/conversation-cache-restore.browser.cjs
          node test/conversation-cache-conflicts.browser.cjs
          node test/conversation-storage-recovery.browser.cjs
          node test/conversation-emoticons.browser.cjs
          node test/conversation-controls.browser.cjs
          node test/conversation-send-focus.browser.cjs
          node test/conversation-audio.browser.cjs
          node test/conversation-unread-rail.browser.cjs
          node test/chat-history-progressive.browser.cjs
          node test/my-replies.browser.cjs
          node test/search-calendar-panel.browser.cjs
          node test/rail-glyph-lens.browser.cjs
      - name: Synthetic 50,000-message scale and cache restore
        if: matrix.channel == 'chromium'
        env:
          PLAYWRIGHT_CHANNEL: ${{ matrix.channel }}
        run: node test/chat-history-scale.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conversation-${{ matrix.channel }}
          path: conversation-results/
          retention-days: 7
