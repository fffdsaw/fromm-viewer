name: Compare Meapri Regular optical preview (experiment only)

on:
  push:
    branches:
      - experiment/glowme-phase3-chat-layout
    paths:
      - .github/workflows/meapri-compare.yml
      - test/meapri-regular-compare.browser.cjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot-compare:
    if: github.ref == 'refs/heads/experiment/glowme-phase3-chat-layout'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out experiment only
        uses: actions/checkout@v4
        with:
          ref: experiment/glowme-phase3-chat-layout
          persist-credentials: true
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture synthetic UI optical comparison
        run: node test/meapri-regular-compare.browser.cjs
      - name: Upload comparison screenshots for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meapri-regular-off-on-browser-compare
          path: docs/design-review/meapri-regular-demo/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish test-only screenshots to experimental branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/experiment/glowme-phase3-chat-layout"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design-review/meapri-regular-demo/
          if ! git diff --cached --quiet; then
            git commit -m "test(experiment): save real-browser Regular before-after visuals"
            git push origin HEAD:refs/heads/experiment/glowme-phase3-chat-layout
          fi
