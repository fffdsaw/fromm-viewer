name: Windows LIVE connection tool
on:
  pull_request:
    paths: ['native-live/**', 'chrome_extension/**', 'web-native-live.js', '.github/workflows/native-live-windows.yml']
  push:
    branches: [main]
    paths: ['native-live/**', 'chrome_extension/**', 'web-native-live.js', '.github/workflows/native-live-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official Windows Native runtime
        working-directory: native-live
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test contracts and browser routing
        run: node --test native-live/test/*.test.cjs test/*.test.cjs
      - name: Verify hidden Native SDK rendering, frame delivery and lifecycle
        working-directory: native-live
        run: node test/run-background-check.cjs
      - name: Bundle the connection tool and extension
        shell: pwsh
        run: |
          Compress-Archive -Path native-live,chrome_extension,web-native-live.js -DestinationPath fromm-native-live-windows-x64.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: fromm-native-live-windows-x64
          path: fromm-native-live-windows-x64.zip
          retention-days: 7
      - name: Publish Windows download
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view native-live-0.4.0 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create native-live-0.4.0 --target "$env:GITHUB_SHA" --title "Windows LIVE 0.4.0 - background Native player" --notes "Native LIVE now runs in a hidden background window. Extract into a fixed folder, close active LIVE tabs, run native-live/Install-Web-LIVE.cmd, reload the bundled extension 1.0.8, then Ctrl+F5 the Viewer. Existing 0.3.0 users must rerun the installer for the new folder. Developer reveal: FROMM_NATIVE_DEBUG=1 before starting the browser. Windows synthetic SDK rendering, JPEG/ACK and teardown checks run before publication; authenticated broadcasts require a separate live check."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload native-live-0.4.0 fromm-native-live-windows-x64.zip --clobber
