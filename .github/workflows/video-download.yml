name: Video download engine
on:
  pull_request:
    paths: ['index.html', 'web-video-download.js', 'test/video-download*', 'test/benchmarks/video-download.cjs', 'test/helpers/replay-download-runtime.cjs', 'test/helpers/phase3-fixture.cjs', '.github/workflows/video-download.yml']
permissions:
  contents: read
jobs:
  browser:
    name: Download / ${{ matrix.channel }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            channel: chromium
          - os: windows-latest
            channel: chrome
          - os: windows-latest
            channel: msedge
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download engine unit tests
        run: node --test test/video-download-engine.test.cjs
      - name: Browser tooling
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Chromium
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Chrome and Edge real browser storage, AES and progress
        env:
          PLAYWRIGHT_CHANNEL: ${{ matrix.channel }}
          VIDEO_DOWNLOAD_DIR: video-results
        run: node test/video-download-engine.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-download-${{ matrix.channel }}
          path: video-results/
          retention-days: 7
