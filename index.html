<!doctype html>
<!-- Fromm Viewer v0.73 · structural toolbar dock -->
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Fromm Viewer v0.73</title>
<style>
:root{
  --bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--text:#f5f6f8;--muted:#9da6b5;
  --line:#2a303b;--accent:#ff5b73;--accent2:#ff8798;--ok:#69d59a;--warn:#ffcb6b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:330px 1fr;min-height:100vh}
.sidebar{border-right:1px solid var(--line);background:#12151b;padding:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:20px;font-weight:800;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px;line-height:1.5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
label{display:block;color:var(--muted);font-size:12px;margin:10px 0 6px}
input,textarea{width:100%;border:1px solid var(--line);background:#0f1218;color:var(--text);border-radius:10px;padding:10px}
textarea{height:66px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:9px 12px;background:#2a303b;color:var(--text)}
.btn.primary{background:var(--accent);font-weight:700}
.btn.good{background:#246a49}
.btn:disabled{opacity:.45;cursor:not-allowed}
.rooms{display:flex;flex-direction:column;gap:6px}
.room{width:100%;text-align:left;background:#11151b;border:1px solid var(--line);color:var(--text);border-radius:11px;padding:10px 11px}
.room.active{border-color:var(--accent);background:#22171c}
.main{padding:22px;min-width:0}
.topbar{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:18px}
.title{font-size:24px;font-weight:800}
.status{color:var(--muted);font-size:13px;margin-top:5px}
.toolbar{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.pill{border:1px solid var(--line);background:#12161d;color:var(--muted);border-radius:999px;padding:7px 10px}
.pill.active{background:#2a1b21;color:#fff;border-color:var(--accent)}
.spacer{flex:1}
.stats{color:var(--muted);font-size:13px}
.timeline{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:9px}
.msg{display:flex}
.msg.star{justify-content:flex-start}
.msg.me{justify-content:flex-end}
.bubble{max-width:min(76%,680px);background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:10px 12px;overflow:hidden}
.me .bubble{background:#202937}
.meta{font-size:11px;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.type{font-weight:700;color:var(--accent2)}
.text{white-space:pre-wrap;word-break:break-word;line-height:1.45}
.media-wrap{display:flex;flex-direction:column;gap:8px}
.media-wrap img,.media-wrap video{display:block;max-width:100%;max-height:560px;border-radius:12px;background:#090b0f}
.media-wrap audio{width:min(100%,520px)}
.media-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.check{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px}
a.dl{color:#fff;text-decoration:none;background:#303744;padding:7px 9px;border-radius:8px;font-size:12px}
.date-sep{text-align:center;color:var(--muted);font-size:12px;margin:12px 0 4px}
.more{display:block;margin:18px auto;background:#252b35;color:#fff;border:1px solid var(--line);padding:9px 14px;border-radius:10px}
.empty{text-align:center;color:var(--muted);padding:80px 20px}
.progress{height:5px;background:#222733;border-radius:999px;overflow:hidden;margin-top:10px}
.progress>div{height:100%;background:var(--accent);width:0%}
.notice{font-size:12px;color:var(--warn);line-height:1.5;margin-top:8px}
@media(max-width:850px){
  .app{grid-template-columns:1fr}
  .sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .bubble{max-width:92%}
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:18px;
  align-items:start;
}
.media-card{
  position:relative;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  min-width:0;
}
.media-card.selected{
  outline:2px solid var(--accent);
  outline-offset:1px;
}
.thumb{
  position:relative;
  aspect-ratio:4/3;
  background:#090b0f;
  overflow:hidden;
}
.thumb img,.thumb video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.thumb.audio-thumb{
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#171b22,#252d39);
}
.audio-icon{
  font-size:54px;
  opacity:.78;
}
.card-badge{
  position:absolute;
  top:11px;
  left:11px;
  background:rgba(0,0,0,.72);
  border:1px solid rgba(255,255,255,.12);
  border-radius:8px;
  padding:6px 9px;
  font-size:12px;
  font-weight:800;
}
.card-download{
  position:absolute;
  top:10px;
  right:10px;
  width:38px;
  height:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.68);
  color:#fff;
  text-decoration:none;
  font-size:20px;
  border:1px solid rgba(255,255,255,.08);
}
.card-select{display:none}
.card-body{padding:13px 14px 15px}
.card-title{
  font-size:16px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.card-date{
  margin-top:7px;
  color:var(--muted);
  font-size:13px;
}
.card-audio{
  padding:10px 12px 0;
  background:var(--panel);
}
.card-audio audio{
  display:block;
  width:100%;
}


.sort-controls{
  display:flex;
  gap:8px;
  align-items:center;
}
.sort-btn{
  white-space:nowrap;
  background:#202630;
  border:1px solid var(--line);
}

.card-body{
  position:relative;
  min-height:72px;
  padding-right:104px;
}
.card-footer-select{
  position:absolute;
  right:12px;
  bottom:12px;
  height:34px;
  min-width:74px;
  padding:0 10px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  background:#10141b;
  border:1px solid var(--line);
  border-radius:10px;
  font-size:12px;
  font-weight:700;
  color:var(--muted);
  cursor:pointer;
  user-select:none;
  z-index:2;
  transition:background .14s ease,border-color .14s ease,color .14s ease,transform .08s ease;
}
.card-footer-select:hover{
  border-color:#515b6b;
  color:#eef1f6;
  background:#151b24;
}
.card-footer-select:active{
  transform:translateY(1px);
}
.card-select-input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}
.card-select-box{
  width:14px;
  height:14px;
  flex:0 0 14px;
  border:1.5px solid #aeb6c3;
  border-radius:4px;
  display:grid;
  place-items:center;
  background:#f6f7f9;
  transition:background .14s ease,border-color .14s ease;
}
.card-select-box::after{
  content:"";
  width:7px;
  height:4px;
  border-left:2px solid transparent;
  border-bottom:2px solid transparent;
  transform:rotate(-45deg) translateY(-1px);
}
.media-card.selected .card-footer-select{
  border-color:var(--accent);
  background:#281a20;
  color:#fff;
}
.media-card.selected .card-select-box{
  border-color:var(--accent);
  background:var(--accent);
}
.media-card.selected .card-select-box::after{
  border-left-color:#fff;
  border-bottom-color:#fff;
}
.card-select-text::after{
  content:"선택";
}
.media-card.selected .card-select-text::after{
  content:"선택됨";
}

.audio-thumb{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#171b22,#252d39);
}
.audio-icon{
  font-size:54px;
  opacity:.80;
  transform:translateY(-18px);
}
.audio-player-overlay{
  position:absolute;
  left:12px;
  right:12px;
  bottom:12px;
}
.audio-player-overlay audio{
  display:block;
  width:100%;
  height:40px;
}


.title-line{
  display:flex;
  align-items:baseline;
  gap:10px;
  flex-wrap:wrap;
}
.inline-status{
  margin-top:0;
  white-space:nowrap;
}
.topbar{
  margin-bottom:10px;
  align-items:center;
}

.toolbar{
  position:sticky;
  top:8px;
  z-index:50;
  margin-top:-2px;
  margin-bottom:16px;
  backdrop-filter:blur(12px);
  box-shadow:0 10px 30px rgba(0,0,0,.22);
}

.scroll-top{
  position:fixed;
  right:22px;
  bottom:24px;
  width:48px;
  height:48px;
  border-radius:50%;
  border:1px solid var(--line);
  background:rgba(30,34,43,.92);
  color:#fff;
  font-size:24px;
  font-weight:800;
  z-index:80;
  box-shadow:0 8px 24px rgba(0,0,0,.32);
  opacity:0;
  pointer-events:none;
  transform:translateY(8px);
  transition:opacity .18s ease, transform .18s ease, background .18s ease;
}
.scroll-top.visible{
  opacity:1;
  pointer-events:auto;
  transform:translateY(0);
}
.scroll-top:hover{
  background:var(--accent);
}

/* Reserve a small right gutter on desktop so the floating button does not cover cards. */
@media(min-width:851px){
  .main{padding-right:82px}
}

.media-card .thumb{
  content-visibility:auto;
  contain-intrinsic-size:320px 240px;
}
.media-card img{
  background:#0b0e13;
}


.auth-card{
  transition:padding .18s ease;
}
.auth-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.auth-toggle{
  padding:6px 8px;
  font-size:12px;
}
.auth-card.collapsed{
  padding:12px 14px;
}
.auth-card.collapsed #authFields{
  display:none;
}
.auth-compact{
  margin-top:9px;
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:13px;
}
.auth-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--ok);
  box-shadow:0 0 0 3px rgba(105,213,154,.12);
}

.media-card .thumb img,
.media-wrap img{
  cursor:zoom-in;
}

.lightbox{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.90);
  padding:40px 56px 56px;
}
.lightbox.open{
  display:flex;
}
.lightbox img{
  max-width:95vw;
  max-height:88vh;
  width:auto;
  height:auto;
  object-fit:contain;
  border-radius:10px;
  box-shadow:0 18px 60px rgba(0,0,0,.55);
  background:#080a0e;
  cursor:zoom-out;
}
.lightbox-close{
  position:fixed;
  top:16px;
  right:22px;
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.13);
  color:#fff;
  font-size:31px;
  line-height:1;
  cursor:pointer;
}
.lightbox-caption{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  max-width:min(80vw,900px);
  color:#d9dee8;
  background:rgba(0,0,0,.48);
  border-radius:999px;
  padding:7px 12px;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}


.infinite-sentinel{
  pointer-events:none;
}
.msg{
  content-visibility:auto;
  contain-intrinsic-size:80px;
}


.thumb{
  background:
    linear-gradient(110deg,#11151c 8%,#1b2029 18%,#11151c 33%);
  background-size:200% 100%;
  animation:thumbShimmer 1.35s linear infinite;
}
.thumb.media-ready{
  animation:none;
  background:#090b0f;
}
.thumb img,.thumb video{
  opacity:0;
  transition:opacity .18s ease;
}
.thumb.media-ready img,
.thumb.media-ready video{
  opacity:1;
}
@keyframes thumbShimmer{
  to{background-position-x:-200%}
}


.selected-count{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:72px;
  padding:7px 10px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#141922;
  color:#fff;
  font-size:13px;
  font-weight:800;
}
.selected-count.has-selection{
  border-color:var(--accent);
  background:#2a171d;
  color:#fff;
}


.chat-search{
  display:flex;
  align-items:center;
  gap:6px;
  min-width:240px;
  max-width:360px;
  height:38px;
  padding:0 8px 0 10px;
  border:1px solid var(--line);
  background:#10141b;
  border-radius:10px;
}
.chat-search input{
  flex:1;
  min-width:0;
  width:auto;
  border:0;
  outline:0;
  background:transparent;
  padding:0;
  color:var(--text);
}
.chat-search input::placeholder{
  color:#778191;
}
.chat-search-count{
  color:var(--muted);
  font-size:12px;
  white-space:nowrap;
}
.chat-search-clear{
  width:24px;
  height:24px;
  padding:0;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--muted);
  font-size:18px;
  line-height:1;
  cursor:pointer;
}
.chat-search-clear:hover{
  background:#252b35;
  color:#fff;
}
.text mark{
  background:#ffda63;
  color:#111;
  border-radius:3px;
  padding:0 1px;
}


.reply-quote{
  margin:2px 0 9px;
  padding:9px 11px;
  border-left:3px solid var(--accent);
  border-radius:10px;
  background:rgba(255,255,255,.055);
  cursor:pointer;
  transition:background .15s ease,border-color .15s ease;
}
.reply-quote:hover{
  background:rgba(255,255,255,.085);
}
.reply-label{
  color:var(--accent2);
  font-size:12px;
  font-weight:800;
  margin-bottom:5px;
}
.reply-content{
  color:#c4cad4;
  font-size:13px;
  line-height:1.45;
  white-space:pre-wrap;
  word-break:break-word;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.reply-media-label{
  color:#aab2bf;
  font-size:13px;
}
.msg.reply-target-flash .bubble{
  outline:2px solid var(--accent);
  box-shadow:0 0 0 6px rgba(255,91,115,.12);
}


.audio-error-note{
  position:absolute;
  left:12px;
  right:12px;
  bottom:58px;
  display:none;
  padding:6px 8px;
  border-radius:8px;
  background:rgba(0,0,0,.74);
  color:#f1c56a;
  font-size:11px;
  text-align:center;
  z-index:3;
}
.audio-thumb.audio-failed .audio-error-note{
  display:block;
}


.infinite-sentinel::after{
  content:"";
  display:block;
  width:22px;
  height:22px;
  margin:10px auto 4px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.15);
  border-top-color:var(--accent);
  animation:sentinelSpin .8s linear infinite;
  opacity:.65;
}
@keyframes sentinelSpin{to{transform:rotate(360deg)}}


.media-missing{
  color:#9da6b5;
  font-size:13px;
  font-style:italic;
}
.media-card-unavailable{
  opacity:.65;
}


.media-unavailable-note{
  position:absolute;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  padding:6px 9px;
  border-radius:8px;
  background:rgba(0,0,0,.72);
  color:#d6ad58;
  font-size:12px;
  white-space:nowrap;
}
.media-card-unavailable{
  opacity:.78;
}
.media-card-unavailable .thumb{
  filter:saturate(.6);
}


/* Stable media grid: 4 columns on wide desktop, then 3/2/1 responsively. */
.gallery{
  width:100%;
  max-width:none;
  margin:0;
  grid-template-columns:repeat(4,minmax(0,1fr));
}
@media(max-width:1350px){
  .gallery{grid-template-columns:repeat(3,minmax(0,1fr));}
}
@media(max-width:1050px){
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(max-width:700px){
  .gallery{grid-template-columns:1fr;}
}


.auth-actions{
  display:flex;
  align-items:center;
  gap:6px;
}
.auth-save-note{
  margin-top:6px;
  color:var(--muted);
  font-size:11px;
  line-height:1.35;
}
.danger-lite{
  color:#d7a8ae;
}
.danger-lite:hover{
  color:#fff;
  border-color:#82414d;
}


.date-jump{
  display:flex;
  align-items:center;
  gap:6px;
}
.date-jump input[type="date"]{
  height:38px;
  padding:0 9px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#10141b;
  color:var(--text);
  color-scheme:dark;
}
.date-jump .btn{
  height:38px;
  padding:0 11px;
  white-space:nowrap;
}
.msg.date-target-flash .bubble{
  animation:date-focus-rose 1.15s cubic-bezier(.22,.8,.32,1) both;
}

@keyframes date-focus-rose{
  0%{
    transform:translateY(0) scale(1);
    box-shadow:0 0 0 0 rgba(255,91,115,0);
    filter:brightness(1);
  }
  18%{
    transform:translateY(-1px) scale(1.012);
    box-shadow:
      0 0 0 1px rgba(255,91,115,.48),
      0 0 0 7px rgba(255,91,115,.10),
      0 8px 24px rgba(255,91,115,.10);
    filter:brightness(1.07);
  }
  55%{
    transform:translateY(0) scale(1.004);
    box-shadow:
      0 0 0 1px rgba(255,91,115,.24),
      0 0 0 4px rgba(255,91,115,.055),
      0 5px 16px rgba(255,91,115,.055);
    filter:brightness(1.035);
  }
  100%{
    transform:translateY(0) scale(1);
    box-shadow:0 0 0 0 rgba(255,91,115,0);
    filter:brightness(1);
  }
}


/* v0.25: compact full-chat search/date tool */
.chat-tools{
  position:relative;
  display:flex;
  align-items:center;
  flex:0 0 auto;
}

.chat-tools-btn{
  width:38px;
  height:38px;
  padding:0;
  border:1px solid var(--line);
  border-radius:10px;
  background:#151a22;
  color:var(--text);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}
.chat-tools-btn:hover,
.chat-tools-btn.active{
  border-color:var(--accent);
  background:#24171c;
}

.magnifier-icon{
  position:relative;
  display:block;
  width:15px;
  height:15px;
  border:2px solid currentColor;
  border-radius:50%;
}
.magnifier-icon::after{
  content:"";
  position:absolute;
  width:7px;
  height:2px;
  background:currentColor;
  right:-6px;
  bottom:-3px;
  transform:rotate(45deg);
  transform-origin:left center;
  border-radius:2px;
}

.chat-tools-panel{
  position:absolute;
  right:0;
  top:46px;
  z-index:150;
  display:none;
  width:min(390px,calc(100vw - 36px));
  padding:13px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#11161e;
  box-shadow:0 18px 48px rgba(0,0,0,.45);
}
.chat-tools-panel.open{
  display:block;
}
.chat-tools-title{
  margin-bottom:12px;
  font-size:14px;
  font-weight:800;
}
.chat-tools-label{
  margin:0 0 6px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}
.chat-tools-row{
  display:flex;
  align-items:center;
  gap:7px;
}
.chat-tools-row input[type="search"],
.chat-tools-row input[type="date"]{
  flex:1;
  min-width:0;
  width:auto;
  height:38px;
  padding:0 10px;
  border:1px solid var(--line);
  border-radius:9px;
  outline:none;
  background:#0d1117;
  color:var(--text);
}
.chat-tools-row input[type="date"]{
  color-scheme:dark;
}
.chat-tools-row input:focus{
  border-color:var(--accent);
}
.chat-tools-divider{
  height:1px;
  margin:12px 0;

/* ===== v0.37 subtle UI motion ===== */
.reload-btn{
  width:40px;
  height:40px;
  flex:0 0 40px;
  display:inline-grid;
  place-items:center;
  border:1px solid var(--line);
  border-radius:50%;
  background:#171c24;
  color:#e9edf4;
  padding:0;
  cursor:pointer;
  transition:
    background .16s ease,
    border-color .16s ease,
    transform .12s ease,
    opacity .16s ease;
}
.reload-btn:hover:not(:disabled){
  background:#202733;
  border-color:#4b5667;
  transform:translateY(-1px);
}
.reload-btn:active:not(:disabled){
  transform:scale(.94);
}
.reload-btn:disabled{
  opacity:.62;
  cursor:default;
}
.reload-icon{
  display:block;
  font-size:23px;
  line-height:1;
  transform-origin:50% 50%;
}
.reload-btn.loading .reload-icon{
  animation:none;
  opacity:.48;
}

/* Loading is intentionally concentrated in ONE place:
   a thin moving line on the tab/action bar. No spinning circles. */
.pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:
    background .16s ease,
    border-color .16s ease,
    color .16s ease,
    transform .12s ease;
}
.pill:active{
  transform:scale(.96);
}

.toolbar{
  overflow:visible;
}
.toolbar::after{
  content:"";
  position:absolute;
  left:12px;
  right:12px;
  bottom:-1px;
  height:2px;
  border-radius:999px;
  background:linear-gradient(
    90deg,
    transparent 0%,
    rgba(255,91,115,.15) 22%,
    rgba(255,91,115,.92) 50%,
    rgba(255,91,115,.15) 78%,
    transparent 100%
  );
  opacity:0;
  transform:scaleX(.18) translateX(-220%);
  transform-origin:center;
  pointer-events:none;
}
.toolbar.is-loading::after{
  opacity:1;
  animation:toolbar-loading-line 1.15s ease-in-out infinite;
}

/* Loading copy stays still. The toolbar line is the only moving loader. */
.inline-loader{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:var(--muted);
}

/* Selection button "press" feedback */
.card-footer-select{
  will-change:transform;
}
.card-footer-select.select-pop{
  animation:select-pop .22s ease-out;
}
.media-card.selected .card-footer-select{
  box-shadow:0 0 0 3px rgba(255,91,115,.08);
}

/* Content itself stays visually stable during refresh/tab loading. */

/* Lightbox and drawer transitions feel slightly smoother. */
.lightbox{
  transition:opacity .18s ease;
}
#sidebar{
  will-change:transform;
}

@keyframes ui-spin{
  to{ transform:rotate(360deg); }
}
@keyframes select-pop{
  0%{ transform:scale(1); }
  45%{ transform:scale(.91); }
  100%{ transform:scale(1); }
}
@keyframes content-in{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@media(prefers-reduced-motion:reduce){
  .reload-btn,
  .pill,
  .card-footer-select,
  .lightbox{
    transition:none !important;
  }
  .reload-btn.loading .reload-icon,
  .card-footer-select.select-pop,
  .msg.date-target-flash .bubble{
    animation:none !important;
  }
}


@keyframes toolbar-loading-line{
  0%{
    transform:scaleX(.18) translateX(-220%);
    opacity:.35;
  }
  50%{
    transform:scaleX(.38) translateX(0);
    opacity:1;
  }
  100%{
    transform:scaleX(.18) translateX(220%);
    opacity:.35;
  }
}

/* v0.39 scroll-compacted header:
   when scrolling down the tab/action bar glides up beside the hamburger. */
.topbar,
.toolbar{
  transition:
    top .24s cubic-bezier(.2,.75,.25,1),
    transform .24s cubic-bezier(.2,.75,.25,1),
    opacity .18s ease,
    margin-left .24s cubic-bezier(.2,.75,.25,1),
    box-shadow .2s ease,
    border-radius .2s ease;
}

body.header-compact .topbar{
  transform:translateY(-115%);
  opacity:0;
  pointer-events:none;
}

body.header-compact .toolbar{
  top:8px !important;
  margin-left:50px !important;

}

/* Keep the hamburger visually centered next to the compact toolbar. */
body.header-compact .sidebar-toggle-btn{
  top:15px;
}

@media(max-width:700px){
  body.header-compact .toolbar{
    top:6px !important;

  }
}

/* No rotating loader animations in reduced-motion either. */
@media(prefers-reduced-motion:reduce){
  .toolbar.is-loading::after{
    animation:none !important;
    opacity:.75;
    transform:scaleX(1) !important;
  }
  .topbar,

    transition:none !important;
  }
}

/* ===== v0.48 layout stability ===== */

/* Windows/Chrome normally adds the vertical scrollbar only after enough
   content loads. Reserving the gutter prevents the entire UI from jumping
   sideways when media/chat cards suddenly make the page tall. */
html{
  overflow-y:scroll;
  scrollbar-gutter:stable;
}
body{
  min-height:100vh;
}

/* Header text may change during loading, but it must not push the auth buttons
   or increase the header height. */
.topbar{

}

}

/* ===== v0.54 unified compact header =====
   When scrolling, the hamburger and tab bar share one visual rail.
   The rail is translucent/blurred so content remains readable and the
   header does not feel like a solid slab covering photos or chat text. */
body.header-compact::before{
  content:"";
  position:fixed;
  top:8px;
  left:12px;
  right:12px;
  height:68px;
  z-index:68;
  pointer-events:none;
  border:1px solid rgba(67,76,91,.62);
  border-radius:20px;
  background:rgba(15,18,24,.78);
  -webkit-backdrop-filter:blur(16px) saturate(1.08);
  backdrop-filter:blur(16px) saturate(1.08);
  box-shadow:0 10px 30px rgba(0,0,0,.22);
}

/* Exact shared vertical center: rail top 8 + 68/2 = 42px. */
body.header-compact .sidebar-toggle-btn{
  top:22px !important;
  left:20px !important;
  width:40px !important;
  height:40px !important;
  z-index:430;
  border-radius:12px;
  background:rgba(20,24,31,.38);
  transition:
    background .16s ease,
    opacity .16s ease,
    transform .18s ease;
}
body.header-compact .sidebar-toggle-btn:hover,
body.header-compact .sidebar-toggle-btn:focus-visible{
  background:rgba(35,41,52,.72);
}

body.header-compact .sidebar-toggle-btn span{
  width:22px;
  height:2.5px;
}

body.header-compact .toolbar{
  top:8px !important;
  min-height:68px !important;
  margin-left:58px !important;
  margin-right:0 !important;
  padding:10px 12px !important;
  align-items:center !important;
  align-content:center !important;
  border-color:transparent !important;
  border-radius:16px !important;
  background:transparent !important;
  box-shadow:none !important;
  -webkit-backdrop-filter:none !important;
  backdrop-filter:none !important;
}

/* Keep every direct toolbar control on the same center line. */
body.header-compact .toolbar > *{
  align-self:center;
}

/* The moving loading line still belongs to the toolbar, but stays inside
   the shared background rail instead of hanging below it. */
body.header-compact .toolbar::after{
  left:12px;
  right:12px;
  bottom:2px;
}

/* At narrower widths retain the same center instead of nudging the toolbar
   and hamburger by different amounts. */
@media(max-width:700px){
  body.header-compact::before{
    top:6px;
    left:8px;
    right:8px;
    height:64px;
    border-radius:17px;
  }
  body.header-compact .sidebar-toggle-btn{
    top:18px !important;
    left:14px !important;
    width:40px !important;
    height:40px !important;
  }
  body.header-compact .toolbar{
    top:6px !important;
    min-height:64px !important;
    margin-left:50px !important;
    padding-top:8px !important;
    padding-bottom:8px !important;
  }
}

@media(prefers-reduced-motion:reduce){
  body.header-compact .sidebar-toggle-btn{
    transition:none !important;
  }
}


/* ===== v0.55 natural sticky header =====
   No animated jump/morph into a second compact-header geometry.
   The toolbar reaches the top naturally and stays there. */

/* The title/auth row belongs to normal document flow.
   It simply scrolls away instead of being animated offscreen. */
.topbar,
body.header-compact .topbar{
  position:relative !important;
  top:auto !important;
  transform:none !important;
  opacity:1 !important;
  pointer-events:auto !important;
  transition:none !important;
}

/* Disable the separate fixed v0.54 rail that could remain visible while
   the toolbar itself had already left the sticky containing area. */
body.header-compact::before{
  content:none !important;
  display:none !important;
}

/* One geometry only, both before and after the sticky point.
   Since `top` and `margin-left` never change, there is no "snap upward". */
.toolbar,
body.header-compact .toolbar{
  position:sticky !important;
  top:8px !important;
  z-index:90 !important;

  min-height:64px !important;
  margin-left:58px !important;
  margin-right:0 !important;
  margin-bottom:16px !important;
  padding:10px 12px !important;

  align-items:center !important;
  align-content:center !important;

  border:1px solid rgba(62,72,87,.78) !important;
  border-radius:18px !important;
  background:rgba(18,22,29,.86) !important;
  -webkit-backdrop-filter:blur(14px) saturate(1.05) !important;
  backdrop-filter:blur(14px) saturate(1.05) !important;
  box-shadow:0 8px 26px rgba(0,0,0,.18) !important;

  transform:none !important;
  opacity:1 !important;
  transition:
    background .14s ease,
    border-color .14s ease,
    box-shadow .14s ease !important;
}

/* Keep all controls alive/visible while the bar is sticky. */
.toolbar > *,
body.header-compact .toolbar > *{
  opacity:1 !important;
  visibility:visible !important;
  align-self:center !important;
}

/* Hamburger uses the exact same top center as the 64px sticky toolbar:
   toolbar top 8px + (64 - 40)/2 = 20px. */
.sidebar-toggle-btn,
body.header-compact .sidebar-toggle-btn{
  top:20px !important;
  left:18px !important;
  width:40px !important;
  height:40px !important;
  z-index:430 !important;

  border-radius:12px !important;
  background:rgba(18,22,29,.82) !important;
  -webkit-backdrop-filter:blur(12px) !important;
  backdrop-filter:blur(12px) !important;

  transform:none !important;
  opacity:1 !important;
  transition:
    background .14s ease,
    opacity .14s ease !important;
}

.sidebar-toggle-btn:hover,
.sidebar-toggle-btn:focus-visible,
body.header-compact .sidebar-toggle-btn:hover,
body.header-compact .sidebar-toggle-btn:focus-visible{
  background:rgba(31,37,48,.94) !important;
}

/* Loading line stays inside the sticky bar. */
.toolbar::after,
body.header-compact .toolbar::after{
  left:12px !important;
  right:12px !important;
  bottom:2px !important;
}

/* The toolbar is still the same object on small screens.
   No alternative compact offset/animation. */
@media(max-width:700px){
  .toolbar,
  body.header-compact .toolbar{
    top:6px !important;
    min-height:60px !important;
    margin-left:50px !important;
    padding:8px 10px !important;
    border-radius:16px !important;
  }

  .sidebar-toggle-btn,
  body.header-compact .sidebar-toggle-btn{
    top:16px !important; /* 6 + (60 - 40)/2 */
    left:12px !important;
  }
}

/* Avoid motion when the sticky state class toggles.
   The class is retained only for compatibility with older JS/features. */
body.header-compact .toolbar,
body.header-compact .sidebar-toggle-btn,
body.header-compact .topbar{
  animation:none !important;
}


/* ===== v0.56 shared header alignment grid =====
   Initial state:
   - hamburger center = artist/title row center
   - artist/title left edge = first toolbar control left edge
   Sticky state:
   - hamburger center = sticky toolbar center
*/

:root{
  --viewer-main-left-pad:22px;
  --viewer-menu-left:18px;
  --viewer-menu-size:40px;
  --viewer-toolbar-left-offset:58px;
  --viewer-toolbar-inner-pad:12px;
  --viewer-topbar-height:80px;
}

/* Main keeps its existing outer spacing. These values are used below
   so title and toolbar share one exact content column. */
.main{
  padding-left:var(--viewer-main-left-pad) !important;
}

/* 22 + 70 = 92px global title start.
   Toolbar first item also starts at 22 + 58 + 12 = 92px. */
.topbar,
body.header-compact .topbar{
  box-sizing:border-box !important;
  min-height:var(--viewer-topbar-height) !important;
  height:var(--viewer-topbar-height) !important;
  margin:0 0 8px !important;
  padding:
    0
    0
    0
    calc(
      var(--viewer-toolbar-left-offset) +
      var(--viewer-toolbar-inner-pad)
    ) !important;

  display:flex !important;
  align-items:center !important;
  justify-content:space-between !important;
  gap:14px !important;
}

.title-line{
  min-height:40px;
  display:flex !important;
  align-items:center !important;
  align-content:center !important;
  gap:10px !important;
}

#artistTitle,
.title{
  display:flex;
  align-items:center;
  min-height:40px;
  margin:0 !important;
  line-height:1.08 !important;
}

/* Status sits on the exact same visual center line as the name. */
#scanState,
.inline-status{
  display:flex;
  align-items:center;
  min-height:40px;
  margin:0 !important;
  line-height:1.2 !important;
}

/* Right-side header controls share the same 40px vertical rail. */
.top-auth-controls,
.topbar > .reload-btn{
  align-self:center !important;
}

/* Keep the existing toolbar dimensions, but make its left-axis explicit. */
.toolbar,
body.header-compact .toolbar{
  box-sizing:border-box !important;
  margin-left:var(--viewer-toolbar-left-offset) !important;
  padding-left:var(--viewer-toolbar-inner-pad) !important;
  padding-right:var(--viewer-toolbar-inner-pad) !important;
}

/* Initial menu position:
   topbar is 80px tall, so top 20px gives a 40px button center at y=40.
   Sticky toolbar: top 8px + 64px/2 = y=40.
   Therefore it is aligned in BOTH states without moving. */
.sidebar-toggle-btn,
body.header-compact .sidebar-toggle-btn{
  box-sizing:border-box !important;
  top:20px !important;
  left:var(--viewer-menu-left) !important;
  width:var(--viewer-menu-size) !important;
  height:var(--viewer-menu-size) !important;
}

/* Make the three hamburger strokes geometrically centered too. */
.sidebar-toggle-btn span{
  width:22px !important;
  height:2.5px !important;
  flex:0 0 2.5px;
}
.sidebar-toggle-btn{
  gap:5px !important;
}

/* Narrow layout uses the same idea:
   title and first tab keep one common left axis,
   hamburger center matches both the initial title row and sticky toolbar. */
@media(max-width:700px){
  :root{
    --viewer-toolbar-left-offset:50px;
    --viewer-toolbar-inner-pad:10px;
    --viewer-topbar-height:72px;
    --viewer-menu-left:12px;
  }

  .topbar,
  body.header-compact .topbar{
    min-height:var(--viewer-topbar-height) !important;
    height:var(--viewer-topbar-height) !important;
    padding-left:
      calc(
        var(--viewer-toolbar-left-offset) +
        var(--viewer-toolbar-inner-pad)
      ) !important;
  }

  /* 6px sticky top + 60px toolbar / 2 = 36px center.
     40px button therefore starts at 16px. */
  .sidebar-toggle-btn,
  body.header-compact .sidebar-toggle-btn{
    top:16px !important;
  }
}

/* v59 · Fromm Live */
.live-shell{
  width:min(1180px,100%);
  margin:0 auto;
  padding:18px 18px 54px;
}
.live-card{
  border:1px solid var(--line);
  border-radius:22px;
  background:linear-gradient(180deg,rgba(28,31,38,.98),rgba(20,22,28,.98));
  box-shadow:0 18px 50px rgba(0,0,0,.22);
  overflow:hidden;
}
.live-head{
  display:flex;
  align-items:center;
  gap:12px;
  padding:16px 18px;
  border-bottom:1px solid var(--line);
}
.live-badge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  height:28px;
  padding:0 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  letter-spacing:.04em;
  background:rgba(255,73,93,.13);
  color:#ff7d8b;
  border:1px solid rgba(255,93,112,.22);
}
.live-badge::before{
  content:"";
  width:7px;
  height:7px;
  border-radius:50%;
  background:currentColor;
  box-shadow:0 0 0 0 rgba(255,125,139,.45);
  animation:livePulse 1.8s infinite;
}
.live-badge.off{
  background:rgba(255,255,255,.05);
  color:var(--muted);
  border-color:var(--line);
}
.live-badge.off::before{animation:none;box-shadow:none}
@keyframes livePulse{
  0%{box-shadow:0 0 0 0 rgba(255,125,139,.42)}
  70%{box-shadow:0 0 0 8px rgba(255,125,139,0)}
  100%{box-shadow:0 0 0 0 rgba(255,125,139,0)}
}
.live-head-text{min-width:0;flex:1}
.live-title{
  font-size:16px;
  font-weight:750;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.live-sub{
  margin-top:3px;
  color:var(--muted);
  font-size:12px;
  line-height:1.45;
}
.live-head-actions{display:flex;gap:8px;align-items:center}
.live-mini-btn{
  height:34px;
  padding:0 12px;
  border:1px solid var(--line);
  border-radius:11px;
  background:rgba(255,255,255,.04);
  color:var(--text);
  cursor:pointer;
  font:inherit;
  font-size:12px;
}
.live-mini-btn:hover{background:rgba(255,255,255,.08)}
.live-mini-btn:disabled{opacity:.45;cursor:default}
.live-stage{
  position:relative;
  min-height:min(62vh,680px);
  background:#08090c;
}
.live-video-grid{
  width:100%;
  min-height:min(62vh,680px);
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));
  place-items:stretch;
}
.live-video-grid.single{display:block}
.live-video-tile{
  position:relative;
  min-height:min(62vh,680px);
  background:#08090c;
  overflow:hidden;
}
.live-video-tile > div,
.live-video-tile video{
  width:100%!important;
  height:100%!important;
  object-fit:contain!important;
}
.live-video-label{
  position:absolute;
  left:12px;
  bottom:12px;
  z-index:3;
  max-width:calc(100% - 24px);
  padding:6px 9px;
  border-radius:9px;
  background:rgba(0,0,0,.5);
  color:#fff;
  font-size:11px;
  backdrop-filter:blur(8px);
}
.live-stage-empty{
  min-height:min(58vh,620px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:9px;
  padding:34px 22px;
  text-align:center;
}
.live-stage-empty .big{font-size:17px;font-weight:750}
.live-stage-empty .small{color:var(--muted);font-size:12px;line-height:1.6;max-width:520px}
.live-spinner{
  width:24px;height:24px;border-radius:50%;
  border:2px solid rgba(255,255,255,.14);
  border-top-color:rgba(255,255,255,.8);
  animation:spin .8s linear infinite;
  margin-bottom:5px;
}
.live-foot{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:46px;
  padding:10px 16px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:12px;
}
.live-foot .status{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-error{color:#ff9aa5}
.live-debug{opacity:.7;font-variant-numeric:tabular-nums}
@media (max-width:700px){
  .live-shell{padding:10px 8px 36px}
  .live-card{border-radius:16px}
  .live-head{align-items:flex-start;flex-wrap:wrap}
  .live-head-actions{width:100%}
  .live-stage,.live-video-grid,.live-video-tile{min-height:56vh}
}



/* ===== v0.63 live control moved into the title row ===== */
/* Keep token + Live together, while logout/reload behave as one compact pair. */
.top-auth-controls{
  gap:8px !important;
}
.header-icon-cluster{
  display:inline-flex;
  align-items:center;
  gap:4px;
  flex:0 0 auto;
}
.header-icon-cluster .reload-btn,
.header-icon-cluster .logout-mini-btn{
  margin:0 !important;
}
.header-live-btn{
  box-sizing:border-box;
  height:40px;
  min-height:40px;
  padding:0 14px !important;
  display:inline-flex !important;
  align-items:center;
  justify-content:center;
  gap:7px;
  flex:0 0 auto;
  border-radius:999px !important;
  font-weight:750;
  line-height:1;
  white-space:nowrap;
}
.header-live-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  box-sizing:border-box;
  background:transparent;
  border:1.5px solid #747d89;
  box-shadow:none;
  flex:0 0 8px;
  transition:background .16s ease,border-color .16s ease,box-shadow .16s ease;
}
/* Selecting the Live tab should stay neutral. The red signal is reserved for
   an actually detected live broadcast. */
.header-live-btn.active{
  background:#12161d !important;
  border-color:var(--line) !important;
  color:var(--muted) !important;
}
.header-live-btn.is-streaming{
  color:#eef2f7 !important;
}
.header-live-btn.is-streaming .header-live-dot{
  background:#ff4d5a;
  border-color:#ff4d5a;
  box-shadow:0 0 0 4px rgba(255,77,90,.12),0 0 12px rgba(255,77,90,.32);
}
/* scanBtn now lives in the same compact cluster as logout. */
.top-auth-controls .reload-btn{
  margin-left:0 !important;
}
@media(max-width:860px){
  .top-auth-controls{gap:6px !important;}
  .header-icon-cluster{gap:3px;}
  .header-live-btn{padding:0 11px !important;}
}
@media(max-width:680px){
  .header-live-btn span:last-child{display:none;}
  .header-live-btn{width:40px;min-width:40px;padding:0 !important;}
}


/* ===== v0.64 full-width resting toolbar + natural hamburger dock =====
   Resting state uses the whole content width (no empty gutter on the left).
   Once the header becomes compact while scrolling, the same sticky toolbar
   glides just to the right of the hamburger instead of sitting underneath it. */
:root{
  --viewer-sticky-toolbar-left-offset:44px;
}

/* At the top of the page, let the toolbar occupy the entire viewer width. */
.toolbar{
  margin-left:0 !important;
  margin-right:0 !important;
  transition:
    margin-left .18s cubic-bezier(.2,.75,.25,1),
    background .14s ease,
    border-color .14s ease,
    box-shadow .14s ease !important;
}

/* After scrolling, reserve only enough room for the hamburger itself.
   main left padding 22 + 44 = 66px, while the 40px hamburger ends at 58px,
   leaving a clean ~8px visual gap between the two surfaces. */
body.header-compact .toolbar{
  margin-left:var(--viewer-sticky-toolbar-left-offset) !important;
}

@media(max-width:700px){
  :root{
    --viewer-sticky-toolbar-left-offset:40px;
  }
  .toolbar{
    margin-left:0 !important;
  }
  body.header-compact .toolbar{
    margin-left:var(--viewer-sticky-toolbar-left-offset) !important;
  }
}


/* ===== v0.65 seamless sticky dock =====
   Keep ONE toolbar geometry from rest -> sticky.
   The toolbar no longer narrows or slides after scrolling; instead it always
   owns the full row and reserves a small internal slot for the hamburger.
   When the normal header scrolls away, the hamburger simply occupies that
   already-reserved slot, so there is no visible resize/alignment correction. */
:root{
  --viewer-dock-content-left:44px;
}

/* Full-width surface at all times. No geometry transition on compact toggle. */
.toolbar,
body.header-compact .toolbar{
  margin-left:0 !important;
  margin-right:0 !important;
  padding-left:var(--viewer-dock-content-left) !important;
  padding-right:12px !important;
  transform:none !important;
  transition:
    background .14s ease,
    border-color .14s ease,
    box-shadow .14s ease !important;
}

/* Keep the title on the same content rail as the first toolbar control.
   Main left pad 22px + 44px = 66px; hamburger ends at 58px, leaving 8px. */
.topbar,
body.header-compact .topbar{
  padding-left:var(--viewer-dock-content-left) !important;
}

/* The menu itself never changes geometry, so the sticky bar meets it naturally. */
.sidebar-toggle-btn,
body.header-compact .sidebar-toggle-btn{
  transform:none !important;
  transition:background .14s ease, opacity .14s ease !important;
}

@media(max-width:700px){
  :root{
    --viewer-dock-content-left:40px;
  }
  .toolbar,
  body.header-compact .toolbar{
    margin-left:0 !important;
    margin-right:0 !important;
    padding-left:var(--viewer-dock-content-left) !important;
    padding-right:10px !important;
  }
  .topbar,
  body.header-compact .topbar{
    padding-left:var(--viewer-dock-content-left) !important;
  }
}


/* v0.66 · quiet offline live state + global LIVE signal dot */

/* ===== v0.67 seamless hamburger notch =====
   At rest the toolbar remains full width. Once it sticks, only the VISUAL
   surface starts after the hamburger while the toolbar layout itself keeps
   the same width and child positions. This avoids the hamburger sitting on
   top of the toolbar border without reintroducing the old resize/slide. */
.toolbar,
body.header-compact .toolbar{
  isolation:isolate;
}

body.header-compact .toolbar{
  background:transparent !important;
  border-color:transparent !important;
  box-shadow:none !important;
  -webkit-backdrop-filter:none !important;
  backdrop-filter:none !important;
}

body.header-compact .toolbar::before{
  content:"";
  position:absolute;
  top:-1px;
  right:-1px;
  bottom:-1px;
  left:var(--viewer-dock-content-left);
  z-index:0;
  pointer-events:none;

  border:1px solid rgba(62,72,87,.78);
  border-radius:18px;
  background:rgba(18,22,29,.86);
  -webkit-backdrop-filter:blur(14px) saturate(1.05);
  backdrop-filter:blur(14px) saturate(1.05);
  box-shadow:0 8px 26px rgba(0,0,0,.18);
}

body.header-compact .toolbar > *{
  position:relative;
  z-index:1;
}

body.header-compact .toolbar::after{
  z-index:2;
  left:calc(var(--viewer-dock-content-left) + 12px) !important;
}

@media(max-width:700px){
  body.header-compact .toolbar::before{
    border-radius:16px;
  }
  body.header-compact .toolbar::after{
    left:calc(var(--viewer-dock-content-left) + 10px) !important;
  }
}


/* ===== v0.68 full-width rest + instant compact dock =====
   Resting state keeps the toolbar full width with no left gutter.
   Exactly when the sticky/compact state begins, the toolbar snaps its own
   left edge to the right of the hamburger. There is NO margin animation,
   so users do not see the bar sliding/resizing into place and the two
   surfaces can never overlap. */
:root{
  --viewer-v68-compact-left:44px;
}

/* Restore the clean full-width resting geometry. */
.toolbar{
  margin-left:0 !important;
  margin-right:0 !important;
  padding-left:12px !important;
  padding-right:12px !important;
  background:rgba(18,22,29,.86) !important;
  border:1px solid rgba(62,72,87,.78) !important;
  box-shadow:0 8px 26px rgba(0,0,0,.18) !important;
  -webkit-backdrop-filter:blur(14px) saturate(1.05) !important;
  backdrop-filter:blur(14px) saturate(1.05) !important;
  transition:background .14s ease,border-color .14s ease,box-shadow .14s ease !important;
}

/* Once docked, the toolbar alone becomes narrower from the left.
   22px main padding + 44px = 66px global edge; the 40px hamburger ends at
   58px, so an ~8px breathing gap remains. */
body.header-compact .toolbar{
  margin-left:var(--viewer-v68-compact-left) !important;
  margin-right:0 !important;
  padding-left:12px !important;
  padding-right:12px !important;
  background:rgba(18,22,29,.86) !important;
  border:1px solid rgba(62,72,87,.78) !important;
  box-shadow:0 8px 26px rgba(0,0,0,.18) !important;
  -webkit-backdrop-filter:blur(14px) saturate(1.05) !important;
  backdrop-filter:blur(14px) saturate(1.05) !important;
}

/* Disable the v0.67 fake notched surface completely. */
body.header-compact .toolbar::before{
  content:none !important;
  display:none !important;
}
body.header-compact .toolbar::after{
  left:12px !important;
  right:12px !important;
}

/* Restore the original title/control alignment from the shared header grid. */
.topbar,
body.header-compact .topbar{
  padding-left:calc(var(--viewer-toolbar-left-offset) + var(--viewer-toolbar-inner-pad)) !important;
}

@media(max-width:700px){
  :root{
    --viewer-v68-compact-left:40px;
  }
  .toolbar{
    margin-left:0 !important;
    padding-left:10px !important;
    padding-right:10px !important;
  }
  body.header-compact .toolbar{
    margin-left:var(--viewer-v68-compact-left) !important;
    padding-left:10px !important;
    padding-right:10px !important;
  }
  body.header-compact .toolbar::after{
    left:10px !important;
    right:10px !important;
  }
}


/* ===== v0.69 smooth compact dock =====
   Same final geometry as v0.68, but restore a short, deliberate dock motion.
   Only the toolbar's left edge animates, so it feels like the bar naturally
   makes room for the hamburger instead of snapping into place. */
.toolbar{
  will-change:margin-left;
  transition:
    margin-left .24s cubic-bezier(.22,.72,.2,1),
    background .14s ease,
    border-color .14s ease,
    box-shadow .14s ease !important;
}
body.header-compact .toolbar{
  margin-left:var(--viewer-v68-compact-left) !important;
}

/* Keep the hamburger visually above the moving toolbar during the brief dock
   transition, so their borders never look fused even while the bar is moving. */
.sidebar-toggle-btn,
body.header-compact .sidebar-toggle-btn{
  z-index:430 !important;
}

@media(max-width:700px){
  .toolbar{
    transition:
      margin-left .22s cubic-bezier(.22,.72,.2,1),
      background .14s ease,
      border-color .14s ease,
      box-shadow .14s ease !important;
  }
}

@media(prefers-reduced-motion:reduce){
  .toolbar{
    transition:background .14s ease,border-color .14s ease,box-shadow .14s ease !important;
  }
}


/* ===== v0.70 masked smooth dock =====
   Keep the v0.69 shrink animation, but reserve the hamburger lane with an
   opaque mask for the entire compact transition. The toolbar can therefore
   animate from full width to its compact width without ever drawing under
   the hamburger button. */
:root{
  --viewer-v70-mask-left:12px;
  --viewer-v70-mask-right:66px;
}

/* The shrinking motion stays visible. */
.toolbar{
  will-change:margin-left;
  transition:
    margin-left .24s cubic-bezier(.22,.72,.2,1),
    background .14s ease,
    border-color .14s ease,
    box-shadow .14s ease !important;
}
body.header-compact .toolbar{
  margin-left:var(--viewer-v68-compact-left) !important;
}

/* Mask the hamburger lane ABOVE the moving toolbar but BELOW the menu.
   This appears immediately when compact mode starts, so there is no frame
   where the toolbar border/background can cross underneath the hamburger. */
body.header-compact::before{
  content:"" !important;
  display:block !important;
  position:fixed !important;
  top:8px !important;
  left:var(--viewer-v70-mask-left) !important;
  width:calc(var(--viewer-v70-mask-right) - var(--viewer-v70-mask-left)) !important;
  height:64px !important;
  z-index:200 !important;
  pointer-events:none !important;
  border:0 !important;
  border-radius:0 14px 14px 0 !important;
  background:var(--bg) !important;
  -webkit-backdrop-filter:none !important;
  backdrop-filter:none !important;
  box-shadow:none !important;
}

/* The menu always sits above the mask. */
.sidebar-toggle-btn,
body.header-compact .sidebar-toggle-btn{
  z-index:430 !important;
}

@media(max-width:700px){
  :root{
    --viewer-v70-mask-left:8px;
    --viewer-v70-mask-right:62px;
  }
  body.header-compact::before{
    top:6px !important;
    height:60px !important;
    border-radius:0 12px 12px 0 !important;
  }
  .toolbar{
    transition:
      margin-left .22s cubic-bezier(.22,.72,.2,1),
      background .14s ease,
      border-color .14s ease,
      box-shadow .14s ease !important;
  }
}

@media(prefers-reduced-motion:reduce){
  .toolbar{
    transition:background .14s ease,border-color .14s ease,box-shadow .14s ease !important;
  }
}


/* ===== v0.71 overlap-proof smooth dock =====
   The fixed menu lane now has a real shield above the toolbar. This shield is
   present before the sticky point too, so there is never a frame where the
   full-width toolbar can paint under the hamburger while the compact class is
   being toggled. Compact state is synchronized to the toolbar's real sticky
   position in JS instead of an arbitrary scrollY threshold. */
.hamburger-dock-shield{
  position:fixed;
  top:8px;
  left:0;
  width:calc(var(--viewer-main-left-pad) + var(--viewer-v68-compact-left));
  height:64px;
  z-index:425;
  pointer-events:none;
  background:var(--bg);
  border:0;
  border-radius:0 14px 14px 0;
  box-shadow:none;
}

/* Retire the body pseudo-mask from v0.70; the real shield above is much more
   reliable across stacking contexts and browser zoom levels. */
body.header-compact::before{
  content:none !important;
  display:none !important;
}

.sidebar-toggle-btn,
body.header-compact .sidebar-toggle-btn{
  z-index:430 !important;
}

/* Keep the desired smooth motion. The shield guarantees that this movement
   can never be seen underneath the menu button. */
.toolbar{
  will-change:margin-left;
  transition:
    margin-left .26s cubic-bezier(.22,.72,.2,1),
    background .14s ease,
    border-color .14s ease,
    box-shadow .14s ease !important;
}
body.header-compact .toolbar{
  margin-left:var(--viewer-v68-compact-left) !important;
}

@media(max-width:700px){
  .hamburger-dock-shield{
    top:6px;
    width:calc(var(--viewer-main-left-pad) + var(--viewer-v68-compact-left));
    height:60px;
    border-radius:0 12px 12px 0;
  }
  .toolbar{
    transition:
      margin-left .24s cubic-bezier(.22,.72,.2,1),
      background .14s ease,
      border-color .14s ease,
      box-shadow .14s ease !important;
  }
}

@media(prefers-reduced-motion:reduce){
  .toolbar{
    transition:background .14s ease,border-color .14s ease,box-shadow .14s ease !important;
  }
}



/* ===== v0.72 integrated sticky hamburger =====
   Different strategy: never shrink/slide the toolbar under the menu.
   At the sticky point the hamburger visually becomes part of the toolbar:
   the toolbar keeps its full outer width, reserves an internal menu slot,
   and the menu drops its separate card surface. This removes the two-surface
   collision entirely while preserving a small, smooth content shift. */
:root{
  --viewer-v72-menu-slot:44px;
}

/* Retire all masks/notches from v0.67-v0.71. */
.hamburger-dock-shield,
body.header-compact::before{
  display:none !important;
  content:none !important;
}

/* The outer toolbar never changes width or left edge. */
.toolbar,
body.header-compact .toolbar{
  margin-left:0 !important;
  margin-right:0 !important;
  transform:none !important;
  clip-path:none !important;
  background:rgba(18,22,29,.86) !important;
  border:1px solid rgba(62,72,87,.78) !important;
  border-radius:18px !important;
  box-shadow:0 8px 26px rgba(0,0,0,.18) !important;
  -webkit-backdrop-filter:blur(14px) saturate(1.05) !important;
  backdrop-filter:blur(14px) saturate(1.05) !important;
  padding-left:12px !important;
  padding-right:12px !important;
  will-change:padding-left;
  transition:
    padding-left .24s cubic-bezier(.22,.72,.2,1),
    background .14s ease,
    border-color .14s ease,
    box-shadow .14s ease !important;
}

/* Once sticky, reserve a slot INSIDE the same toolbar surface for the menu.
   No outer resize => nothing can pass under / collide with the hamburger card. */
body.header-compact .toolbar{
  padding-left:var(--viewer-v72-menu-slot) !important;
}

/* Remove older pseudo-surfaces / loading-line offsets that treated the bar as
   physically narrower. The normal loading line remains inside the real bar. */
body.header-compact .toolbar::before{
  content:none !important;
  display:none !important;
}
body.header-compact .toolbar::after{
  left:var(--viewer-v72-menu-slot) !important;
  right:12px !important;
}

/* At rest the hamburger remains its normal standalone button. When the toolbar
   arrives, the separate card surface dissolves and only the icon remains on
   the toolbar, so there are never two rounded rectangles on top of each other. */
.sidebar-toggle-btn{
  transition:
    background .18s ease,
    border-color .18s ease,
    box-shadow .18s ease,
    color .18s ease !important;
}
body.header-compact .sidebar-toggle-btn{
  background:transparent !important;
  border-color:transparent !important;
  box-shadow:none !important;
  -webkit-backdrop-filter:none !important;
  backdrop-filter:none !important;
}
body.header-compact .sidebar-toggle-btn:hover,
body.header-compact .sidebar-toggle-btn:focus-visible{
  background:rgba(255,255,255,.055) !important;
  border-color:transparent !important;
  box-shadow:none !important;
}

/* Keep the title row on its established v0.56 rail. */
.topbar,
body.header-compact .topbar{
  padding-left:calc(var(--viewer-toolbar-left-offset) + var(--viewer-toolbar-inner-pad)) !important;
}

@media(max-width:700px){
  :root{ --viewer-v72-menu-slot:40px; }
  .toolbar,
  body.header-compact .toolbar{
    margin-left:0 !important;
    padding-left:10px !important;
    padding-right:10px !important;
  }
  body.header-compact .toolbar{
    padding-left:var(--viewer-v72-menu-slot) !important;
  }
  body.header-compact .toolbar::after{
    left:var(--viewer-v72-menu-slot) !important;
    right:10px !important;
  }
}

@media(prefers-reduced-motion:reduce){
  .toolbar,
  .sidebar-toggle-btn{
    transition:none !important;
  }
}


/* ===== v0.73 structural toolbar dock =====
   New strategy: the toolbar is physically moved into a dedicated fixed dock
   BEFORE it reaches the hamburger. No width/margin animation can pass under
   the menu because the two elements never share the same horizontal area.
   The dock follows the toolbar's natural Y position until top:8px, preserving
   the familiar "scroll up and stick" motion. */
:root{
  --viewer-v73-dock-left:66px;
  --viewer-v73-dock-right:22px;
  --viewer-v73-sticky-top:8px;
}

/* In normal document flow the toolbar is genuinely full-width. Browser sticky
   is disabled here; v0.73 JS supplies the sticky behavior through the host. */
.main > .toolbar{
  position:relative !important;
  top:auto !important;
  left:auto !important;
  right:auto !important;
  width:auto !important;
  margin-left:0 !important;
  margin-right:0 !important;
  margin-bottom:16px !important;
  padding-left:12px !important;
  padding-right:12px !important;
  transform:none !important;
  transition:background .14s ease,border-color .14s ease,box-shadow .14s ease !important;
}

.toolbar-dock-host{
  position:fixed;
  left:var(--viewer-v73-dock-left);
  right:var(--viewer-v73-dock-right);
  top:var(--viewer-v73-sticky-top);
  z-index:210;
  display:none;
  pointer-events:none;
}
.toolbar-dock-host.active{
  display:block;
  pointer-events:auto;
}

/* Once moved here, the real toolbar has its own non-overlapping rectangle. */
.toolbar-dock-host > .toolbar,
body.header-compact .toolbar-dock-host > .toolbar{
  position:relative !important;
  top:auto !important;
  left:auto !important;
  right:auto !important;
  width:100% !important;
  min-height:64px !important;
  margin:0 !important;
  padding:10px 12px !important;
  transform:none !important;
  opacity:1 !important;
  background:rgba(18,22,29,.88) !important;
  border:1px solid rgba(62,72,87,.82) !important;
  border-radius:18px !important;
  box-shadow:0 8px 26px rgba(0,0,0,.18) !important;
  -webkit-backdrop-filter:blur(14px) saturate(1.05) !important;
  backdrop-filter:blur(14px) saturate(1.05) !important;
  transition:background .14s ease,border-color .14s ease,box-shadow .14s ease !important;
}

/* Only the CONTENT gets a tiny settling animation. Geometry never animates
   through the hamburger lane. */
.toolbar-dock-host.just-docked > .toolbar > *{
  animation:v73-toolbar-content-in .18s cubic-bezier(.2,.75,.25,1) both;
}
@keyframes v73-toolbar-content-in{
  from{opacity:.72;transform:translateY(3px)}
  to{opacity:1;transform:translateY(0)}
}

/* Keep the hamburger as its own card. It never dissolves into the toolbar. */
.sidebar-toggle-btn,
body.header-compact .sidebar-toggle-btn{
  z-index:430 !important;
  background:rgba(18,22,29,.88) !important;
  border:1px solid rgba(62,72,87,.82) !important;
  box-shadow:0 8px 22px rgba(0,0,0,.14) !important;
  -webkit-backdrop-filter:blur(12px) !important;
  backdrop-filter:blur(12px) !important;
}
body.header-compact .sidebar-toggle-btn:hover,
body.header-compact .sidebar-toggle-btn:focus-visible{
  background:rgba(31,37,48,.96) !important;
  border-color:rgba(78,89,106,.9) !important;
}

/* Old overlap helpers are completely retired. */
.hamburger-dock-shield,
body.header-compact::before,
body.header-compact .toolbar::before{
  display:none !important;
  content:none !important;
}
body.header-compact .toolbar::after{
  left:12px !important;
  right:12px !important;
}

.toolbar-home-placeholder{
  display:block;
  width:100%;
  min-width:0;
  pointer-events:none;
}

@media(max-width:700px){
  :root{
    --viewer-v73-dock-left:62px;
    --viewer-v73-dock-right:12px;
    --viewer-v73-sticky-top:6px;
  }
  .main > .toolbar{
    padding-left:10px !important;
    padding-right:10px !important;
  }
  .toolbar-dock-host > .toolbar,
  body.header-compact .toolbar-dock-host > .toolbar{
    min-height:60px !important;
    padding:8px 10px !important;
    border-radius:16px !important;
  }
}

@media(prefers-reduced-motion:reduce){
  .toolbar-dock-host.just-docked > .toolbar > *{animation:none !important;}
}

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const state = {
  rooms: [],
  room: null,
  messages: [],
  filter: "all",
  sortDirection: "desc",
  chatQuery: "",
  chunkSize: 120,
  initialChunks: 2,
  prefetchAhead: 180,
  infiniteList: [],
  infiniteRendered: 0,
  infiniteObserver: null,
  infiniteLastDate: "",
  infiniteVersion: 0,
  prefetching: new Set(),
  roomCache: new Map(),
  selected: new Set(),
  mediaSequence: new Map(),
  legacyMediaSequence: new Map(),

  // Progressive history loading:
  // load the newest ~500 messages first, then another ~500 near the end.
  pageTarget: 500,
  pageRequestLimit: 500,
  cursorEnd: null,
  hasMoreMessages: true,
  loadingMessages: false,
  seenMessageKeys: new Set(),
  scanGeneration: 0,

  // Full conversation uses its own complete history.
  // Media tabs keep the progressive 500-message API loader.
  chatMessages: [],
  chatHistoryComplete: false,
  chatHistoryLoading: false,
  chatHistoryProgress: 0,
  chatCache: new Map(),
  chatRenderObserver: null,
  chatTopRenderObserver: null,
  chatWindowStart: 0,

  selectedDate: "",
  calendarMonth: null,
  calendarMode: "day",
  calendarYearPageStart: null,

  // Only normal entry into 전체 대화 should jump to the top.
  // Date/reply jumps must not be overwritten by a later auto-top frame.
  chatAutoTopPending: false,

  // Last folder handle / failed items are kept only for this browser session.
  lastSaveRoot: null,
  lastSaveFailures: [],

  // v59 · Fromm Live (viewer only)
  live: {
    loading: false,
    config: null,
    room: null,
    token: "",
    tokenInfo: null,
    client: null,
    remoteTracks: new Map(),
    timer: null,
    connectionSeq: 0,
    currentLiveRoomId: "",
    encryptionIndex: 0,
    encryptionCandidates: [],
    lastError: "",
    status: "idle",
    sdkPromise: null,
    audioBlocked: false,
  },
};

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
function isArtist(m){ return String(m.userType || "").toLowerCase() === "star"; }
function normType(t){
  t = String(t || "").toLowerCase();
  return t === "audio" ? "sound" : t;
}
function isHttpMediaUrl(value){
  if(typeof value !== "string") return false;
  let s = value.trim();
  if(!s) return false;

  if(s.startsWith("//")) s = "https:" + s;

  try{
    const u = new URL(s);
    return u.protocol === "https:" || u.protocol === "http:";
  }catch{
    return false;
  }
}

function normalizeMediaUrl(value){
  if(typeof value !== "string") return "";
  let s = value.trim();
  if(!s) return "";
  if(s.startsWith("//")) s = "https:" + s;
  return isHttpMediaUrl(s) ? s : "";
}

function resolveMediaUrl(m){
  if(!m || typeof m !== "object") return "";

  const t = normType(m.type);

  // Normal/current message shapes first.
  const directKeys = [
    "content","url","mediaUrl","mediaURL","fileUrl","fileURL",
    "audioUrl","audioURL","soundUrl","soundURL",
    "videoUrl","videoURL","imageUrl","imageURL",
    "originalUrl","originalURL","downloadUrl","downloadURL",
    "resourceUrl","resourceURL","sourceUrl","sourceURL"
  ];

  for(const key of directKeys){
    const v = m[key];

    if(typeof v === "string"){
      const direct = normalizeMediaUrl(v);
      if(direct) return direct;

      const raw = v.trim();
      if((raw.startsWith("{") && raw.endsWith("}")) ||
         (raw.startsWith("[") && raw.endsWith("]"))){
        try{
          const found = findMediaUrlDeep(JSON.parse(raw), 0);
          if(found) return found;
        }catch{}
      }
    }else if(v && typeof v === "object"){
      const found = findMediaUrlDeep(v, 0);
      if(found) return found;
    }
  }

  // Legacy Fromm sound messages:
  // the API can return content:"" while thumbnail contains the actual audio URL.
  // Do this ONLY for sound; video/image thumbnails are preview images.
  if(t === "sound"){
    const legacyAudio = normalizeMediaUrl(m.thumbnail || "");
    if(legacyAudio) return legacyAudio;
  }

  const nestedKeys = [
    "media","file","resource","attachment","attachments",
    "audio","sound","video","image","asset","source"
  ];

  for(const key of nestedKeys){
    if(m[key]){
      const found = findMediaUrlDeep(m[key], 0);
      if(found) return found;
    }
  }

  return "";
}

function findMediaUrlDeep(value, depth=0){
  if(depth > 4 || value == null) return "";

  if(typeof value === "string"){
    const direct = normalizeMediaUrl(value);
    if(direct) return direct;

    const raw = value.trim();
    if((raw.startsWith("{") && raw.endsWith("}")) ||
       (raw.startsWith("[") && raw.endsWith("]"))){
      try{
        return findMediaUrlDeep(JSON.parse(raw), depth+1);
      }catch{}
    }
    return "";
  }

  if(Array.isArray(value)){
    for(const item of value){
      const found = findMediaUrlDeep(item, depth+1);
      if(found) return found;
    }
    return "";
  }

  if(typeof value === "object"){
    // Prefer URL-ish keys over arbitrary nested strings.
    const priority = [
      "url","mediaUrl","fileUrl","audioUrl","soundUrl","videoUrl","imageUrl",
      "originalUrl","downloadUrl","resourceUrl","sourceUrl","content"
    ];

    for(const key of priority){
      if(key in value){
        const found = findMediaUrlDeep(value[key], depth+1);
        if(found) return found;
      }
    }

    for(const [key,val] of Object.entries(value)){
      if(/url|media|file|audio|sound|video|image|resource|source|asset/i.test(key)){
        const found = findMediaUrlDeep(val, depth+1);
        if(found) return found;
      }
    }
  }

  return "";
}

function hasUsableMedia(m){
  return ["image","video","sound"].includes(normType(m?.type)) &&
         !!resolveMediaUrl(m);
}

function isMedia(m){
  return ["image","video","sound"].includes(normType(m?.type));
}

function hasReplyPayload(m){
  return !!getQuotedMessage(m);
}

function specialTextState(m){
  if(!m || typeof m !== "object") return null;

  const content = String(m.content || "").trim();
  if(content) return null;

  if(resolveEmoticonUrl(m) || hasEmoticonData(m)){
    return {kind:"emoticon"};
  }

  // Reply-only messages should show the quote card without an extra
  // "[빈 메시지]" line underneath.
  if(hasReplyPayload(m)){
    return {kind:"reply-only"};
  }

  if(m.deletedAt){
    return {kind:"deleted", label:"삭제된 메시지"};
  }

  if(m.blocked === true){
    return {kind:"blocked", label:"표시할 수 없는 메시지"};
  }

  // Some historical/system records are metadata-only.
  const meaningfulKeys = [
    "mentionedMessage","embeddedMentionedMessage","mentionDetailMessage",
    "replyMessage","embeddedReplyMessage","quotedMessage",
    "emoticon","sticker","emoji"
  ];

  if(meaningfulKeys.some(k=>m[k])){
    return {kind:"special", label:"특수 메시지"};
  }

  // No visible payload at all: hide it from the conversation UI.
  return {kind:"hidden-empty"};
}

function resolveEmoticonUrl(m){
  if(!m || typeof m !== "object") return "";

  const candidates = [
    m.emoticon,
    m.emoticonUrl,
    m.emoticonURL,
    m.emoticonImage,
    m.sticker,
    m.stickerUrl,
    m.stickerURL,
    m.emoji,
    m.emojiUrl,
    m.emojiURL
  ];

  for(const candidate of candidates){
    if(candidate == null) continue;

    if(typeof candidate === "string"){
      const direct = normalizeMediaUrl(candidate);
      if(direct) return direct;

      const raw = candidate.trim();
      if((raw.startsWith("{") && raw.endsWith("}")) ||
         (raw.startsWith("[") && raw.endsWith("]"))){
        try{
          const found = findMediaUrlDeep(JSON.parse(raw),0);
          if(found) return found;
        }catch{}
      }
    }else if(typeof candidate === "object"){
      const found = findMediaUrlDeep(candidate,0);
      if(found) return found;
    }
  }

  // Some historical text-emoticon payloads expose the image through thumbnail.
  if(normType(m.type) === "text" &&
     !String(m.content || "").trim() &&
     m.emoticon){
    const thumb = normalizeMediaUrl(m.thumbnail || "");
    if(thumb) return thumb;
  }

  return "";
}

function hasEmoticonData(m){
  if(!m || typeof m !== "object") return false;
  return !!(
    m.emoticon ||
    m.emoticonUrl ||
    m.emoticonURL ||
    m.emoticonImage ||
    m.sticker ||
    m.stickerUrl ||
    m.stickerURL ||
    m.emoji ||
    m.emojiUrl ||
    m.emojiURL
  );
}

function emoticonProxyUrl(m){
  return resolveEmoticonUrl(m);
}

function messageStableKey(m){
  return String(
    m?.messageId ??
    m?.id ??
    m?.starChatId ??
    m?.createdAt ??
    ""
  );
}

function compareMessages(a,b,direction="asc"){
  const ta = new Date(a?.createdAt).getTime() || 0;
  const tb = new Date(b?.createdAt).getTime() || 0;

  if(ta !== tb){
    return direction === "asc" ? (ta - tb) : (tb - ta);
  }

  // Same timestamp: deterministic tie-breaker so cards do not reshuffle.
  const ka = messageStableKey(a);
  const kb = messageStableKey(b);
  const cmp = ka.localeCompare(kb);
  return direction === "asc" ? cmp : -cmp;
}

function dateKey(m){
  const d = new Date(m.createdAt);
  if (Number.isNaN(d.getTime())) return "unknown-date";
  return d.toLocaleDateString("sv-SE"); // YYYY-MM-DD in local timezone
}
function timeLabel(m){
  const d = new Date(m.createdAt);
  if (Number.isNaN(d.getTime())) return "";
  return d.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
}
function mediaSequenceKey(m){
  return String(m?.messageId ?? m?.id ?? m?.starChatId ?? messageStableKey(m));
}
function baseName(m){
  return state.mediaSequence.get(mediaSequenceKey(m)) || `${dateKey(m)}_1`;
}
function legacyBaseName(m){
  return state.legacyMediaSequence.get(mediaSequenceKey(m)) || baseName(m);
}
function mediaFolder(t){
  t = normType(t);

  // v61:
  // - photos + videos are saved directly in the user-selected backup root.
  // - sound keeps the dedicated "audio" subfolder from v60.
  if(t === "sound") return "audio";
  return "";
}

function mediaLocationLabel(t){
  return mediaFolder(t) || "선택 폴더";
}

function legacyMediaFolders(t){
  t = normType(t);

  // Duplicate detection scans the selected root recursively, so both the new
  // root layout and older media/photos/videos layouts remain compatible.
  if(t === "image") return ["","media","photos"];
  if(t === "video") return ["","media","videos"];
  if(t === "sound") return ["audio"];

  return [mediaFolder(t)];
}
function contentTypeExt(ct,t){
  ct = String(ct||"").split(";")[0].trim().toLowerCase();
  const map = {
    "image/jpeg":".jpg","image/png":".png","image/webp":".webp","image/gif":".gif","image/heic":".heic",
    "video/mp4":".mp4","video/quicktime":".mov","video/webm":".webm",
    "audio/mp4":".m4a","audio/x-m4a":".m4a","audio/mpeg":".mp3","audio/aac":".aac",
    "audio/wav":".wav","audio/x-wav":".wav","audio/ogg":".ogg"
  };
  return map[ct] || (normType(t)==="image"?".jpg":normType(t)==="video"?".mp4":".m4a");
}
function previewUrl(m){
  const t = normType(m?.type);

  // For legacy sound messages, thumbnail is the AUDIO URL, not a visual preview.
  if(t === "sound"){
    return proxyUrl(m,false);
  }

  return normalizeMediaUrl(m?.thumbnail || "") || proxyUrl(m,false);
}

function markThumbReady(el){
  const thumb = el?.closest?.(".thumb") || el?.parentElement;
  if(thumb) thumb.classList.add("media-ready");
}

function prefetchImage(url){
  return new Promise(resolve=>{
    if(!url){ resolve(); return; }
    const img = new Image();
    img.decoding = "async";
    img.onload = ()=>resolve();
    img.onerror = ()=>resolve();
    img.src = url;
  });
}

function prefetchMediaRange(startIndex){
  const list = state.infiniteList || [];
  const end = Math.min(startIndex + state.prefetchAhead, list.length);

  for(let i=startIndex;i<end;i++){
    const m = list[i];
    if(!m || !hasUsableMedia(m)) continue;

    const id = String(m.messageId || `${m.createdAt}|${m.type}`);
    if(state.prefetching.has(id)) continue;
    state.prefetching.add(id);

    const t = normType(m.type);

    if(t==="image"){
      // First warm the lightweight preview. Full image is loaded only when the card exists.
      prefetchImage(previewUrl(m));
    }else if(t==="video"){
      // Warm the poster only; never pre-download the whole video.
      if(m.thumbnail) prefetchImage(previewUrl(m));
    }else if(t==="sound"){
      // Warm audio metadata with a detached element.
      try{
        const a = document.createElement("audio");
        a.preload = "metadata";
        a.src = proxyUrl(m,false);
        a.load();
        setTimeout(()=>{ a.src=""; }, 12000);
      }catch{}
    }
  }
}

function proxyUrl(m, download=false){
  // GitHub Pages build: media is requested directly from Fromm/CDN.
  // The companion Chrome extension adjusts the required CORS/origin headers.
  return resolveMediaUrl(m);
}

async function frommApiJson(path, query=null){

  }

  const url = new URL(path, FROMM_API_BASE);

  if(query){
    for(const [key,value] of Object.entries(query)){
      if(value !== undefined && value !== null && value !== ""){
        url.searchParams.set(key,String(value));
      }
    }
  }

  let r;
  try{
    r = await fetch(url.toString(),{
      method:"GET",
      headers:{
        "Authorization":auth.token,
        "uuid":auth.uuid,
        "Accept":"application/json"
      },
      cache:"no-store"
    });
  }catch(e){
    throw friendlyNetworkError(e);
  }

  let data = null;
  const text = await r.text();

  if(text){
    try{
      data = JSON.parse(text);
    }catch{
      data = null;
    }
  }

  if(!r.ok){
    const detail =
      data?.error ||

      data?.detail ||
      text ||

  }

  if(data?.ok === false){
    throw new Error(data?.error || data?.message || "Fromm API 요청 실패");
  }

  return data;
}

const AGORA_WEB_SDK_URL = "https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js";

async function frommApiRequest(path,{method="GET",query=null,body=null}={}){
  const auth = currentAuth();

  }

  if(query){

      if(value !== undefined && value !== null && value !== ""){
        url.searchParams.set(key,String(value));
      }
    }
  }

  const headers = {
    "Authorization":auth.token,
    "uuid":auth.uuid,
    "Accept":"application/json"
  };
  if(body !== null) headers["Content-Type"] = "application/json";

  let r;
  try{
    r = await fetch(url.toString(),{
      method,
      headers,
      body: body === null ? undefined : JSON.stringify(body),
      cache:"no-store"
    });
  }catch(e){
    throw friendlyNetworkError(e);
  }

  const text = await r.text();
  let data = null;
  if(text){
    try{ data = JSON.parse(text); }catch{}
  }

    const detail = data?.message || data?.error || data?.detail || text || `HTTP ${r.status}`;
    throw new Error(`Fromm API 요청 실패: ${String(detail).slice(0,500)}`);
  }
  return data;
}

function deepFindObject(value,predicate,depth=0,seen=new Set()){
  if(depth > 9 || value == null || typeof value !== "object") return null;
  if(seen.has(value)) return null;
  seen.add(value);
  try{ if(predicate(value)) return value; }catch{}
  if(Array.isArray(value)){
    for(const item of value){
      const found = deepFindObject(item,predicate,depth+1,seen);
      if(found) return found;
    }
  }else{
    for(const item of Object.values(value)){
      const found = deepFindObject(item,predicate,depth+1,seen);
      if(found) return found;
    }
  }
  return null;
}

function deepFindValue(value,keyNames,depth=0,seen=new Set()){
  if(depth > 9 || value == null || typeof value !== "object") return undefined;
  if(seen.has(value)) return undefined;
  seen.add(value);
  const keys = new Set(keyNames.map(x=>String(x).toLowerCase()));
  if(!Array.isArray(value)){
    for(const [k,v] of Object.entries(value)){
      if(keys.has(String(k).toLowerCase()) && v !== undefined && v !== null && v !== "") return v;
    }
  }
  for(const item of (Array.isArray(value) ? value : Object.values(value))){
    const found = deepFindValue(item,keyNames,depth+1,seen);
    if(found !== undefined) return found;
  }
  return undefined;
}

function findAgoraToken(value,depth=0,seen=new Set()){
  if(depth > 9 || value == null) return "";
  if(typeof value === "string"){
    const v=value.trim();
    if(/^(006|007)[A-Za-z0-9+/=_-]{30,}$/.test(v)) return v;
    return "";
  }
  if(typeof value !== "object" || seen.has(value)) return "";
  seen.add(value);

  if(!Array.isArray(value)){
    const preferred=["agoraToken","token","rtcToken","accessToken"];
    for(const key of preferred){
      if(key in value){
        const t=findAgoraToken(value[key],depth+1,seen);
        if(t) return t;
      }
    }
  }
  for(const item of (Array.isArray(value) ? value : Object.values(value))){
    const t=findAgoraToken(item,depth+1,seen);
    if(t) return t;
  }
  return "";
}

function base64Bytes(input){
  let s=String(input||"").replace(/-/g,"+").replace(/_/g,"/");
  while(s.length % 4) s += "=";
  const bin=atob(s);
  const out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}

async function inflateAgoraToken(bytes){
  if(typeof DecompressionStream === "undefined"){
    throw new Error("이 브라우저는 Agora 토큰 분석에 필요한 압축 해제를 지원하지 않습니다.");
  }
  const ds=new DecompressionStream("deflate");
  const stream=new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

function agoraTokenReader(bytes){
  let p=0;
  const dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
  const td=new TextDecoder();
  const need=n=>{ if(p+n>bytes.length) throw new Error("Agora 토큰 형식이 예상과 다릅니다."); };
  return {
    u16(){ need(2); const v=dv.getUint16(p,true); p+=2; return v; },
    u32(){ need(4); const v=dv.getUint32(p,true); p+=4; return v; },
    raw(n){ need(n); const v=bytes.slice(p,p+n); p+=n; return v; },
    bytes(){ const n=this.u16(); return this.raw(n); },
    str(){ return td.decode(this.bytes()); },
    skipIntMap(){ const n=this.u16(); for(let i=0;i<n;i++){this.u16();this.u32();} },
    pos(){return p;}
  };
}

async function parseAgoraToken(token){
  token=String(token||"").trim();
  if(token.startsWith("006")){
    return {
      version:"006",
      appId:token.slice(3,35),
      channelName:"",
      uid:"",
      issueTs:0,
      expire:0
    };
  }
  if(!token.startsWith("007")) throw new Error("지원하지 않는 Agora 토큰 형식입니다.");

  const packed=base64Bytes(token.slice(3));
  const raw=await inflateAgoraToken(packed);
  const r=agoraTokenReader(raw);
  r.bytes(); // signature
  const appId=r.str();
  const issueTs=r.u32();
  const expire=r.u32();
  r.u32(); // salt
  const serviceCount=r.u16();
  let channelName="";
  let uid="";

  for(let i=0;i<serviceCount;i++){
    const type=r.u16();
    r.skipIntMap();
    if(type===1){
      const ch=r.str();
      const id=r.str();
      if(!channelName){ channelName=ch; uid=id; }
    }else if(type===2 || type===5){
      r.str();
    }else if(type===3 || type===6){
      const ch=r.str(); r.str();
      if(!channelName) channelName=ch;
    }else if(type===4){
      // no extra payload
    }else if(type===7){
      r.str(); r.str(); r.u16();
    }else if(type===8){
      // RTM2 is not required for video playback. Stop parsing unknown nested permissions safely.
      break;
    }else{
      break;
    }
  }
  return {version:"007",appId,channelName,uid,issueTs,expire};
}

function saltBytes(value){
  if(value == null || value === "") return null;
  if(value instanceof Uint8Array) return value.length===32 ? value : null;
  if(Array.isArray(value)){
    const a=new Uint8Array(value.map(v=>Number(v)&255));
    return a.length===32 ? a : null;
  }
  const s=String(value).trim();
  if(/^[0-9a-f]{64}$/i.test(s)){
    const a=new Uint8Array(32);
    for(let i=0;i<32;i++) a[i]=parseInt(s.slice(i*2,i*2+2),16);
    return a;
  }
  try{
    const a=base64Bytes(s);
    if(a.length===32) return a;
  }catch{}
  const text=new TextEncoder().encode(s);
  return text.length===32 ? text : null;
}

function liveEncryptionCandidates(room){
  const key=deepFindValue(room,["encryptionKey"]);
  const salt=deepFindValue(room,["encryptionSalt"]);
  if(!key) return [{mode:"none",key:"",salt:null}];
  const sb=saltBytes(salt);
  if(sb){
    return [
      {mode:"aes-128-gcm2",key:String(key),salt:sb},
      {mode:"aes-256-gcm2",key:String(key),salt:sb}
    ];
  }
  return [
    {mode:"aes-128-gcm",key:String(key),salt:null},
    {mode:"aes-256-gcm",key:String(key),salt:null},
    {mode:"aes-128-xts",key:String(key),salt:null},
    {mode:"aes-256-xts",key:String(key),salt:null}
  ];
}

    await client.subscribe(user,mediaType);

async function requestViewerToken(liveRoomId){

        method:"POST",
        body:{role}
      });
      const token=findAgoraToken(body);
      if(token) return {body,token};
      lastError=new Error("라이브 토큰 응답에서 Agora 토큰을 찾지 못했습니다.");
    }catch(e){ lastError=e; }
  }
  throw lastError || new Error("라이브 시청 토큰을 발급받지 못했습니다.");
}
