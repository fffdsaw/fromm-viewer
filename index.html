async function connectAgoraLive({candidateIndex=0}={}){
  const room=state.live.room;
  const token=state.live.token;
  const info=state.live.tokenInfo;
  if(!room || !token || !info) return;

  const appId=String(info.appId || deepFindValue(room,["agoraAppId","appId"]) || "");
  const channelName=String(info.channelName || deepFindValue(room,["agoraChannelName","channelName","rtcChannelName"]) || "");
  const uid=info.uid || null;
  if(!appId || !channelName){
    throw new Error("Agora App ID 또는 실제 채널명을 확인하지 못했습니다. 라이브가 켜진 상태에서 다시 시도해주세요.");
  }

  const AgoraRTC=await ensureAgoraRtcSdk();
  await stopLivePlayback();
  const seq=++state.live.connectionSeq;
  const client=AgoraRTC.createClient({mode:"live",codec:"vp8"});
  state.live.client=client;

  try{ await client.setClientRole("audience",{level:1}); }catch{
    try{ await client.setClientRole("audience"); }catch{}
  }

  const candidates=state.live.encryptionCandidates.length
    ? state.live.encryptionCandidates
    : liveEncryptionCandidates(room);
  state.live.encryptionCandidates=candidates;
  state.live.encryptionIndex=Math.min(candidateIndex,candidates.length-1);
  const enc=candidates[state.live.encryptionIndex];
  if(enc && enc.mode!=="none"){
    client.setEncryptionConfig(enc.mode,enc.key,enc.salt || undefined);
  }

  let cryptRetryQueued=false;
  client.on("crypt-error",()=>{
    if(seq!==state.live.connectionSeq || cryptRetryQueued) return;
    cryptRetryQueued=true;
    const next=state.live.encryptionIndex+1;
    if(next < state.live.encryptionCandidates.length){
      liveStatusText("암호화 방식 자동 재시도 중...");
      setTimeout(()=>connectAgoraLive({candidateIndex:next}).catch(e=>liveStatusText(e.message,true)),250);
    }else{
      liveStatusText("라이브 암호화 설정이 맞지 않아 영상을 해독하지 못했습니다.",true);
    }
  });
  client.on("user-published",(user,mediaType)=>subscribeLiveUser(user,mediaType));
  client.on("user-unpublished",(user,mediaType)=>{
    if(mediaType==="video") document.getElementById(liveTileId(user.uid))?.remove();
  });
  client.on("user-left",user=>document.getElementById(liveTileId(user.uid))?.remove());
  client.on("token-privilege-will-expire",renewLiveToken);
  client.on("token-privilege-did-expire",renewLiveToken);
  client.on("connection-state-change",(cur)=>{
    if(seq!==state.live.connectionSeq) return;
    if(cur==="RECONNECTING") liveStatusText("LIVE 재연결 중...");
    if(cur==="CONNECTED") liveStatusText("LIVE 연결됨 · 영상 스트림 대기 중");
    if(cur==="DISCONNECTED" && state.live.config?.isStreaming) liveStatusText("LIVE 연결이 끊겼습니다.",true);
  });

  liveStatusText("Agora LIVE 연결 중...");
  await client.join(appId,channelName,token,uid);
  if(seq!==state.live.connectionSeq) return;
  liveStatusText("LIVE 연결됨 · 영상 스트림 대기 중");

  // Subscribe to users already present in the room as well.
  for(const user of client.remoteUsers || []){
    if(user.hasVideo) await subscribeLiveUser(user,"video");
    if(user.hasAudio) await subscribeLiveUser(user,"audio");
  }
}

async function probeLiveIndicator(){
  if(!state.room){
    state.live.config=null;
    syncHeaderLiveIndicator();
    return;
  }

  const generation=state.scanGeneration;
  try{
    const hostChatRoomId=String(state.room?.hostChatRoomId || state.room?.host?.userId || "");
    if(!hostChatRoomId) return;

    const configResp=await frommApiRequest("/v2/group-live/config",{
      query:{hostChatRoomId}
    });
    if(generation!==state.scanGeneration) return;

    const config=deepFindObject(configResp,obj=>
      Object.prototype.hasOwnProperty.call(obj,"isStreaming") &&
      (Object.prototype.hasOwnProperty.call(obj,"liveRoomId") || Object.prototype.hasOwnProperty.call(obj,"channelId"))
    ) || configResp?.data?.groupLive || configResp?.data || null;

    state.live.config=config || {isStreaming:false};
    syncHeaderLiveIndicator();
  }catch(e){
    // Indicator polling is intentionally silent. Keep the last known state on
    // a temporary network/API failure instead of flashing the signal off.
    console.debug("live indicator probe failed",e);
  }
}

async function refreshLiveStatus({force=false,autoplay=true,silent=false}={}){
  if(state.filter!=="live" || !state.room) return;
  if(state.live.loading && !force) return;
  const generation=state.scanGeneration;
  state.live.loading=true;
  state.live.status="loading";
  if(!silent) renderLiveView();
  syncLoadingUI();

  try{
    const hostChatRoomId=String(state.room?.hostChatRoomId || state.room?.host?.userId || "");
    if(!hostChatRoomId) throw new Error("아티스트 채팅방 ID를 찾지 못했습니다.");

    const configResp=await frommApiRequest("/v2/group-live/config",{
      query:{hostChatRoomId}
    });
    if(generation!==state.scanGeneration || state.filter!=="live") return;

    const config=deepFindObject(configResp,obj=>
      Object.prototype.hasOwnProperty.call(obj,"isStreaming") &&
      (Object.prototype.hasOwnProperty.call(obj,"liveRoomId") || Object.prototype.hasOwnProperty.call(obj,"channelId"))
    ) || configResp?.data?.groupLive || configResp?.data || null;

    state.live.config=config || {isStreaming:false};
    syncHeaderLiveIndicator();
    const isStreaming=!!state.live.config?.isStreaming;
    const liveRoomId=String(state.live.config?.liveRoomId || "");

    if(!isStreaming || !liveRoomId){
      await stopLivePlayback({clearRoom:true});
      state.live.status="offline";
      state.live.lastError="";
      // A silent poll must still repaint when an active live ends.
      renderLiveView();
      return;
    }

    // Same live is already connected: keep the playing DOM intact during polling.
    if(!force && state.live.currentLiveRoomId===liveRoomId && state.live.client){
      state.live.status="playing";
      syncLiveToolbarControls();
      return;
    }

    state.live.currentLiveRoomId=liveRoomId;
    const roomResp=await frommApiRequest(`/v2/group-live/rooms/${encodeURIComponent(liveRoomId)}`);
    if(generation!==state.scanGeneration || state.filter!=="live") return;
    state.live.room=deepFindObject(roomResp,obj=>
      String(obj?.id||"")===liveRoomId ||
      (Object.prototype.hasOwnProperty.call(obj,"encryptionKey") && Object.prototype.hasOwnProperty.call(obj,"title"))
    ) || roomResp?.data?.liveRoom || roomResp?.data || roomResp;

    const tokenResult=await requestViewerToken(liveRoomId);
    state.live.token=tokenResult.token;
    state.live.tokenInfo=await parseAgoraToken(tokenResult.token);
    state.live.encryptionCandidates=liveEncryptionCandidates(state.live.room);
    state.live.encryptionIndex=0;
    state.live.status="ready";
    state.live.lastError="";

    renderLiveView();
    if(autoplay) await connectAgoraLive({candidateIndex:0});
  }catch(e){
    if(generation!==state.scanGeneration || state.filter!=="live") return;
    state.live.status="error";
    state.live.lastError=String(e?.message || e || "라이브 연결 실패");
    renderLiveView();
    liveStatusText(state.live.lastError,true);
  }finally{
    if(generation===state.scanGeneration){
      state.live.loading=false;
      syncLoadingUI();
      syncLiveToolbarControls();
    }
  }
}

function stopLivePolling(){
  if(state.live.timer){ clearInterval(state.live.timer); state.live.timer=null; }
}

function startLivePolling(){
  stopLivePolling();
  state.live.timer=setInterval(()=>{
    if(!state.room) return;
    if(state.filter==="live"){
      refreshLiveStatus({silent:true,autoplay:true}).catch(()=>{});
    }else{
      probeLiveIndicator().catch(()=>{});
    }
  },15000);
}

const AUTH_TOKEN_KEY = "fromm_local_access_token_v1";
const AUTH_UUID_KEY = "fromm_local_device_id_v1";
const AUTH_REFRESH_KEY = "fromm_refresh_token";
const AUTH_RESOURCE_KEY = "fromm_resource_token";
const AUTH_EXPIRY_KEY = "fromm_token_expiry";
const AUTH_EMAIL_KEY = "fromm_login_email_v1";

function readSavedAuth(){
  try{
    return {
      token: localStorage.getItem(AUTH_TOKEN_KEY) || "",
      uuid: localStorage.getItem(AUTH_UUID_KEY) || ""
    };
  }catch{
    return {token:"",uuid:""};
  }
}

function saveAuthLocally(token,uuid,extra={}){
  try{
    localStorage.setItem(AUTH_TOKEN_KEY, token);
    localStorage.setItem(AUTH_UUID_KEY, uuid);

    if(extra.email){
      localStorage.setItem(AUTH_EMAIL_KEY, extra.email);
    }
    if(extra.refreshToken){
      localStorage.setItem(AUTH_REFRESH_KEY, extra.refreshToken);
    }
    if(extra.resourceToken){
      localStorage.setItem(AUTH_RESOURCE_KEY, extra.resourceToken);
    }
    if(extra.expiry){
      localStorage.setItem(AUTH_EXPIRY_KEY, String(extra.expiry));
    }
  }catch(e){
    console.warn("인증정보 저장 실패", e);
  }
}

function fillSavedAuth(){
  const saved = readSavedAuth();

  try{
    const email = localStorage.getItem(AUTH_EMAIL_KEY) || "";
    if(email && $("#loginEmail")){
      $("#loginEmail").value = email;
    }
  }catch{}

  return saved;
}

}

function validLoginEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || "").trim());
}

function getOrCreateLoginDeviceId(){
  let id = $("#loginDeviceId")?.value.trim() || "";

  if(!id){
    try{
      id =
        localStorage.getItem(AUTH_UUID_KEY) ||
        localStorage.getItem("fromm_device_id") ||
        "";
    }catch{}
  }

  if(!id){
    id = crypto.randomUUID();
  }

  if($("#loginDeviceId")){
    $("#loginDeviceId").value = id;
  }

  return id;
}

async function encryptLoginPassword(password,deviceId){
  const encoder = new TextEncoder();
  const keySource = encoder.encode(deviceId);
  const rawKey = keySource.slice(0,32);

  if(![16,24,32].includes(rawKey.length)){
    throw new Error("Device ID 형식이 올바르지 않습니다.");
  }

  const iv = rawKey.slice(0,16);

  const cryptoKey = await crypto.subtle.importKey(
    "raw",
    rawKey,
    {name:"AES-CBC"},
    false,
    ["encrypt"]
  );

  const encryptedBuffer = await crypto.subtle.encrypt(
    {name:"AES-CBC",iv},
    cryptoKey,
    encoder.encode(password)
  );

  return Array.from(new Uint8Array(encryptedBuffer))
    .map(b=>b.toString(16).padStart(2,"0"))
    .join("");
}

function readTokenExpiryMs(){
  let raw = "";

  try{
    raw =
      localStorage.getItem(AUTH_EXPIRY_KEY) ||
      localStorage.getItem("fromm_token_expiry") ||
      "";
  }catch{}

  if(!raw) return 0;

  const n = Number(raw);

  if(!Number.isFinite(n) || n <= 0){
    return 0;
  }

  // v0.46 stored an epoch value in seconds.
  return n < 10_000_000_000 ? n * 1000 : n;
}

function formatTokenRemaining(ms){
  if(ms <= 0){
    return "만료";
  }

  const totalMinutes = Math.max(0,Math.floor(ms/60000));
  const days = Math.floor(totalMinutes/1440);
  const hours = Math.floor((totalMinutes%1440)/60);
  const minutes = totalMinutes%60;

  // Similar compact style to the reference site's 91h 34m timer.
  if(days > 0){
    return `${days*24 + hours}h ${minutes}m`;
  }

  return `${hours}h ${minutes}m`;
}

let tokenCountdownTimer = null;

function stopTokenCountdown(){
  if(tokenCountdownTimer){
    clearInterval(tokenCountdownTimer);
    tokenCountdownTimer = null;
  }
}

function syncTokenCountdown(){
  const wrap = $("#tokenLifeWrap");
  const text = $("#tokenLifeText");

  if(!wrap || !text){
    return;
  }

  const expiry = readTokenExpiryMs();

  // Tokens entered/saved before email-login support may have no expiry metadata.
  if(!expiry){
    text.textContent = "유효시간 확인불가";
    wrap.classList.remove("expiring","expired");
    return;
  }

  const remaining = expiry - Date.now();

  text.textContent = formatTokenRemaining(remaining);
  wrap.classList.toggle(
    "expiring",
    remaining > 0 && remaining <= 6*60*60*1000
  );
  wrap.classList.toggle("expired",remaining <= 0);

  if(remaining <= 0){
    stopTokenCountdown();
    setActiveAuth();

    showLoginGate(
      "로그인 유효시간이 끝났습니다. 다시 로그인해주세요.",
      "error"
    );
  }
}

function startTokenCountdown(){
  stopTokenCountdown();
  syncTokenCountdown();

  tokenCountdownTimer = setInterval(
    syncTokenCountdown,
    30000
  );
}

async function checkLoginEmail(){
  const email = $("#loginEmail").value.trim();

  $("#loginBtn").disabled = true;

  if(!validLoginEmail(email)){
    setLoginStatus("이메일 형식을 확인해주세요.","error");
    return;
  }

  $("#checkEmailBtn").disabled = true;
  setLoginStatus("이메일 확인 중...");

  try{
    const response = await fetch(
      "https://account-api.frommyarti.com/auth/exist",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json; charset=UTF-8"
        },
        body:JSON.stringify({username:email})
      }
    );

    const text = await response.text();
    let data = {};

    try{
      data = text ? JSON.parse(text) : {};
    }catch{}

    if(response.ok && data?.success === true){
      $("#loginBtn").disabled = false;

      setLoginStatus(
        "이메일 확인 완료. 비밀번호를 입력하고 로그인하세요.",
        "ok"
      );

      try{
        localStorage.setItem(AUTH_EMAIL_KEY,email);
      }catch{}
    }else{
      setLoginStatus(
        data?.message || "등록된 Fromm 계정을 확인하지 못했습니다.",
        "error"
      );
    }
  }catch(e){
    setLoginStatus(
      "이메일 확인 요청에 실패했습니다. 확장프로그램이 켜져 있는지 확인해주세요.",
      "error"
    );
  }finally{
    $("#checkEmailBtn").disabled = false;
  }
}

async function loginWithFromm(){
  const email = $("#loginEmail").value.trim();
  const password = $("#loginPassword").value;

  if(!validLoginEmail(email)){
    setLoginStatus("이메일 형식을 확인해주세요.","error");
    return;
  }

  if(!password){
    setLoginStatus("비밀번호를 입력해주세요.","error");
    return;
  }

  const btn = $("#loginBtn");
  btn.disabled = true;
  setLoginStatus("로그인 중...");

  try{
    const deviceId = getOrCreateLoginDeviceId();
    const encryptedHex = await encryptLoginPassword(password,deviceId);

    const response = await fetch(
      "https://account-api.frommyarti.com/auth/signin",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json; charset=UTF-8",
          "uuid":deviceId
        },
        body:JSON.stringify({
          username:email,
          password:encryptedHex,
          deviceId,
          from:"store",
          allowUpdateDeviceId:true
        })
      }
    );

    const text = await response.text();
    let data = {};

    try{
      data = text ? JSON.parse(text) : {};
    }catch{}

    const responseData = data?.data;

    if(!response.ok || !data?.success || !responseData?.accessToken){
      throw new Error(
        data?.message ||
        data?.error ||
        "로그인 정보를 확인해주세요."
      );
    }

    const expiresIn = Number(responseData.expiresIn || 0);

    const expiry = expiresIn > 0
      ? Math.floor(Date.now()/1000) + expiresIn
      : "";

    setActiveAuth(
      responseData.accessToken,
      deviceId
    );

    await loadRooms();

    saveAuthLocally(
      responseData.accessToken,
      deviceId,
      {
        email,
        refreshToken:responseData.refreshToken || "",
        resourceToken:responseData.resourceToken || "",
        expiry
      }
    );

    try{
      localStorage.setItem(
        "fromm_access_token",
        responseData.accessToken
      );
      localStorage.setItem(
        "fromm_device_id",
        deviceId
      );

      if(responseData.refreshToken){
        localStorage.setItem(
          "fromm_refresh_token",
          responseData.refreshToken
        );
      }

      if(responseData.resourceToken){
        localStorage.setItem(
          "fromm_resource_token",
          responseData.resourceToken
        );
      }

      if(expiry){
        localStorage.setItem(
          "fromm_token_expiry",
          String(expiry)
        );
      }
    }catch{}

    $("#loginPassword").value = "";

    hideLoginGate();
    startTokenCountdown();
    return true;
  }catch(e){
    setActiveAuth();

    setLoginStatus(
      e?.message || "로그인에 실패했습니다.",
      "error"
    );

    return false;
  }finally{
    btn.disabled = false;
  }
}

async function connectSavedAuth({silent=false}={}){
  const saved = readSavedAuth();

  if(!saved.token || !saved.uuid){
    showLoginGate();
    return false;
  }

  const expiry = readTokenExpiryMs();

  if(expiry && expiry <= Date.now()){
    setActiveAuth();

    showLoginGate(
      "저장된 로그인 유효시간이 끝났습니다. 다시 로그인해주세요.",
      "error"
    );

    return false;
  }

  setActiveAuth(saved.token,saved.uuid);

  try{
    await loadRooms();

    hideLoginGate();
    startTokenCountdown();
    return true;
  }catch(e){
    setActiveAuth();

    showLoginGate(
      "저장된 로그인이 만료됐거나 유효하지 않습니다. 다시 로그인해주세요.",
      "error"
    );

    return false;
  }
}

async function autoConnectSaved(){
  fillSavedAuth();

  const saved = readSavedAuth();

  if(!saved.token || !saved.uuid){
    showLoginGate();
    return false;
  }

  return connectSavedAuth({silent:true});
}

function roomCacheKey(){
  return String(state.room?.hostChatRoomId || "");
}

function isCurrentTabLoading(){
  if(!state.room) return false;

  if(state.filter === "live"){
    return !!state.live.loading;
  }

  if(state.filter === "all"){
    return !!state.chatHistoryLoading || !state.chatHistoryComplete;
  }

  return !!state.loadingMessages;
}

function syncLoadingUI(){
  const loading = isCurrentTabLoading();

  document.body.classList.toggle("data-loading", loading);

  const toolbar = document.querySelector(".toolbar");
  if(toolbar){
    toolbar.classList.toggle("is-loading", loading);
    toolbar.setAttribute("aria-busy", loading ? "true" : "false");
  }

  const scanBtn = $("#scanBtn");
  if(scanBtn){
    const anyLoading = !!state.loadingMessages || !!state.chatHistoryLoading || !!state.live.loading;
    scanBtn.classList.toggle("loading", anyLoading);

    scanBtn.setAttribute(
      "aria-label",
      anyLoading ? "불러오는 중" : "다시 불러오기"
    );
    scanBtn.title = anyLoading ? "불러오는 중" : "다시 불러오기";
  }

  // Clean up spinner nodes from older versions if the page was hot-reloaded.
  $$(".tab-loading-spinner").forEach(el=>el.remove());
}

}

function saveRoomCache(){
  const key = roomCacheKey();
  if(!key) return;

  state.roomCache.set(key,{
    messages: state.messages,
    cursorEnd: state.cursorEnd ? new Date(state.cursorEnd).toISOString() : null,
    hasMoreMessages: state.hasMoreMessages,
    pageRequestLimit: state.pageRequestLimit
  });
}

function restoreRoomCache(entry){
  state.messages = Array.isArray(entry?.messages) ? entry.messages : [];
  state.cursorEnd = entry?.cursorEnd ? new Date(entry.cursorEnd) : new Date();
  state.hasMoreMessages = entry?.hasMoreMessages !== false;
  state.pageRequestLimit = Number(entry?.pageRequestLimit || 500);

  state.seenMessageKeys = new Set(
    state.messages.map(m=>String(m.messageId || `${m.createdAt}|${m.type}|${m.content}`))
  );

  buildMediaSequences();
  updateHistoryStatus("캐시");
}

function resetHistoryPaging(){
  state.messages = [];
  state.cursorEnd = new Date();
  state.hasMoreMessages = true;
  state.loadingMessages = false;
  state.pageRequestLimit = 500;
  state.seenMessageKeys = new Set();

  state.mediaSequence.clear();
  state.legacyMediaSequence.clear();
  disconnectInfiniteObserver();
  state.infiniteList = [];
  state.infiniteRendered = 0;
  state.infiniteLastDate = "";
  state.prefetching.clear();
}

function resetFullChatHistory(){
  if(state.chatRenderObserver){
    state.chatRenderObserver.disconnect();
    state.chatRenderObserver = null;
  }

  state.chatMessages = [];
  state.chatHistoryComplete = false;
  state.chatHistoryLoading = false;
  state.chatHistoryProgress = 0;
}

function chatCacheKey(){
  return String(state.room?.hostChatRoomId || "");
}

function restoreFullChatCache(){
  const cached = state.chatCache.get(chatCacheKey());
  if(!cached?.length) return false;

  state.chatMessages = cached;
  state.chatHistoryComplete = true;
  state.chatHistoryLoading = false;
  state.chatHistoryProgress = cached.length;
  buildMediaSequences();
  renderDateCalendar();
  return true;
}

async function ensureFullChatHistory(){
  if(!state.room) return false;
  if(state.chatHistoryComplete) return true;

  if(state.chatHistoryLoading){
    while(state.chatHistoryLoading){
      await sleep(80);
    }
    return state.chatHistoryComplete;
  }

  if(restoreFullChatCache()){
    return true;
  }

  const generation = state.scanGeneration;
  const roomId = String(state.room.hostChatRoomId);

  state.chatHistoryLoading = true;
  state.chatHistoryProgress = 0;
  syncLoadingUI();

  const seen = new Set();
  const all = [];

  let cursorEnd = new Date();
  let requestLimit = 500;
  let safety = 0;

  try{
    while(true){
      if(generation !== state.scanGeneration) return false;

      safety++;
      if(safety > 10000){
        throw new Error("전체 대화 페이지 안전 제한에 도달했습니다.");
      }

      let data;
      try{
        data = await requestHistoryPage(roomId,cursorEnd,requestLimit);
      }catch(e){
        if(requestLimit > 100){
          requestLimit = 100;
          data = await requestHistoryPage(roomId,cursorEnd,100);
        }else{
          throw e;
        }
      }

      if(generation !== state.scanGeneration) return false;

      const batch = data?.data?.messages || [];
      if(!batch.length) break;

      for(const msg of batch){
        const key = String(msg.messageId || `${msg.createdAt}|${msg.type}|${msg.content}`);
        if(!seen.has(key)){
          seen.add(key);
          all.push(msg);
        }
      }

      state.chatHistoryProgress = all.length;

      if(state.filter === "all"){
        $("#scanState").textContent =
          `${state.room?.host?.nick || "아티스트"} · 전체 대화 준비 중 ${all.length.toLocaleString()}개...`;
      }

      const dated = batch
        .filter(msg=>msg.createdAt)
        .sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));

      if(!dated.length) break;

      const next = new Date(new Date(dated[0].createdAt).getTime()-1);

      if(!Number.isFinite(next.getTime()) || next >= cursorEnd){
        break;
      }

      cursorEnd = next;
    }

    if(generation !== state.scanGeneration) return false;

    all.sort((a,b)=>compareMessages(a,b,"asc"));

    state.chatMessages = all;
    state.chatHistoryComplete = true;
    state.chatHistoryProgress = all.length;
    state.chatCache.set(chatCacheKey(), all);

    buildMediaSequences();
    renderDateCalendar();

    if(state.filter === "all"){
      $("#scanState").textContent =
        `${state.room?.host?.nick || "아티스트"} · 전체 대화 ${all.length.toLocaleString()}개 · 오래된 순`;
    }

    return true;
  }catch(e){
    if(generation === state.scanGeneration){
      $("#scanState").textContent = "전체 대화 불러오기 실패";
      alert(e.message);
    }
    return false;
  }finally{
    if(generation === state.scanGeneration){
      state.chatHistoryLoading = false;
      syncLoadingUI();
    }
  }
}

async function loadRooms(){
  const data = await frommApiJson("/v2/chat/fanFriendAndChatRooms");
  state.rooms = data?.data?.chatRooms || [];
  const el = $("#rooms");
  el.innerHTML = "";
  state.rooms.forEach((r,i)=>{
    const b = document.createElement("button");
    b.className = "room";
    b.textContent = r?.host?.nick || r?.chatRoomName || `채팅방 ${i+1}`;
    b.onclick = ()=>selectRoom(i,b);
    el.appendChild(b);
  });
}

function selectRoom(i, btn){
  state.scanGeneration++;

  if(document.body.classList.contains("sidebar-open")){
    setSidebarOpen(false);
  }

  state.room = state.rooms[i];
  // Do not carry the previous artist's LIVE signal into the newly selected room.
  state.live.config=null;
  state.live.lastError="";
  syncHeaderLiveIndicator();
  state.chatQuery = "";
  state.selectedDate = "";
  state.calendarMonth = null;

  if($("#chatSearchInput")) $("#chatSearchInput").value = "";
  if($("#datePickerText")) $("#datePickerText").textContent = "날짜 선택";

  state.selected.clear();
  updateSelectedCount();

  $$(".room").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");

  const artist = state.room?.host?.nick || "아티스트";
  $("#artistTitle").textContent = artist;
  $("#scanBtn").disabled = false;
  syncLoadingUI();

  resetFullChatHistory();

  // Always initialize this room's history state, even when the Live tab is
  // currently open. Previously the live-only early return left cursorEnd as
  // null, so switching from Live to a media tab could call toISOString() on
  // null before the first history page was loaded.
  const cached = state.roomCache.get(roomCacheKey());

  if(cached && cached.messages?.length){
    restoreRoomCache(cached);
  }else{
    resetHistoryPaging();
  }

  if(state.filter === "live"){
    stopLivePolling();
    stopLivePlayback({clearRoom:true}).catch(()=>{});
    renderLiveView();
    startLivePolling();
    setTimeout(()=>refreshLiveStatus({force:true,autoplay:true}),0);
    return;
  }

  startLivePolling();
  setTimeout(()=>probeLiveIndicator(),0);

  restoreFullChatCache();

  updateChatSearchCount();

  if(state.filter === "all"){
    state.chatAutoTopPending = true;
  }

  const hasImmediateData =
    !!(cached && cached.messages?.length) ||
    !!(state.filter === "all" && state.chatHistoryComplete && state.chatMessages.length);

  if(hasImmediateData){
    render();
  }else{
    // One stable loading shell. This avoids:
    // empty render -> loading render -> final render,
    // which was visible as a quick "twitch".
    const tl = $("#timeline");
    tl.className = state.filter === "all" ? "timeline" : "gallery";
    tl.innerHTML = `
      <div class="empty stable-loading-slot"
           style="${state.filter === "all" ? "" : "grid-column:1/-1"}">
        파일 불러오는 중...
      </div>`;
    document.body.classList.add("data-loading");
    document.querySelector(".toolbar")?.classList.add("is-loading");
  }

  setTimeout(async ()=>{
    // Media tabs retain their progressive latest-500 loader.
    if(!state.messages.length){
      await loadMoreHistory({initial:true});
    }

    // Full conversation needs the actual first message, so prepare its
    // complete history separately.
    if(state.filter === "all"){
      await ensureFullChatHistory();
    }

    // Commit the loaded state to the DOM only once.
    render();
  },0);
}

function normalizeHistoryCursor(cursorEnd){
  let cursor = cursorEnd instanceof Date ? cursorEnd : new Date(cursorEnd || Date.now());

  if(!Number.isFinite(cursor.getTime())){
    cursor = new Date();
  }

  return cursor;
}

async function requestHistoryPage(roomId, cursorEnd, limit){
  const safeCursor = normalizeHistoryCursor(cursorEnd);

  // Keep the state repaired as well when this request is using the active
  // room cursor. This makes old/corrupt in-memory cache entries harmless.
  if(cursorEnd === state.cursorEnd || state.cursorEnd == null){
    state.cursorEnd = safeCursor;
  }

  return frommApiJson(
    `/v2/chat/message/${encodeURIComponent(roomId)}/messages`,
    {
      findStartAt:"2000-01-01T00:00:00.000Z",
      findEndAt:safeCursor.toISOString(),
      limit:String(limit)
    }
  );
}

async function loadMoreHistory({initial=false, forceAll=false}={}){
  if(!state.room || state.loadingMessages || !state.hasMoreMessages) return 0;

  const generation = state.scanGeneration;
  const roomId = String(state.room.hostChatRoomId);
  const target = forceAll ? Number.POSITIVE_INFINITY : state.pageTarget;

  state.loadingMessages = true;
  $("#scanBtn").disabled = true;
  syncLoadingUI();
  updateHistoryStatus(initial ? "처음 500개 불러오는 중" : "과거 기록 더 불러오는 중");

  let addedTotal = 0;
  let safety = 0;

  try{
    while(state.hasMoreMessages && addedTotal < target){
      if(generation !== state.scanGeneration) return addedTotal;
      safety++;
      if(safety > 10000) throw new Error("페이지 안전 제한에 도달했습니다.");

      let data;
      try{
        data = await requestHistoryPage(roomId, state.cursorEnd, state.pageRequestLimit);
      }catch(e){
        // If 500 is rejected by Fromm, use 100 from then on.
        if(state.pageRequestLimit > 100){
          state.pageRequestLimit = 100;
          data = await requestHistoryPage(roomId, state.cursorEnd, 100);
        }else{
          throw e;
        }
      }

      if(generation !== state.scanGeneration) return addedTotal;

      const batch = data?.data?.messages || [];
      if(!batch.length){
        state.hasMoreMessages = false;
        break;
      }

      for(const msg of batch){
        const key = String(msg.messageId || `${msg.createdAt}|${msg.type}|${msg.content}`);
        if(!state.seenMessageKeys.has(key)){
          state.seenMessageKeys.add(key);
          state.messages.push(msg);
          addedTotal++;
        }
      }

      const dated = batch
        .filter(msg=>msg.createdAt)
        .sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));

      if(!dated.length){
        state.hasMoreMessages = false;
        break;
      }

      const nextCursor = new Date(new Date(dated[0].createdAt).getTime()-1);

      if(!Number.isFinite(nextCursor.getTime()) || nextCursor >= state.cursorEnd){
        state.hasMoreMessages = false;
        break;
      }

      state.cursorEnd = nextCursor;

      // A logical page is 500 new messages. If Fromm silently caps at 100,
      // this loop simply performs up to five small requests.
      if(!forceAll && addedTotal >= state.pageTarget) break;
    }

    if(generation !== state.scanGeneration) return addedTotal;

    // Keep the backing data deterministic.
    state.messages.sort((a,b)=>compareMessages(a,b,"asc"));
    buildMediaSequences();
    saveRoomCache();
    renderCountsOnly();
    updateHistoryStatus();

    return addedTotal;
  }catch(e){
    if(generation === state.scanGeneration){
      $("#scanState").textContent = "불러오기 실패";
      alert(e.message);
    }
    return addedTotal;
  }finally{
    if(generation === state.scanGeneration){
      state.loadingMessages = false;
      $("#scanBtn").disabled = false;
      updateHistoryStatus();
      syncLoadingUI();
    }
  }
}

async function ensureAllHistory(){
  if(!state.hasMoreMessages || state.loadingMessages) return;

  const oldText = "";
  syncLoadingUI();
  await loadMoreHistory({forceAll:true});
  syncLoadingUI();
}


function buildMediaSequences(){
  state.mediaSequence.clear();
  state.legacyMediaSequence.clear();

  const source = state.chatHistoryComplete && state.chatMessages.length
    ? state.chatMessages
    : state.messages;

  // v61:
  // Number files by their actual save location.
  // - photo + video are saved directly in the selected root and share one daily sequence.
  // - sound uses the "audio" subfolder and keeps its own daily sequence from v60.
  // This keeps photo/video ordering together while audio starts from _1 each day.
  //
  // Keep the previous all-media sequence too so an existing v59-or-older
  // backup can still be recognized and skipped instead of being saved twice.
  const perDayAndFolder = new Map();
  const legacyPerDay = new Map();

  const sorted = [...source].sort((a,b)=>compareMessages(a,b,"asc"));

  for(const m of sorted){
    if(!isArtist(m) || !isMedia(m)) continue;

    const day = dateKey(m);
    const key = mediaSequenceKey(m);

    const legacyN = (legacyPerDay.get(day) || 0) + 1;
    legacyPerDay.set(day,legacyN);
    state.legacyMediaSequence.set(key, `${day}_${legacyN}`);

    const folder = mediaFolder(m.type);
    const groupKey = `${day}|${folder}`;
    const n = (perDayAndFolder.get(groupKey) || 0) + 1;
    perDayAndFolder.set(groupKey,n);
    state.mediaSequence.set(key, `${day}_${n}`);
  }
}

function looksLikeIdOnly(s){
  const v = String(s || "").trim();
  return /^[0-9a-f]{8}-[0-9a-f-]{20,}$/i.test(v) || /^[A-Za-z0-9_-]{24,}$/.test(v);
}

function normalizeQuotedValue(value){
  if(value == null) return null;

  if(typeof value === "string"){
    const raw = value.trim();
    if(!raw) return null;

    if((raw.startsWith("{") && raw.endsWith("}")) ||
       (raw.startsWith("[") && raw.endsWith("]"))){
      try{
        return normalizeQuotedValue(JSON.parse(raw));
      }catch{}
    }

    if(looksLikeIdOnly(raw)){
      return {messageId:raw, content:"", type:"text"};
    }

    return {messageId:"", content:raw, type:"text"};
  }

  if(typeof value !== "object") return null;

  // Some API models wrap the quoted message one level deeper.
  for(const nestedKey of ["message","mentionedMessage","embeddedMentionedMessage","data"]){
    if(value[nestedKey] && value[nestedKey] !== value){
      const nested = normalizeQuotedValue(value[nestedKey]);
      if(nested && (nested.content || nested.messageId)) return nested;
    }
  }

  const messageId = String(
    value.messageId ??
    value.id ??
    value.starChatId ??
    value.chatMessageId ??
    ""
  );

  const type = normType(
    value.type ??
    value.messageType ??
    value.contentType ??
    "text"
  );

  const content = String(
    value.content ??
    value.mentionedContent ??
    value.message ??
    value.text ??
    value.translatedMessage ??
    ""
  );

  if(!messageId && !content) return null;
  return {messageId,content,type};
}

function getQuotedMessage(m){
  const candidates = [
    m?.embeddedMentionedMessage,
    m?.mentionedMessage,
    m?.mentionDetailMessage,
    m?.mentionedContent,
    m?.replyMessage,
    m?.embeddedReplyMessage,
    m?.quotedMessage
  ];

  for(const candidate of candidates){
    const q = normalizeQuotedValue(candidate);
    if(q && (q.content || q.messageId)) return q;
  }

  // Some builds expose mention detail as a nested object.
  if(m?.mentionDetail){
    const q = normalizeQuotedValue(m.mentionDetail);
    if(q && (q.content || q.messageId)) return q;
  }

  return null;
}

function quotedPreview(q){
  if(!q) return "";
  if(q.content) return q.content;

  const t = normType(q.type);
  if(t==="image") return "[사진]";
  if(t==="video") return "[영상]";
  if(t==="sound") return "[음성]";
  return "[원문]";
}

function escapeRegExp(s){
  return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function chatMessageMatches(m, query){
  const q = String(query || "").trim().toLocaleLowerCase();
  if(!q) return true;

  // Search only human-readable chat text, not media CDN URLs.
  const t = normType(m.type);
  if(t !== "text") return false;

  const quoted = getQuotedMessage(m);

  const fields = [
    m.content,
    m.translatedMessage,
    quoted?.content,
    typeof m.emoticon === "string" && !isHttpMediaUrl(m.emoticon) ? m.emoticon : ""
  ].filter(Boolean).map(v=>String(v).toLocaleLowerCase());

  return fields.some(v=>v.includes(q));
}

function highlightText(text, query){
  const raw = String(text ?? "");
  const q = String(query || "").trim();

  if(!q) return esc(raw);

  const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
  const parts = raw.split(re);

  return parts.map(part=>{
    if(part.toLocaleLowerCase() === q.toLocaleLowerCase()){
      return `<mark>${esc(part)}</mark>`;
    }
    return esc(part);
  }).join("");
}

function openChatToolsPanel(){
  const panel = $("#chatToolsPanel");
  const btn = $("#chatToolsBtn");
  if(!panel || !btn) return;

  panel.classList.add("open");
  panel.setAttribute("aria-hidden","false");
  btn.classList.add("active");
}

function closeChatToolsPanel(){
  const panel = $("#chatToolsPanel");
  const btn = $("#chatToolsBtn");
  if(!panel || !btn) return;

  panel.classList.remove("open");
  panel.setAttribute("aria-hidden","true");
  btn.classList.remove("active");
  closeDateCalendar();
}

function toggleChatToolsPanel(){
  const panel = $("#chatToolsPanel");
  if(!panel) return;

  if(panel.classList.contains("open")) closeChatToolsPanel();
  else{
    openChatToolsPanel();
    setTimeout(()=>$("#chatSearchInput")?.focus(),0);
  }
}

function updateChatSearchCount(){
  const tools = $("#chatTools");
  const count = $("#chatSearchCount");
  if(!tools || !count) return;

  const isAll = state.filter === "all";
  tools.style.display = isAll ? "flex" : "none";

  if(!isAll){
    count.textContent = "";
    closeChatToolsPanel();
    return;
  }

  const q = state.chatQuery.trim();
  if(!q){
    count.textContent = "";
    return;
  }

  const n = state.chatMessages.filter(m=>chatMessageMatches(m,q)).length;
  count.textContent = `${n.toLocaleString()}개`;
}

function filteredMessages(){
  if(state.filter==="all"){
    const q = state.chatQuery.trim();

    const source = state.chatMessages.filter(m=>{
      if(normType(m.type) !== "text") return true;

      const s = specialTextState(m);
      return !s || s.kind !== "hidden-empty";
    });

    const list = q
      ? source.filter(m=>chatMessageMatches(m,q))
      : source;

    // TRUE chronological order: first-ever message -> latest message.
    return [...list].sort((a,b)=>compareMessages(a,b,"asc"));
  }

  let list;
  if(state.filter==="media"){
    list = state.messages.filter(m=>isArtist(m) && isMedia(m));
  }else{
    list = state.messages.filter(
      m=>isArtist(m) && normType(m.type)===state.filter
    );
  }

  return [...list].sort((a,b)=>compareMessages(a,b,state.sortDirection));
}

function updateSelectAllButton(){
  const btn = $("#selectAllBtn");
  if(!btn) return;

  const scope = currentSelectableMedia();
  const allSelected = scope.length > 0 &&
    scope.every(m=>state.selected.has(String(m.messageId)));

  btn.textContent = allSelected ? "전체해제" : "전체선택";
}

function updateSelectedCount(){
  const el = $("#selectedCount");
  if(!el) return;

  const n = state.selected.size;
  el.textContent = `선택 ${n.toLocaleString()}개`;
  el.classList.toggle("has-selection", n > 0);
  if(typeof updateSelectAllButton === "function") updateSelectAllButton();
}

function renderCountsOnly(){
  if(state.filter === "live"){
    syncLiveToolbarControls();
    return;
  }

  const media = state.messages.filter(m=>isArtist(m)&&isMedia(m));
  const image = media.filter(m=>normType(m.type)==="image").length;
  const video = media.filter(m=>normType(m.type)==="video").length;
  const sound = media.filter(m=>normType(m.type)==="sound").length;
  const prefix = state.hasMoreMessages ? "현재 " : "";
  $("#counts").textContent = `${prefix}미디어 ${media.length.toLocaleString()} · 사진 ${image} · 영상 ${video} · 음성 ${sound}`;
  updateSelectedCount();
}

function disconnectInfiniteObserver(){
  state.infiniteVersion++;

  if(state.infiniteObserver){
    state.infiniteObserver.disconnect();
    state.infiniteObserver = null;
  }

  if(state.chatRenderObserver){
    state.chatRenderObserver.disconnect();
    state.chatRenderObserver = null;
  }

  if(state.chatTopRenderObserver){
    state.chatTopRenderObserver.disconnect();
    state.chatTopRenderObserver = null;
  }

  document.querySelectorAll(
    ".infinite-sentinel,.chat-render-sentinel,.chat-prepend-sentinel"
  ).forEach(el=>el.remove());
}

function buildChatRangeFragment(start,end){
  const list = state.infiniteList || [];
  const frag = document.createDocumentFragment();

  const safeStart = Math.max(0,start);
  const safeEnd = Math.min(end,list.length);

  for(let i=safeStart;i<safeEnd;i++){
    const m = list[i];
    const dk = dateKey(m);

    const prevDate =
      i > 0
        ? dateKey(list[i-1])
        : "";

    if(i === 0 || dk !== prevDate){
      const sep = document.createElement("div");
      sep.className = "date-sep";
      sep.dataset.date = dk;
      sep.id = `chat-date-${dk}`;
      sep.textContent = dk;
      frag.appendChild(sep);
    }

    frag.appendChild(renderMessage(m));
  }

  return frag;
}

function appendChatBatch(chunkCount=1, version=state.infiniteVersion){
  if(version !== state.infiniteVersion) return;
  if(state.filter !== "all") return;

  const list = state.infiniteList || [];
  const tl = $("#timeline");

  for(let batchNo=0;batchNo<chunkCount;batchNo++){
    if(state.infiniteRendered >= list.length) break;

    const start = state.infiniteRendered;
    const end = Math.min(start + state.chunkSize,list.length);

    tl.appendChild(
      buildChatRangeFragment(start,end)
    );

    state.infiniteRendered = end;
  }
}

function prependChatBatch(chunkCount=1, version=state.infiniteVersion){
  if(version !== state.infiniteVersion) return;
  if(state.filter !== "all") return;
  if(state.chatWindowStart <= 0) return;

  const tl = $("#timeline");
  const oldStart = state.chatWindowStart;
  const amount = state.chunkSize * Math.max(1,chunkCount);
  const newStart = Math.max(0,oldStart - amount);

  const firstVisibleContent = tl.querySelector(
    ":scope > .date-sep, :scope > .msg"
  );

  const oldTop = firstVisibleContent
    ? firstVisibleContent.getBoundingClientRect().top
    : 0;

  const frag = buildChatRangeFragment(newStart,oldStart);
  tl.insertBefore(frag,tl.firstChild);

  state.chatWindowStart = newStart;

  // Keep the user's viewport on the same message while older DOM is inserted
  // above it. Without this compensation, loading older messages feels like
  // the page suddenly jumps downward.
  if(firstVisibleContent){
    const newTop = firstVisibleContent.getBoundingClientRect().top;
    const delta = newTop - oldTop;

    if(Math.abs(delta) > .5){
      window.scrollBy({
        top:delta,
        left:0,
        behavior:"auto"
      });
    }
  }
}

function armChatTopRenderObserver(version=state.infiniteVersion){
  if(version !== state.infiniteVersion) return;
  if(state.filter !== "all") return;
  if(state.chatWindowStart <= 0) return;

  if(state.chatTopRenderObserver){
    state.chatTopRenderObserver.disconnect();
    state.chatTopRenderObserver = null;
  }

  document.querySelectorAll(".chat-prepend-sentinel").forEach(el=>el.remove());

  const tl = $("#timeline");
  const sentinel = document.createElement("div");
  sentinel.className = "chat-prepend-sentinel";
  sentinel.style.cssText = "height:8px;width:100%;";

  tl.insertBefore(sentinel,tl.firstChild);

  state.chatTopRenderObserver = new IntersectionObserver(entries=>{
    if(version !== state.infiniteVersion) return;
    if(!entries.some(x=>x.isIntersecting)) return;

    if(state.chatTopRenderObserver){
      state.chatTopRenderObserver.disconnect();
      state.chatTopRenderObserver = null;
    }

    sentinel.remove();

    prependChatBatch(2,version);
    armChatTopRenderObserver(version);
  },{
    root:null,
    rootMargin:"1800px 0px 0px 0px",
    threshold:0
  });

  state.chatTopRenderObserver.observe(sentinel);
}

function armChatRenderObserver(version=state.infiniteVersion){
  if(version !== state.infiniteVersion) return;
  if(state.filter !== "all") return;
  if(state.infiniteRendered >= state.infiniteList.length) return;

  if(state.chatRenderObserver){
    state.chatRenderObserver.disconnect();
    state.chatRenderObserver = null;
  }

  document.querySelectorAll(".chat-render-sentinel").forEach(el=>el.remove());

  const tl = $("#timeline");
  const sentinel = document.createElement("div");
  sentinel.className = "chat-render-sentinel";
  sentinel.style.cssText = "height:8px;width:100%;";
  tl.appendChild(sentinel);

  state.chatRenderObserver = new IntersectionObserver(entries=>{
    if(version !== state.infiniteVersion) return;
    if(!entries.some(x=>x.isIntersecting)) return;

    if(state.chatRenderObserver){
      state.chatRenderObserver.disconnect();
      state.chatRenderObserver = null;
    }

    sentinel.remove();

    appendChatBatch(2,version);
    armChatRenderObserver(version);
  },{
    root:null,
    rootMargin:"2600px 0px",
    threshold:0
  });

  state.chatRenderObserver.observe(sentinel);
}

function renderFullConversation(version){
  if(version !== state.infiniteVersion) return;

  const tl = $("#timeline");
  tl.className = "timeline";
  tl.innerHTML = "";

  if(!state.room){
    tl.innerHTML = `<div class="empty artist-select-prompt">아티스트를 선택해주세요.</div>`;
    document.querySelector(".toolbar")?.classList.remove("is-loading");
    syncLoadingUI();
    return;
  }

  if(state.chatHistoryLoading || !state.chatHistoryComplete){
    const progress = state.chatHistoryProgress
      ? ` ${state.chatHistoryProgress.toLocaleString()}개 확인 중`
      : "";

    tl.innerHTML = `<div class="empty stable-loading-slot">가장 오래된 메시지를 찾는 중...${progress}</div>`;
    syncLoadingUI();
    return;
  }

  const list = state.infiniteList || [];

  if(!list.length){
    tl.innerHTML = `<div class="empty">${
      state.chatQuery.trim() ? "검색 결과가 없습니다." : "대화가 없습니다."
    }</div>`;
    return;
  }

  state.chatWindowStart = 0;
  state.infiniteRendered = 0;
  state.infiniteLastDate = "";

  // Normal 전체 대화 entry starts at the actual first-ever message.
  appendChatBatch(2,version);
  armChatRenderObserver(version);

  if(state.chatAutoTopPending){
    state.chatAutoTopPending = false;

    requestAnimationFrame(()=>{
      window.scrollTo({top:0,behavior:"auto"});
    });
  }
}

function render(){
  renderCountsOnly();
  updateChatSearchCount();
  syncLoadingUI();

  if(state.filter === "live"){
    renderLiveView();
    return;
  }

  const list = filteredMessages();
  const tl = $("#timeline");

  disconnectInfiniteObserver();
  const version = state.infiniteVersion;

  state.infiniteList = list;
  state.chatWindowStart = 0;
  state.infiniteRendered = 0;
  state.infiniteLastDate = "";
  state.prefetching.clear();

  if(state.filter === "all"){
    renderFullConversation(version);
    return;
  }

  tl.innerHTML = "";
  tl.className = "gallery";

  if(!list.length){
    tl.innerHTML = `<div class="empty" style="grid-column:1/-1">${
      state.loadingMessages
        ? `<span class="stable-loading-slot">파일 불러오는 중...</span>`
        : (state.messages.length
            ? "이 구간에는 표시할 항목이 없습니다. 아래로 내리면 과거 기록을 더 불러옵니다."
            : "아직 불러온 메시지가 없습니다.")
    }</div>`;

    armInfiniteObserver(version);
    return;
  }

  appendInfiniteBatch(2,version);
  armInfiniteObserver(version);
  prefetchMediaRange(state.infiniteRendered);
}

function appendInfiniteBatch(chunkCount=1, version=state.infiniteVersion){
  if(version !== state.infiniteVersion) return;
  if(state.filter === "all") return;

  const list = state.infiniteList || [];
  const tl = $("#timeline");
  tl.className = "gallery";

  const oldEmpty = tl.querySelector(":scope > .empty");
  if(oldEmpty && list.length) oldEmpty.remove();

  for(let batchNo=0;batchNo<chunkCount;batchNo++){
    if(state.infiniteRendered >= list.length) break;

    const start = state.infiniteRendered;
    const end = Math.min(start + state.chunkSize,list.length);
    const frag = document.createDocumentFragment();

    for(let i=start;i<end;i++){
      frag.appendChild(renderMediaCard(list[i]));
    }

    tl.appendChild(frag);
    state.infiniteRendered = end;
  }

  prefetchMediaRange(state.infiniteRendered);
}

function refreshInfiniteListAfterFetch(version){
  if(version !== state.infiniteVersion) return;
  if(state.filter === "all") return;

  const tl = $("#timeline");
  tl.className = "gallery";

  const nextList = filteredMessages();

  let prefixStable = nextList.length >= state.infiniteList.length;

  if(prefixStable){
    for(let i=0;i<state.infiniteList.length;i++){
      if(messageStableKey(nextList[i]) !== messageStableKey(state.infiniteList[i])){
        prefixStable = false;
        break;
      }
    }
  }

  if(!prefixStable){
    render();
    return;
  }

  state.infiniteList = nextList;
  appendInfiniteBatch(2,version);
}

function armInfiniteObserver(version=state.infiniteVersion){
  if(version !== state.infiniteVersion) return;
  if(state.filter === "all") return;

  const hasRenderedItemsWaiting =
    state.infiniteRendered < state.infiniteList.length;

  if(!hasRenderedItemsWaiting && !state.hasMoreMessages) return;

  if(state.infiniteObserver){
    state.infiniteObserver.disconnect();
    state.infiniteObserver = null;
  }

  document.querySelectorAll(".infinite-sentinel").forEach(el=>el.remove());

  const tl = $("#timeline");
  const sentinel = document.createElement("div");
  sentinel.className = "infinite-sentinel";
  sentinel.style.cssText = "height:12px;grid-column:1/-1;width:100%;";
  tl.appendChild(sentinel);

  state.infiniteObserver = new IntersectionObserver(async entries=>{
    if(version !== state.infiniteVersion) return;
    if(!entries.some(entry=>entry.isIntersecting)) return;

    if(state.infiniteObserver){
      state.infiniteObserver.disconnect();
      state.infiniteObserver = null;
    }

    sentinel.remove();

    if(state.infiniteRendered < state.infiniteList.length){
      appendInfiniteBatch(2,version);
    }

    if(state.infiniteRendered >= state.infiniteList.length &&
       state.hasMoreMessages &&
       !state.loadingMessages){

      await loadMoreHistory();
      if(version !== state.infiniteVersion) return;

      refreshInfiniteListAfterFetch(version);
    }

    armInfiniteObserver(version);
  },{
    root:null,
    rootMargin:"5000px 0px",
    threshold:0
  });

  state.infiniteObserver.observe(sentinel);
}

function cleanupImageBlobUrl(img){
  const old = img?.dataset?.blobUrl;
  if(old){
    try{ URL.revokeObjectURL(old); }catch{}
    delete img.dataset.blobUrl;
  }
}

function imageUrlSame(a,b){
  if(!a || !b) return false;
  try{
    return new URL(a,location.href).href === new URL(b,location.href).href;
  }catch{
    return String(a) === String(b);
  }
}

function setImageFailedUI(img,m,{gallery=false}={}){
  if(!img) return;

  const holder = gallery
    ? img.closest(".thumb")
    : img.closest(".media-wrap");

  if(!holder) return;

  holder.classList.remove("image-recovering");
  holder.classList.add("image-load-failed");

  const old = holder.querySelector(".image-retry-box,.chat-image-retry");
  if(old) old.remove();

  const box = document.createElement("div");
  box.className = gallery ? "image-retry-box" : "chat-image-retry";

  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "image-retry-btn";
  btn.textContent = "이미지 다시 불러오기";

  btn.onclick = async (e)=>{
    e.preventDefault();
    e.stopPropagation();

    box.remove();
    holder.classList.remove("image-load-failed");
    holder.classList.add("image-recovering");

    img.dataset.recoveryStage = "0";
    cleanupImageBlobUrl(img);

    const first = gallery
      ? (previewUrl(m) || resolveMediaUrl(m))
      : resolveMediaUrl(m);

    img.src = first || "";
  };

  box.appendChild(btn);
  holder.appendChild(box);

  if(gallery){
    holder.classList.add("media-ready");
  }
}

async function recoverImageAsBlob(img,m,{gallery=false}={}){
  if(!img || img.dataset.blobRecoveryBusy === "1") return false;

  img.dataset.blobRecoveryBusy = "1";

  const holder = gallery
    ? img.closest(".thumb")
    : img.closest(".media-wrap");

  holder?.classList.add("image-recovering");
  holder?.classList.remove("image-load-failed");

  try{
    const {blob} = await fetchMediaBlob(m);
    const objectUrl = URL.createObjectURL(blob);

    cleanupImageBlobUrl(img);

    img.dataset.blobUrl = objectUrl;
    img.dataset.displaySrc = objectUrl;
    img.dataset.recoveryStage = "3";
    img.src = objectUrl;

    return true;
  }catch(e){
    console.warn("이미지 blob 재시도 실패:",baseName(m),e);
    setImageFailedUI(img,m,{gallery});
    return false;
  }finally{
    img.dataset.blobRecoveryBusy = "0";
  }
}

function armResilientImage(img,m,{gallery=false,previewFirst=false}={}){
  if(!img) return;

  const holder = gallery
    ? img.closest(".thumb")
    : img.closest(".media-wrap");

  const full = resolveMediaUrl(m);
  const initial = img.getAttribute("src") || "";
  img.dataset.recoveryStage = "0";

  img.onload = ()=>{
    const stage = Number(img.dataset.recoveryStage || "0");

    holder?.classList.remove("image-recovering","image-load-failed");

    if(gallery){
      markThumbReady(img);
    }

    img.dataset.displaySrc = img.src;

    // If the lightweight preview loaded, warm the original image in the
    // background. Failure here is harmless: the preview stays visible.
    if(previewFirst && stage === 0 && full && !imageUrlSame(img.src,full)){
      const fullImg = new Image();
      fullImg.decoding = "async";

      fullImg.onload = ()=>{
        img.dataset.recoveryStage = "2";
        img.src = full;
      };

      fullImg.onerror = ()=>{
        // Keep the valid preview rather than replacing it with a blank card.
      };

      fullImg.src = full;
    }
  };

  img.onerror = async ()=>{
    const stage = Number(img.dataset.recoveryStage || "0");

    // Preview failed: try the original CDN/content URL directly.
    if(stage === 0 && full && !imageUrlSame(initial,full)){
      img.dataset.recoveryStage = "1";
      holder?.classList.add("image-recovering");
      img.src = full;
      return;
    }

    // Direct URL also failed (or there was no separate preview):
    // fetch the bytes ourselves and display a local blob URL.
    if(stage < 3){
      img.dataset.recoveryStage = "2";
      await recoverImageAsBlob(img,m,{gallery});
      return;
    }

    setImageFailedUI(img,m,{gallery});
  };

  // Cached images may already be complete before handlers are attached.
  if(img.complete && img.naturalWidth > 0){
    img.onload();
  }else if(img.complete && img.naturalWidth === 0 && img.src){
    // Browser already knows this request failed.
    queueMicrotask(()=>img.onerror?.());
  }
}

function renderMediaCard(m){
  const t = normType(m.type);
  const card = document.createElement("div");
  const id = String(m.messageId);
  card.className = "media-card" + (state.selected.has(id) ? " selected" : "");

  const label = t==="image" ? "사진" : t==="video" ? "영상" : "음성";
  const src = proxyUrl(m,false);
  const dl = proxyUrl(m,true);

  if(!src || !dl){
    card.classList.add("media-card-unavailable");

    const unavailableIcon =
      t==="image" ? "🖼️" :
      t==="video" ? "🎬" :
      "🎧";

    card.innerHTML = `
      <div class="thumb audio-thumb media-ready">
        <div class="audio-icon">${unavailableIcon}</div>
        <div class="media-unavailable-note">${m.code ? "파일 URL 없음 · code 있음" : "파일 URL 없음"}</div>
      </div>
      <div class="card-badge">${label}</div>
      <div class="card-body">
        <div class="card-title">${esc(baseName(m))}</div>
        <div class="card-date">${esc(dateKey(m))} · ${esc(timeLabel(m))}</div>
      </div>`;
    return card;
  }

  let thumb = "";
  if(t==="image"){
    const preview = previewUrl(m);
    thumb = `<div class="thumb">
      <img class="gallery-image"
           loading="lazy"
           decoding="async"
           fetchpriority="auto"
           data-full-src="${esc(src)}"
           src="${esc(preview)}"
           alt="Fromm image">
    </div>`;
  }else if(t==="video"){
    const poster = m.thumbnail ? previewUrl(m) : "";

    thumb = `<div class="thumb">
      <video controls preload="none"
             ${poster?`poster="${esc(poster)}"`:""}
             src="${esc(src)}"></video>
    </div>`;
  }else{
    thumb = `
      <div class="thumb audio-thumb">
        <div class="audio-icon">🎧</div>
        <div class="audio-error-note">브라우저 재생 불가 · 다운로드는 가능</div>
        <div class="audio-player-overlay">
          <audio controls preload="none" src="${esc(src)}"></audio>
        </div>
      </div>`;
  }

  card.innerHTML = `
    ${thumb}
    <div class="card-badge">${label}</div>
    <a class="card-download" href="${esc(dl)}" title="다운로드">⇩</a>

    <div class="card-body">
      <div class="card-title">${esc(baseName(m))}</div>
      <div class="card-date">${esc(dateKey(m))} · ${esc(timeLabel(m))}</div>

      <label class="card-footer-select" title="선택/해제">
        <input class="card-select-input" type="checkbox" ${state.selected.has(id)?"checked":""}>
        <span class="card-select-box" aria-hidden="true"></span>
        <span class="card-select-text"></span>
      </label>
    </div>
  `;

  const downloadBtn = card.querySelector(".card-download");
  if(downloadBtn){
    downloadBtn.onclick = (e)=>{
      e.preventDefault();
      e.stopPropagation();
      downloadSingleMedia(m,downloadBtn);
    };
  }

  const cb = card.querySelector('input[type="checkbox"]');
  cb.onchange = ()=>{
    if(cb.checked) state.selected.add(id); else state.selected.delete(id);
    card.classList.toggle("selected", cb.checked);
    pulseSelectionControl(card);
    updateSelectedCount();
  };

  if(t==="image"){
    const img = card.querySelector(".thumb img");
    if(img){
      armResilientImage(
        img,
        m,
        {gallery:true,previewFirst:true}
      );

      img.ondblclick = (ev)=>{
        ev.preventDefault();
        ev.stopPropagation();

        openImageLightbox(
          img.dataset.displaySrc || img.dataset.blobUrl || src,
          `${baseName(m)} · ${dateKey(m)} ${timeLabel(m)}`
        );
      };
    }
  }else if(t==="video"){
    const v = card.querySelector("video");
    if(v){
      const thumb = v.closest(".thumb");
      if(v.poster){
        const posterImg = new Image();
        posterImg.onload = ()=>thumb?.classList.add("media-ready");
        posterImg.onerror = ()=>thumb?.classList.add("media-ready");
        posterImg.src = v.poster;
      }else{
        thumb?.classList.add("media-ready");
      }
    }
  }else if(t==="sound"){
    const a = card.querySelector("audio");
    const thumb = a?.closest(".thumb");
    if(a){
      a.preload = "metadata";
      a.addEventListener("loadedmetadata",()=>{
        thumb?.classList.add("media-ready");
        thumb?.classList.remove("audio-failed");
      },{once:true});
      a.addEventListener("error",async ()=>{
        const repaired = await repairAudioElement(a,m);
        if(repaired) return;

        thumb?.classList.add("media-ready");
        thumb?.classList.add("audio-failed");
      },{once:true});
      try{ a.load(); }catch{}
    }else{
      thumb?.classList.add("media-ready");
    }
  }

  return card;
}

function renderMessage(m){
  const t=normType(m.type);
  const artist=isArtist(m);
  const wrap=document.createElement("div");
  wrap.className=`msg ${artist?"star":"me"}`;
  wrap.dataset.messageId = String(m.messageId || m.id || "");

  const bubble=document.createElement("div");
  bubble.className="bubble";

  const who=artist?(state.room?.host?.nick||"아티스트"):"나";
  let html=`<div class="meta"><span>${esc(who)}</span><span>${esc(timeLabel(m))}</span><span class="type">${esc(t)}</span></div>`;

  const quoted = getQuotedMessage(m);
  if(quoted){
    const label = artist ? "아티가 답장했어요! ♥" : "내가 답장한 메시지";
    const preview = quotedPreview(quoted);

    html += `<div class="reply-quote" data-quoted-id="${esc(quoted.messageId || "")}">
      <div class="reply-label">${esc(label)}</div>
      <div class="reply-content">${highlightText(preview, state.filter==="all" ? state.chatQuery : "")}</div>
    </div>`;
  }

  if(t==="text"){
    const textContent = String(m.content || "").trim();
    const special = !textContent ? specialTextState(m) : null;
    const emoticonSrc = !textContent ? emoticonProxyUrl(m) : "";

    if(textContent){
      html+=`<div class="text">${highlightText(m.content||"", state.filter==="all" ? state.chatQuery : "")}</div>`;
    }else if(emoticonSrc){
      bubble.classList.add("emoticon-only");
      html+=`<div class="emoticon-wrap">
        <img class="emoticon-img" loading="lazy" src="${esc(emoticonSrc)}" alt="이모티콘">
      </div>`;
    }else if(special?.kind==="emoticon"){
      bubble.classList.add("emoticon-only");
      html+=`<div class="emoticon-unavailable">이모티콘 데이터 있음 · 이미지 URL 미확인</div>`;
    }else if(special?.kind==="reply-only"){
      bubble.classList.add("reply-only");
      // quoted/reply card was already rendered above; no extra blank line.
    }else if(special?.kind==="deleted" || special?.kind==="blocked" || special?.kind==="special"){
      bubble.classList.add("special-only");
      html+=`<div class="special-message-note">${esc(special.label)}</div>`;
    }
  }else if(["image","video","sound"].includes(t)){
    const mediaSrc = proxyUrl(m,false);

    if(!mediaSrc){
      const kind = t==="image" ? "사진" : t==="video" ? "영상" : "음성";
      html+=`<div class="text media-missing">[${kind} · 파일 URL 없음]</div>`;
    }else{
      html+=`<div class="media-wrap">`;
      if(t==="image") html+=`<img loading="lazy" src="${esc(mediaSrc)}" alt="Fromm image">`;
      if(t==="video") html+=`<video controls preload="none" src="${esc(mediaSrc)}"></video>`;
      if(t==="sound") html+=`<audio controls preload="none" src="${esc(mediaSrc)}"></audio>`;
      html+=`<div class="media-actions">`;

      if(artist){
        const isSelected = state.selected.has(String(m.messageId));
        const checked = isSelected ? "checked" : "";
        const selectedClass = isSelected ? " selected" : "";

        html+=`<label class="chat-select-pill${selectedClass}" title="선택/해제">
          <input class="card-select-input" type="checkbox"
                 data-mid="${esc(String(m.messageId))}" ${checked}>
          <span class="card-select-box" aria-hidden="true"></span>
          <span class="card-select-text"></span>
        </label>`;
        html+=`<a class="dl" href="${esc(proxyUrl(m,true))}">다운로드</a>`;
        html+=`<span class="stats">${esc(baseName(m))}</span>`;
      }

      html+=`</div></div>`;
    }
  }else{
    html+=`<div class="text">${esc(m.content||`[${t}]`)}</div>`;
  }

  bubble.innerHTML=html;

  const replyQuote = bubble.querySelector(".reply-quote");
  if(replyQuote){
    replyQuote.onclick = ()=>{
      const targetId = replyQuote.dataset.quotedId;
      if(targetId) scrollToOriginalMessage(targetId);
    };
  }

  const emoticonImg = bubble.querySelector(".emoticon-img");
  if(emoticonImg){
    emoticonImg.onerror = ()=>{
      const wrap = emoticonImg.closest(".emoticon-wrap");
      if(wrap){
        wrap.innerHTML = `<div class="emoticon-unavailable">이모티콘 이미지를 불러오지 못했습니다.</div>`;
      }
    };

    emoticonImg.ondblclick = (ev)=>{
      ev.preventDefault();
      ev.stopPropagation();

      openImageLightbox(
        emoticonImg.src,
        `${artist ? (state.room?.host?.nick || "아티스트") : "나"} · ${dateKey(m)} ${timeLabel(m)} · 이모티콘`
      );
    };
  }

  const chatDownload = bubble.querySelector(".dl");
  if(chatDownload){
    chatDownload.onclick = (e)=>{
      e.preventDefault();
      e.stopPropagation();
      downloadSingleMedia(m,chatDownload);
    };
  }

  if(t==="sound"){
    const chatAudio = bubble.querySelector(".media-wrap audio");
    if(chatAudio){
      chatAudio.addEventListener("error",()=>{
        repairAudioElement(chatAudio,m);
      },{once:true});
    }
  }

  const cb=bubble.querySelector('input[type="checkbox"]');
  if(cb) cb.onchange=()=>{
    const id=String(m.messageId);

    if(cb.checked) state.selected.add(id);
    else state.selected.delete(id);

    const pill = cb.closest(".chat-select-pill");
    if(pill){
      pill.classList.toggle("selected", cb.checked);
      pill.classList.remove("select-pop");
      void pill.offsetWidth;
      pill.classList.add("select-pop");
      setTimeout(()=>pill.classList.remove("select-pop"),240);
    }

    updateSelectedCount();
  };

  // 전체 대화 탭의 이미지도 원본 URL -> blob 순서로 자동 복구.
  if(t==="image"){
    const chatImg = bubble.querySelector(".media-wrap img");
    if(chatImg){
      chatImg.style.cursor = "zoom-in";

      armResilientImage(
        chatImg,
        m,
        {gallery:false,previewFirst:false}
      );

      chatImg.ondblclick = (ev)=>{
        ev.preventDefault();
        ev.stopPropagation();

        openImageLightbox(
          chatImg.dataset.displaySrc ||
          chatImg.dataset.blobUrl ||
          proxyUrl(m,false),
          `${isArtist(m) ? (state.room?.host?.nick || "아티스트") : "나"} · ${dateKey(m)} ${timeLabel(m)}`
        );
      };
    }
  }

  wrap.appendChild(bubble);
  return wrap;
}

function pad2(n){
  return String(n).padStart(2,"0");
}

function toLocalDateKey(d){
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}

function parseDateKeyLocal(key){
  const m = String(key || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return null;

  const d = new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
  return Number.isFinite(d.getTime()) ? d : null;
}

function chatDateSet(){
  return new Set(
    state.chatMessages
      .map(m=>localDateKeyFromISO(m.createdAt))
      .filter(Boolean)
  );
}

function setSelectedDate(key){
  state.selectedDate = key || "";

  const text = $("#datePickerText");
  if(text){
    text.textContent = state.selectedDate || "날짜 선택";
  }

  const d = parseDateKeyLocal(state.selectedDate);
  if(d){
    state.calendarMonth = new Date(d.getFullYear(),d.getMonth(),1);
  }

  renderDateCalendar();
}

function openDateCalendar(){
  const cal = $("#dateCalendar");
  const btn = $("#datePickerBtn");
  if(!cal || !btn) return;

  if(!state.calendarMonth){
    const selected = parseDateKeyLocal(state.selectedDate);
    const base = selected || new Date();
    state.calendarMonth = new Date(base.getFullYear(),base.getMonth(),1);
  }

  state.calendarMode = "day";
  state.calendarYearPageStart = null;

  renderDateCalendar();
  cal.classList.add("open");
  cal.setAttribute("aria-hidden","false");
  btn.classList.add("active");
}

function closeDateCalendar(){
  const cal = $("#dateCalendar");
  const btn = $("#datePickerBtn");
  if(!cal || !btn) return;

  cal.classList.remove("open","year-mode","month-mode");
  cal.setAttribute("aria-hidden","true");
  btn.classList.remove("active");
  state.calendarMode = "day";
  state.calendarYearPageStart = null;
}

function toggleDateCalendar(){
  const cal = $("#dateCalendar");
  if(!cal) return;

  if(cal.classList.contains("open")) closeDateCalendar();
  else openDateCalendar();
}

function calendarActivityInfo(){
  const dates = [...chatDateSet()];
  const years = new Set();
  const months = new Set();

  for(const key of dates){
    const m = String(key).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(!m) continue;

    years.add(Number(m[1]));
    months.add(`${m[1]}-${m[2]}`);
  }

  return {dates:new Set(dates),years,months};
}

function setCalendarMode(mode){
  state.calendarMode = mode;

  const cal = $("#dateCalendar");
  if(cal){
    cal.classList.toggle("year-mode",mode === "year");
    cal.classList.toggle("month-mode",mode === "month");
  }
}

function renderDateCalendar(){
  const grid = $("#dateCalendarGrid");
  const title = $("#dateCalendarTitle");
  if(!grid || !title) return;

  if(!state.calendarMonth){
    const now = new Date();
    state.calendarMonth = new Date(now.getFullYear(),now.getMonth(),1);
  }

  const view = state.calendarMonth;
  const year = view.getFullYear();
  const month = view.getMonth();
  const selected = parseDateKeyLocal(state.selectedDate);
  const activity = calendarActivityInfo();
  const todayKey = toLocalDateKey(new Date());

  grid.innerHTML = "";
  setCalendarMode(state.calendarMode || "day");

  // ---------------- YEAR PICKER ----------------
  if(state.calendarMode === "year"){
    if(!Number.isFinite(state.calendarYearPageStart)){
      state.calendarYearPageStart = Math.floor(year / 12) * 12;
    }

    const startYear = state.calendarYearPageStart;
    const endYear = startYear + 11;

    title.textContent = `${startYear}년 – ${endYear}년`;

    for(let y=startYear;y<=endYear;y++){
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "date-year-option";
      btn.textContent = `${y}`;

      if(selected && selected.getFullYear() === y){
        btn.classList.add("selected");
      }
      if(activity.years.has(y)){
        btn.classList.add("has-chat");
      }

      btn.onclick = ()=>{
        state.calendarMonth = new Date(
          y,
          state.calendarMonth?.getMonth() ?? 0,
          1
        );
        state.calendarMode = "month";
        state.calendarYearPageStart = null;
        renderDateCalendar();
      };

      grid.appendChild(btn);
    }

    return;
  }

  // ---------------- MONTH PICKER ----------------
  if(state.calendarMode === "month"){
    title.textContent = `${year}년`;

    for(let m=0;m<12;m++){
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "date-month-option";
      btn.textContent = `${m+1}월`;

      if(
        selected &&
        selected.getFullYear() === year &&
        selected.getMonth() === m
      ){
        btn.classList.add("selected");
      }

      const monthKey = `${year}-${pad2(m+1)}`;
      if(activity.months.has(monthKey)){
        btn.classList.add("has-chat");
      }

      btn.onclick = ()=>{
        state.calendarMonth = new Date(year,m,1);
        state.calendarMode = "day";
        renderDateCalendar();
      };

      grid.appendChild(btn);
    }

    return;
  }

  // ---------------- DAY PICKER ----------------
  title.textContent = `${year}년 ${pad2(month+1)}월`;

  const first = new Date(year,month,1);
  const firstDow = first.getDay();
  const start = new Date(year,month,1-firstDow);

  for(let i=0;i<42;i++){
    const d = new Date(start);
    d.setDate(start.getDate()+i);

    const key = toLocalDateKey(d);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "date-day";
    btn.textContent = String(d.getDate());
    btn.dataset.date = key;

    if(d.getMonth() !== month) btn.classList.add("outside");
    if(key === state.selectedDate) btn.classList.add("selected");
    if(key === todayKey) btn.classList.add("today");
    if(activity.dates.has(key)) btn.classList.add("has-chat");

    btn.onclick = ()=>{
      setSelectedDate(key);
      closeDateCalendar();

      if(activity.dates.has(key)){
        jumpToDate(key);
      }
    };

    grid.appendChild(btn);
  }
}

function localDateKeyFromISO(value){
  const d = new Date(value);
  if(!Number.isFinite(d.getTime())) return "";

  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function firstMessageOnDate(targetDate){
  return state.chatMessages
    .filter(m=>localDateKeyFromISO(m.createdAt) === targetDate)
    .sort((a,b)=>compareMessages(a,b,"asc"))[0] || null;
}

function oldestLoadedDate(){
  if(!state.chatMessages.length) return "";
  const oldest = [...state.chatMessages].sort((a,b)=>compareMessages(a,b,"asc"))[0];
  return localDateKeyFromISO(oldest?.createdAt);
}

function renderChatStartingAtDate(targetDate){
  if(state.filter !== "all") return null;
  if(!state.chatHistoryComplete) return null;

  state.chatQuery = "";
  if($("#chatSearchInput")) $("#chatSearchInput").value = "";

  const list = [...state.chatMessages]
    .filter(m=>{
      if(normType(m.type) !== "text") return true;
      const s = specialTextState(m);
      return !s || s.kind !== "hidden-empty";
    })
    .sort((a,b)=>compareMessages(a,b,"asc"));

  const targetIndex = list.findIndex(
    m=>localDateKeyFromISO(m.createdAt) === targetDate
  );

  if(targetIndex < 0) return null;

  const tl = $("#timeline");

  disconnectInfiniteObserver();
  const version = state.infiniteVersion;

  tl.className = "timeline";
  tl.innerHTML = "";

  state.infiniteList = list;

  // Keep a couple of chunks before AND after the selected date.
  // The date is therefore just a jump destination, not a filter/boundary.
  const before = state.chunkSize * 2;
  const after = state.chunkSize * 2;

  const windowStart = Math.max(0,targetIndex - before);
  const windowEnd = Math.min(list.length,targetIndex + after);

  state.chatWindowStart = windowStart;
  state.infiniteRendered = windowEnd;
  state.infiniteLastDate = "";
  state.prefetching.clear();

  tl.appendChild(
    buildChatRangeFragment(windowStart,windowEnd)
  );

  // Downward scrolling continues into later conversations.
  armChatRenderObserver(version);

  // Upward scrolling progressively restores earlier conversations.
  armChatTopRenderObserver(version);

  const dateAnchor = tl.querySelector(
    `.date-sep[data-date="${CSS.escape(targetDate)}"]`
  );

  if(dateAnchor){
    dateAnchor.classList.add("date-jump-start");
  }

  return {
    dateAnchor,
    startIndex:targetIndex,
    version
  };
}

function scrollElementBelowToolbar(el, behavior="smooth"){
  if(!el) return;

  const toolbar = document.querySelector(".toolbar");
  const toolbarBottom = toolbar
    ? toolbar.getBoundingClientRect().bottom
    : 0;

  const currentTop = el.getBoundingClientRect().top + window.scrollY;

  // Place the date divider just below the sticky toolbar.
  const targetY = Math.max(
    0,
    currentTop - toolbarBottom - 12
  );

  window.scrollTo({
    top:targetY,
    behavior
  });
}

async function jumpToDate(targetDate){
  if(!targetDate) return;

  if(state.filter !== "all"){
    state.chatQuery = "";
    if($("#chatSearchInput")) $("#chatSearchInput").value = "";
    await setFilter("all",{autoTop:false});
  }

  const btn = $("#dateJumpBtn");
  const originalText = btn.textContent;
  btn.disabled = true;

  try{
    btn.textContent = "준비 중...";
    await ensureFullChatHistory();

    const firstMessage = firstMessageOnDate(targetDate);

    if(!firstMessage){
      alert(`${targetDate} 날짜의 대화를 찾지 못했습니다.`);
      return;
    }

    state.chatAutoTopPending = false;

    // Date search is a navigation jump, not a filter.
    // Render a lightweight window around the target date and progressively
    // continue in BOTH directions as the user scrolls.
    const result = renderChatStartingAtDate(targetDate);

    if(!result?.dateAnchor){
      alert(`${targetDate} 날짜의 시작 위치를 표시하지 못했습니다.`);
      return;
    }

    const firstId = String(
      firstMessage.messageId ||
      firstMessage.id ||
      ""
    );

    const firstEl = firstId
      ? document.querySelector(
          `.msg[data-message-id="${CSS.escape(firstId)}"]`
        )
      : null;

    closeChatToolsPanel();

    requestAnimationFrame(()=>{
      state.chatAutoTopPending = false;

      const toolbar = document.querySelector(".toolbar");
      const toolbarHeight = toolbar
        ? toolbar.getBoundingClientRect().height
        : 0;

      const anchorTop =
        result.dateAnchor.getBoundingClientRect().top +
        window.scrollY;

      // Place the selected day's DATE HEADER directly under the sticky toolbar.
      window.scrollTo({
        top:Math.max(0,anchorTop - toolbarHeight - 18),
        behavior:"auto"
      });

      if(firstEl){
        firstEl.classList.add("date-target-flash");
        setTimeout(
          ()=>firstEl.classList.remove("date-target-flash"),
          1250
        );
      }
    });
  }finally{
    btn.disabled = false;
    btn.textContent = originalText;
  }
}
async function scrollToOriginalMessage(messageId){
  if(!messageId) return;

  if(state.filter !== "all"){
    state.chatQuery = "";
    if($("#chatSearchInput")) $("#chatSearchInput").value = "";
    await setFilter("all",{autoTop:false});
  }

  await ensureFullChatHistory();

  const targetMsg = state.chatMessages.find(
    m=>String(m.messageId || m.id || "") === String(messageId)
  );

  if(!targetMsg) return;

  state.chatAutoTopPending = false;
  render();

  const selector = `.msg[data-message-id="${CSS.escape(String(messageId))}"]`;
  let target = document.querySelector(selector);
  let guard = 0;

  while(!target &&
        state.infiniteRendered < state.infiniteList.length &&
        guard < 1000){
    appendChatBatch(2,state.infiniteVersion);
    target = document.querySelector(selector);
    guard++;
  }

  if(target){
    target.scrollIntoView({behavior:"smooth",block:"center"});
    target.classList.add("reply-target-flash");
    setTimeout(()=>target.classList.remove("reply-target-flash"),1800);
  }
}

async function setFilter(f, options={}){
  const was = state.filter;
  const autoTop = options.autoTop !== false;

  if(was === "live" && f !== "live"){
    await stopLivePlayback();
    // Keep the lightweight config poll running so the header dot can turn red
    // even while the user is reading chat or browsing media.
    startLivePolling();
  }

  state.filter=f;
  $$(".pill").forEach(b=>b.classList.toggle("active",b.dataset.filter===f));
  syncLiveToolbarControls();

  if(f==="all" && was!=="all"){
    state.chatAutoTopPending = autoTop;
  }

  updateChatSearchCount();
  syncLoadingUI();

  if(f==="live"){
    renderLiveView();
    startLivePolling();
    await refreshLiveStatus({force:true,autoplay:true});
    return;
  }

  if(f==="all"){
    render();
    syncLoadingUI();
    await ensureFullChatHistory();

    if(state.filter==="all"){
      render();
    }
    syncLoadingUI();
    return;
  }

  // When an artist was selected while Live was open, the media history may
  // legitimately still be empty. Load the first page as soon as the user
  // moves to a media tab instead of leaving a blank 0-count view.
  if(state.room && !state.messages.length && state.hasMoreMessages){
    await loadMoreHistory({initial:true});
  }

  render();
  syncLoadingUI();
}

    await ensureAllHistory();

  }

    state.sortDirection === "desc" ? "최신순 ↓" : "오래된순 ↑";
