<!doctype html>
<!-- Fromm Viewer v0.47 · full-screen login gate + token countdown -->
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Fromm Viewer v0.47</title>
<style>
:root{
  --bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--text:#f5f6f8;--muted:#9da6b5;
  --line:#2a303b;--accent:#ff5b73;--accent2:#ff8798;--ok:#69d59a;--warn:#ffcb6b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:330px 1fr;min-height:100vh}
.sidebar{border-right:1px solid var(--line);background:#12151b;padding:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:20px;font-weight:800;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px;line-height:1.5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
label{display:block;color:var(--muted);font-size:12px;margin:10px 0 6px}
input,textarea{width:100%;border:1px solid var(--line);background:#0f1218;color:var(--text);border-radius:10px;padding:10px}
textarea{height:66px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:9px 12px;background:#2a303b;color:var(--text)}
.btn.primary{background:var(--accent);font-weight:700}
.btn.good{background:#246a49}
.btn:disabled{opacity:.45;cursor:not-allowed}
.rooms{display:flex;flex-direction:column;gap:6px}
.room{width:100%;text-align:left;background:#11151b;border:1px solid var(--line);color:var(--text);border-radius:11px;padding:10px 11px}
.room.active{border-color:var(--accent);background:#22171c}
.main{padding:22px;min-width:0}
.topbar{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:18px}
.title{font-size:24px;font-weight:800}
.status{color:var(--muted);font-size:13px;margin-top:5px}
.toolbar{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.pill{border:1px solid var(--line);background:#12161d;color:var(--muted);border-radius:999px;padding:7px 10px}
.pill.active{background:#2a1b21;color:#fff;border-color:var(--accent)}
.spacer{flex:1}
.stats{color:var(--muted);font-size:13px}
.timeline{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:9px}
.msg{display:flex}
.msg.star{justify-content:flex-start}
.msg.me{justify-content:flex-end}
.bubble{max-width:min(76%,680px);background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:10px 12px;overflow:hidden}
.me .bubble{background:#202937}
.meta{font-size:11px;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.type{font-weight:700;color:var(--accent2)}
.text{white-space:pre-wrap;word-break:break-word;line-height:1.45}
.media-wrap{display:flex;flex-direction:column;gap:8px}
.media-wrap img,.media-wrap video{display:block;max-width:100%;max-height:560px;border-radius:12px;background:#090b0f}
.media-wrap audio{width:min(100%,520px)}
.media-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.check{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px}
a.dl{color:#fff;text-decoration:none;background:#303744;padding:7px 9px;border-radius:8px;font-size:12px}
.date-sep{text-align:center;color:var(--muted);font-size:12px;margin:12px 0 4px}
.more{display:block;margin:18px auto;background:#252b35;color:#fff;border:1px solid var(--line);padding:9px 14px;border-radius:10px}
.empty{text-align:center;color:var(--muted);padding:80px 20px}
.progress{height:5px;background:#222733;border-radius:999px;overflow:hidden;margin-top:10px}
.progress>div{height:100%;background:var(--accent);width:0%}
.notice{font-size:12px;color:var(--warn);line-height:1.5;margin-top:8px}
@media(max-width:850px){
  .app{grid-template-columns:1fr}
  .sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .bubble{max-width:92%}
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:18px;
  align-items:start;
}
.media-card{
  position:relative;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  min-width:0;
}
.media-card.selected{
  outline:2px solid var(--accent);
  outline-offset:1px;
}
.thumb{
  position:relative;
  aspect-ratio:4/3;
  background:#090b0f;
  overflow:hidden;
}
.thumb img,.thumb video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.thumb.audio-thumb{
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#171b22,#252d39);
}
.audio-icon{
  font-size:54px;
  opacity:.78;
}
.card-badge{
  position:absolute;
  top:11px;
  left:11px;
  background:rgba(0,0,0,.72);
  border:1px solid rgba(255,255,255,.12);
  border-radius:8px;
  padding:6px 9px;
  font-size:12px;
  font-weight:800;
}
.card-download{
  position:absolute;
  top:10px;
  right:10px;
  width:38px;
  height:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.68);
  color:#fff;
  text-decoration:none;
  font-size:20px;
  border:1px solid rgba(255,255,255,.08);
}
.card-select{display:none}
.card-body{padding:13px 14px 15px}
.card-title{
  font-size:16px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.card-date{
  margin-top:7px;
  color:var(--muted);
  font-size:13px;
}
.card-audio{
  padding:10px 12px 0;
  background:var(--panel);
}
.card-audio audio{
  display:block;
  width:100%;
}


.sort-controls{
  display:flex;
  gap:8px;
  align-items:center;
}
.sort-btn{
  white-space:nowrap;
  background:#202630;
  border:1px solid var(--line);
}

.card-body{
  position:relative;
  min-height:72px;
  padding-right:104px;
}
.card-footer-select{
  position:absolute;
  right:12px;
  bottom:12px;
  height:34px;
  min-width:74px;
  padding:0 10px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  background:#10141b;
  border:1px solid var(--line);
  border-radius:10px;
  font-size:12px;
  font-weight:700;
  color:var(--muted);
  cursor:pointer;
  user-select:none;
  z-index:2;
  transition:background .14s ease,border-color .14s ease,color .14s ease,transform .08s ease;
}
.card-footer-select:hover{
  border-color:#515b6b;
  color:#eef1f6;
  background:#151b24;
}
.card-footer-select:active{
  transform:translateY(1px);
}
.card-select-input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}
.card-select-box{
  width:14px;
  height:14px;
  flex:0 0 14px;
  border:1.5px solid #aeb6c3;
  border-radius:4px;
  display:grid;
  place-items:center;
  background:#f6f7f9;
  transition:background .14s ease,border-color .14s ease;
}
.card-select-box::after{
  content:"";
  width:7px;
  height:4px;
  border-left:2px solid transparent;
  border-bottom:2px solid transparent;
  transform:rotate(-45deg) translateY(-1px);
}
.media-card.selected .card-footer-select{
  border-color:var(--accent);
  background:#281a20;
  color:#fff;
}
.media-card.selected .card-select-box{
  border-color:var(--accent);
  background:var(--accent);
}
.media-card.selected .card-select-box::after{
  border-left-color:#fff;
  border-bottom-color:#fff;
}
.card-select-text::after{
  content:"선택";
}
.media-card.selected .card-select-text::after{
  content:"선택됨";
}

.audio-thumb{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#171b22,#252d39);
}
.audio-icon{
  font-size:54px;
  opacity:.80;
  transform:translateY(-18px);
}
.audio-player-overlay{
  position:absolute;
  left:12px;
  right:12px;
  bottom:12px;
}
.audio-player-overlay audio{
  display:block;
  width:100%;
  height:40px;
}


.title-line{
  display:flex;
  align-items:baseline;
  gap:10px;
  flex-wrap:wrap;
}
.inline-status{
  margin-top:0;
  white-space:nowrap;
}
.topbar{
  margin-bottom:10px;
  align-items:center;
}

.toolbar{
  position:sticky;
  top:8px;
  z-index:50;
  margin-top:-2px;
  margin-bottom:16px;
  backdrop-filter:blur(12px);
  box-shadow:0 10px 30px rgba(0,0,0,.22);
}

.scroll-top{
  position:fixed;
  right:22px;
  bottom:24px;
  width:48px;
  height:48px;
  border-radius:50%;
  border:1px solid var(--line);
  background:rgba(30,34,43,.92);
  color:#fff;
  font-size:24px;
  font-weight:800;
  z-index:80;
  box-shadow:0 8px 24px rgba(0,0,0,.32);
  opacity:0;
  pointer-events:none;
  transform:translateY(8px);
  transition:opacity .18s ease, transform .18s ease, background .18s ease;
}
.scroll-top.visible{
  opacity:1;
  pointer-events:auto;
  transform:translateY(0);
}
.scroll-top:hover{
  background:var(--accent);
}

/* Reserve a small right gutter on desktop so the floating button does not cover cards. */
@media(min-width:851px){
  .main{padding-right:82px}
}

.media-card .thumb{
  content-visibility:auto;
  contain-intrinsic-size:320px 240px;
}
.media-card img{
  background:#0b0e13;
}


.auth-card{
  transition:padding .18s ease;
}
.auth-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.auth-toggle{
  padding:6px 8px;
  font-size:12px;
}
.auth-card.collapsed{
  padding:12px 14px;
}
.auth-card.collapsed #authFields{
  display:none;
}
.auth-compact{
  margin-top:9px;
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:13px;
}
.auth-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--ok);
  box-shadow:0 0 0 3px rgba(105,213,154,.12);
}

.media-card .thumb img,
.media-wrap img{
  cursor:zoom-in;
}

.lightbox{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.90);
  padding:40px 56px 56px;
}
.lightbox.open{
  display:flex;
}
.lightbox img{
  max-width:95vw;
  max-height:88vh;
  width:auto;
  height:auto;
  object-fit:contain;
  border-radius:10px;
  box-shadow:0 18px 60px rgba(0,0,0,.55);
  background:#080a0e;
  cursor:zoom-out;
}
.lightbox-close{
  position:fixed;
  top:16px;
  right:22px;
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.13);
  color:#fff;
  font-size:31px;
  line-height:1;
  cursor:pointer;
}
.lightbox-caption{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  max-width:min(80vw,900px);
  color:#d9dee8;
  background:rgba(0,0,0,.48);
  border-radius:999px;
  padding:7px 12px;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}


.infinite-sentinel{
  pointer-events:none;
}
.msg{
  content-visibility:auto;
  contain-intrinsic-size:80px;
}


.thumb{
  background:
    linear-gradient(110deg,#11151c 8%,#1b2029 18%,#11151c 33%);
  background-size:200% 100%;
  animation:thumbShimmer 1.35s linear infinite;
}
.thumb.media-ready{
  animation:none;
  background:#090b0f;
}
.thumb img,.thumb video{
  opacity:0;
  transition:opacity .18s ease;
}
.thumb.media-ready img,
.thumb.media-ready video{
  opacity:1;
}
@keyframes thumbShimmer{
  to{background-position-x:-200%}
}


.selected-count{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:72px;
  padding:7px 10px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#141922;
  color:#fff;
  font-size:13px;
  font-weight:800;
}
.selected-count.has-selection{
  border-color:var(--accent);
  background:#2a171d;
  color:#fff;
}


.chat-search{
  display:flex;
  align-items:center;
  gap:6px;
  min-width:240px;
  max-width:360px;
  height:38px;
  padding:0 8px 0 10px;
  border:1px solid var(--line);
  background:#10141b;
  border-radius:10px;
}
.chat-search input{
  flex:1;
  min-width:0;
  width:auto;
  border:0;
  outline:0;
  background:transparent;
  padding:0;
  color:var(--text);
}
.chat-search input::placeholder{
  color:#778191;
}
.chat-search-count{
  color:var(--muted);
  font-size:12px;
  white-space:nowrap;
}
.chat-search-clear{
  width:24px;
  height:24px;
  padding:0;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--muted);
  font-size:18px;
  line-height:1;
  cursor:pointer;
}
.chat-search-clear:hover{
  background:#252b35;
  color:#fff;
}
.text mark{
  background:#ffda63;
  color:#111;
  border-radius:3px;
  padding:0 1px;
}


.reply-quote{
  margin:2px 0 9px;
  padding:9px 11px;
  border-left:3px solid var(--accent);
  border-radius:10px;
  background:rgba(255,255,255,.055);
  cursor:pointer;
  transition:background .15s ease,border-color .15s ease;
}
.reply-quote:hover{
  background:rgba(255,255,255,.085);
}
.reply-label{
  color:var(--accent2);
  font-size:12px;
  font-weight:800;
  margin-bottom:5px;
}
.reply-content{
  color:#c4cad4;
  font-size:13px;
  line-height:1.45;
  white-space:pre-wrap;
  word-break:break-word;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.reply-media-label{
  color:#aab2bf;
  font-size:13px;
}
.msg.reply-target-flash .bubble{
  outline:2px solid var(--accent);
  box-shadow:0 0 0 6px rgba(255,91,115,.12);
}


.audio-error-note{
  position:absolute;
  left:12px;
  right:12px;
  bottom:58px;
  display:none;
  padding:6px 8px;
  border-radius:8px;
  background:rgba(0,0,0,.74);
  color:#f1c56a;
  font-size:11px;
  text-align:center;
  z-index:3;
}
.audio-thumb.audio-failed .audio-error-note{
  display:block;
}


.infinite-sentinel::after{
  content:"";
  display:block;
  width:22px;
  height:22px;
  margin:10px auto 4px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.15);
  border-top-color:var(--accent);
  animation:sentinelSpin .8s linear infinite;
  opacity:.65;
}
@keyframes sentinelSpin{to{transform:rotate(360deg)}}


.media-missing{
  color:#9da6b5;
  font-size:13px;
  font-style:italic;
}
.media-card-unavailable{
  opacity:.65;
}


.media-unavailable-note{
  position:absolute;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  padding:6px 9px;
  border-radius:8px;
  background:rgba(0,0,0,.72);
  color:#d6ad58;
  font-size:12px;
  white-space:nowrap;
}
.media-card-unavailable{
  opacity:.78;
}
.media-card-unavailable .thumb{
  filter:saturate(.6);
}


/* Stable media grid: 4 columns on wide desktop, then 3/2/1 responsively. */
.gallery{
  width:100%;
  max-width:none;
  margin:0;
  grid-template-columns:repeat(4,minmax(0,1fr));
}
@media(max-width:1350px){
  .gallery{grid-template-columns:repeat(3,minmax(0,1fr));}
}
@media(max-width:1050px){
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(max-width:700px){
  .gallery{grid-template-columns:1fr;}
}


.auth-actions{
  display:flex;
  align-items:center;
  gap:6px;
}
.auth-save-note{
  margin-top:6px;
  color:var(--muted);
  font-size:11px;
  line-height:1.35;
}
.danger-lite{
  color:#d7a8ae;
}
.danger-lite:hover{
  color:#fff;
  border-color:#82414d;
}


.date-jump{
  display:flex;
  align-items:center;
  gap:6px;
}
.date-jump input[type="date"]{
  height:38px;
  padding:0 9px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#10141b;
  color:var(--text);
  color-scheme:dark;
}
.date-jump .btn{
  height:38px;
  padding:0 11px;
  white-space:nowrap;
}
.msg.date-target-flash .bubble{
  animation:date-focus-rose 1.15s cubic-bezier(.22,.8,.32,1) both;
}

@keyframes date-focus-rose{
  0%{
    transform:translateY(0) scale(1);
    box-shadow:0 0 0 0 rgba(255,91,115,0);
    filter:brightness(1);
  }
  18%{
    transform:translateY(-1px) scale(1.012);
    box-shadow:
      0 0 0 1px rgba(255,91,115,.48),
      0 0 0 7px rgba(255,91,115,.10),
      0 8px 24px rgba(255,91,115,.10);
    filter:brightness(1.07);
  }
  55%{
    transform:translateY(0) scale(1.004);
    box-shadow:
      0 0 0 1px rgba(255,91,115,.24),
      0 0 0 4px rgba(255,91,115,.055),
      0 5px 16px rgba(255,91,115,.055);
    filter:brightness(1.035);
  }
  100%{
    transform:translateY(0) scale(1);
    box-shadow:0 0 0 0 rgba(255,91,115,0);
    filter:brightness(1);
  }
}


/* v0.25: compact full-chat search/date tool */
.chat-tools{
  position:relative;
  display:flex;
  align-items:center;
  flex:0 0 auto;
}

.chat-tools-btn{
  width:38px;
  height:38px;
  padding:0;
  border:1px solid var(--line);
  border-radius:10px;
  background:#151a22;
  color:var(--text);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}
.chat-tools-btn:hover,
.chat-tools-btn.active{
  border-color:var(--accent);
  background:#24171c;
}

.magnifier-icon{
  position:relative;
  display:block;
  width:15px;
  height:15px;
  border:2px solid currentColor;
  border-radius:50%;
}
.magnifier-icon::after{
  content:"";
  position:absolute;
  width:7px;
  height:2px;
  background:currentColor;
  right:-6px;
  bottom:-3px;
  transform:rotate(45deg);
  transform-origin:left center;
  border-radius:2px;
}

.chat-tools-panel{
  position:absolute;
  right:0;
  top:46px;
  z-index:150;
  display:none;
  width:min(390px,calc(100vw - 36px));
  padding:13px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#11161e;
  box-shadow:0 18px 48px rgba(0,0,0,.45);
}
.chat-tools-panel.open{
  display:block;
}
.chat-tools-title{
  margin-bottom:12px;
  font-size:14px;
  font-weight:800;
}
.chat-tools-label{
  margin:0 0 6px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}
.chat-tools-row{
  display:flex;
  align-items:center;
  gap:7px;
}
.chat-tools-row input[type="search"],
.chat-tools-row input[type="date"]{
  flex:1;
  min-width:0;
  width:auto;
  height:38px;
  padding:0 10px;
  border:1px solid var(--line);
  border-radius:9px;
  outline:none;
  background:#0d1117;
  color:var(--text);
}
.chat-tools-row input[type="date"]{
  color-scheme:dark;
}
.chat-tools-row input:focus{
  border-color:var(--accent);
}
.chat-tools-divider{
  height:1px;
  margin:12px 0;

/* ===== v0.37 subtle UI motion ===== */
.reload-btn{
  width:40px;
  height:40px;
  flex:0 0 40px;
  display:inline-grid;
  place-items:center;
  border:1px solid var(--line);
  border-radius:50%;
  background:#171c24;
  color:#e9edf4;
  padding:0;
  cursor:pointer;
  transition:
    background .16s ease,
    border-color .16s ease,
    transform .12s ease,
    opacity .16s ease;
}
.reload-btn:hover:not(:disabled){
  background:#202733;
  border-color:#4b5667;
  transform:translateY(-1px);
}
.reload-btn:active:not(:disabled){
  transform:scale(.94);
}
.reload-btn:disabled{
  opacity:.62;
  cursor:default;
}
.reload-icon{
  display:block;
  font-size:23px;
  line-height:1;
  transform-origin:50% 50%;
}
.reload-btn.loading .reload-icon{
  animation:none;
  opacity:.48;
}

/* Loading is intentionally concentrated in ONE place:
   a thin moving line on the tab/action bar. No spinning circles. */
.pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:
    background .16s ease,
    border-color .16s ease,
    color .16s ease,
    transform .12s ease;
}
.pill:active{
  transform:scale(.96);
}

.toolbar{
  overflow:visible;
}
.toolbar::after{
  content:"";
  position:absolute;
  left:12px;
  right:12px;
  bottom:-1px;
  height:2px;
  border-radius:999px;
  background:linear-gradient(
    90deg,
    transparent 0%,
    rgba(255,91,115,.15) 22%,
    rgba(255,91,115,.92) 50%,
    rgba(255,91,115,.15) 78%,
    transparent 100%
  );
  opacity:0;
  transform:scaleX(.18) translateX(-220%);
  transform-origin:center;
  pointer-events:none;
}
.toolbar.is-loading::after{
  opacity:1;
  animation:toolbar-loading-line 1.15s ease-in-out infinite;
}

/* Loading copy stays still. The toolbar line is the only moving loader. */
.inline-loader{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:var(--muted);
}

/* Selection button "press" feedback */
.card-footer-select{
  will-change:transform;
}
.card-footer-select.select-pop{
  animation:select-pop .22s ease-out;
}
.media-card.selected .card-footer-select{
  box-shadow:0 0 0 3px rgba(255,91,115,.08);
}

/* Content itself stays visually stable during refresh/tab loading. */

/* Lightbox and drawer transitions feel slightly smoother. */
.lightbox{
  transition:opacity .18s ease;
}
#sidebar{
  will-change:transform;
}

@keyframes ui-spin{
  to{ transform:rotate(360deg); }
}
@keyframes select-pop{
  0%{ transform:scale(1); }
  45%{ transform:scale(.91); }
  100%{ transform:scale(1); }
}
@keyframes content-in{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@media(prefers-reduced-motion:reduce){
  .reload-btn,
  .pill,
  .card-footer-select,
  .lightbox{
    transition:none !important;
  }
  .reload-btn.loading .reload-icon,
  .card-footer-select.select-pop,
  .msg.date-target-flash .bubble{
    animation:none !important;
  }
}


@keyframes toolbar-loading-line{
  0%{
    transform:scaleX(.18) translateX(-220%);
    opacity:.35;
  }
  50%{
    transform:scaleX(.38) translateX(0);
    opacity:1;
  }
  100%{
    transform:scaleX(.18) translateX(220%);
    opacity:.35;
  }
}

/* v0.39 scroll-compacted header:
   when scrolling down the tab/action bar glides up beside the hamburger. */
.topbar,
.toolbar{
  transition:
    top .24s cubic-bezier(.2,.75,.25,1),
    transform .24s cubic-bezier(.2,.75,.25,1),
    opacity .18s ease,
    margin-left .24s cubic-bezier(.2,.75,.25,1),
    box-shadow .2s ease,
    border-radius .2s ease;
}

body.header-compact .topbar{
  transform:translateY(-115%);
  opacity:0;
  pointer-events:none;
}

body.header-compact .toolbar{
  top:8px !important;
  margin-left:50px !important;

}

/* Keep the hamburger visually centered next to the compact toolbar. */
body.header-compact .sidebar-toggle-btn{
  top:15px;
}

@media(max-width:700px){
  body.header-compact .toolbar{
    top:6px !important;

  }
}

/* No rotating loader animations in reduced-motion either. */
@media(prefers-reduced-motion:reduce){
  .toolbar.is-loading::after{
    animation:none !important;
    opacity:.75;
    transform:scaleX(1) !important;
  }
  .topbar,

    transition:none !important;
  }
}

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const state = {
  rooms: [],
  room: null,
  messages: [],
  filter: "all",
  sortDirection: "desc",
  chatQuery: "",
  chunkSize: 120,
  initialChunks: 2,
  prefetchAhead: 180,
  infiniteList: [],
  infiniteRendered: 0,
  infiniteObserver: null,
  infiniteLastDate: "",
  infiniteVersion: 0,
  prefetching: new Set(),
  roomCache: new Map(),
  selected: new Set(),
  mediaSequence: new Map(),

  // Progressive history loading:
  // load the newest ~500 messages first, then another ~500 near the end.
  pageTarget: 500,
  pageRequestLimit: 500,
  cursorEnd: null,
  hasMoreMessages: true,
  loadingMessages: false,
  seenMessageKeys: new Set(),
  scanGeneration: 0,

  // Full conversation uses its own complete history.
  // Media tabs keep the progressive 500-message API loader.
  chatMessages: [],
  chatHistoryComplete: false,
  chatHistoryLoading: false,
  chatHistoryProgress: 0,
  chatCache: new Map(),
  chatRenderObserver: null,

  selectedDate: "",
  calendarMonth: null,

  // Only normal entry into 전체 대화 should jump to the top.
  // Date/reply jumps must not be overwritten by a later auto-top frame.
  chatAutoTopPending: false,

  // Last folder handle / failed items are kept only for this browser session.
  lastSaveRoot: null,
  lastSaveFailures: [],
};

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
function isArtist(m){ return String(m.userType || "").toLowerCase() === "star"; }
function normType(t){
  t = String(t || "").toLowerCase();
  return t === "audio" ? "sound" : t;
}
function isHttpMediaUrl(value){
  if(typeof value !== "string") return false;
  let s = value.trim();
  if(!s) return false;

  if(s.startsWith("//")) s = "https:" + s;

  try{
    const u = new URL(s);
    return u.protocol === "https:" || u.protocol === "http:";
  }catch{
    return false;
  }
}

function normalizeMediaUrl(value){
  if(typeof value !== "string") return "";
  let s = value.trim();
  if(!s) return "";
  if(s.startsWith("//")) s = "https:" + s;
  return isHttpMediaUrl(s) ? s : "";
}

function resolveMediaUrl(m){
  if(!m || typeof m !== "object") return "";

  const t = normType(m.type);

  // Normal/current message shapes first.
  const directKeys = [
    "content","url","mediaUrl","mediaURL","fileUrl","fileURL",
    "audioUrl","audioURL","soundUrl","soundURL",
    "videoUrl","videoURL","imageUrl","imageURL",
    "originalUrl","originalURL","downloadUrl","downloadURL",
    "resourceUrl","resourceURL","sourceUrl","sourceURL"
  ];

  for(const key of directKeys){
    const v = m[key];

    if(typeof v === "string"){
      const direct = normalizeMediaUrl(v);
      if(direct) return direct;

      const raw = v.trim();
      if((raw.startsWith("{") && raw.endsWith("}")) ||
         (raw.startsWith("[") && raw.endsWith("]"))){
        try{
          const found = findMediaUrlDeep(JSON.parse(raw), 0);
          if(found) return found;
        }catch{}
      }
    }else if(v && typeof v === "object"){
      const found = findMediaUrlDeep(v, 0);
      if(found) return found;
    }
  }

  // Legacy Fromm sound messages:
  // the API can return content:"" while thumbnail contains the actual audio URL.
  // Do this ONLY for sound; video/image thumbnails are preview images.
  if(t === "sound"){
    const legacyAudio = normalizeMediaUrl(m.thumbnail || "");
    if(legacyAudio) return legacyAudio;
  }

  const nestedKeys = [
    "media","file","resource","attachment","attachments",
    "audio","sound","video","image","asset","source"
  ];

  for(const key of nestedKeys){
    if(m[key]){
      const found = findMediaUrlDeep(m[key], 0);
      if(found) return found;
    }
  }

  return "";
}

function findMediaUrlDeep(value, depth=0){
  if(depth > 4 || value == null) return "";

  if(typeof value === "string"){
    const direct = normalizeMediaUrl(value);
    if(direct) return direct;

    const raw = value.trim();
    if((raw.startsWith("{") && raw.endsWith("}")) ||
       (raw.startsWith("[") && raw.endsWith("]"))){
      try{
        return findMediaUrlDeep(JSON.parse(raw), depth+1);
      }catch{}
    }
    return "";
  }

  if(Array.isArray(value)){
    for(const item of value){
      const found = findMediaUrlDeep(item, depth+1);
      if(found) return found;
    }
    return "";
  }

  if(typeof value === "object"){
    // Prefer URL-ish keys over arbitrary nested strings.
    const priority = [
      "url","mediaUrl","fileUrl","audioUrl","soundUrl","videoUrl","imageUrl",
      "originalUrl","downloadUrl","resourceUrl","sourceUrl","content"
    ];

    for(const key of priority){
      if(key in value){
        const found = findMediaUrlDeep(value[key], depth+1);
        if(found) return found;
      }
    }

    for(const [key,val] of Object.entries(value)){
      if(/url|media|file|audio|sound|video|image|resource|source|asset/i.test(key)){
        const found = findMediaUrlDeep(val, depth+1);
        if(found) return found;
      }
    }
  }

  return "";
}

function hasUsableMedia(m){
  return ["image","video","sound"].includes(normType(m?.type)) &&
         !!resolveMediaUrl(m);
}

function isMedia(m){
  return ["image","video","sound"].includes(normType(m?.type));
}

function hasReplyPayload(m){
  return !!getQuotedMessage(m);
}

function specialTextState(m){
  if(!m || typeof m !== "object") return null;

  const content = String(m.content || "").trim();
  if(content) return null;

  if(resolveEmoticonUrl(m) || hasEmoticonData(m)){
    return {kind:"emoticon"};
  }

  // Reply-only messages should show the quote card without an extra
  // "[빈 메시지]" line underneath.
  if(hasReplyPayload(m)){
    return {kind:"reply-only"};
  }

  if(m.deletedAt){
    return {kind:"deleted", label:"삭제된 메시지"};
  }

  if(m.blocked === true){
    return {kind:"blocked", label:"표시할 수 없는 메시지"};
  }

  // Some historical/system records are metadata-only.
  const meaningfulKeys = [
    "mentionedMessage","embeddedMentionedMessage","mentionDetailMessage",
    "replyMessage","embeddedReplyMessage","quotedMessage",
    "emoticon","sticker","emoji"
  ];

  if(meaningfulKeys.some(k=>m[k])){
    return {kind:"special", label:"특수 메시지"};
  }

  // No visible payload at all: hide it from the conversation UI.
  return {kind:"hidden-empty"};
}

function resolveEmoticonUrl(m){
  if(!m || typeof m !== "object") return "";

  const candidates = [
    m.emoticon,
    m.emoticonUrl,
    m.emoticonURL,
    m.emoticonImage,
    m.sticker,
    m.stickerUrl,
    m.stickerURL,
    m.emoji,
    m.emojiUrl,
    m.emojiURL
  ];

  for(const candidate of candidates){
    if(candidate == null) continue;

    if(typeof candidate === "string"){
      const direct = normalizeMediaUrl(candidate);
      if(direct) return direct;

      const raw = candidate.trim();
      if((raw.startsWith("{") && raw.endsWith("}")) ||
         (raw.startsWith("[") && raw.endsWith("]"))){
        try{
          const found = findMediaUrlDeep(JSON.parse(raw),0);
          if(found) return found;
        }catch{}
      }
    }else if(typeof candidate === "object"){
      const found = findMediaUrlDeep(candidate,0);
      if(found) return found;
    }
  }

  // Some historical text-emoticon payloads expose the image through thumbnail.
  if(normType(m.type) === "text" &&
     !String(m.content || "").trim() &&
     m.emoticon){
    const thumb = normalizeMediaUrl(m.thumbnail || "");
    if(thumb) return thumb;
  }

  return "";
}

function hasEmoticonData(m){
  if(!m || typeof m !== "object") return false;
  return !!(
    m.emoticon ||
    m.emoticonUrl ||
    m.emoticonURL ||
    m.emoticonImage ||
    m.sticker ||
    m.stickerUrl ||
    m.stickerURL ||
    m.emoji ||
    m.emojiUrl ||
    m.emojiURL
  );
}

function emoticonProxyUrl(m){
  return resolveEmoticonUrl(m);
}

function messageStableKey(m){
  return String(
    m?.messageId ??
    m?.id ??
    m?.starChatId ??
    m?.createdAt ??
    ""
  );
}

function compareMessages(a,b,direction="asc"){
  const ta = new Date(a?.createdAt).getTime() || 0;
  const tb = new Date(b?.createdAt).getTime() || 0;

  if(ta !== tb){
    return direction === "asc" ? (ta - tb) : (tb - ta);
  }

  // Same timestamp: deterministic tie-breaker so cards do not reshuffle.
  const ka = messageStableKey(a);
  const kb = messageStableKey(b);
  const cmp = ka.localeCompare(kb);
  return direction === "asc" ? cmp : -cmp;
}

function dateKey(m){
  const d = new Date(m.createdAt);
  if (Number.isNaN(d.getTime())) return "unknown-date";
  return d.toLocaleDateString("sv-SE"); // YYYY-MM-DD in local timezone
}
function timeLabel(m){
  const d = new Date(m.createdAt);
  if (Number.isNaN(d.getTime())) return "";
  return d.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
}
function baseName(m){
  return state.mediaSequence.get(String(m.messageId)) || `${dateKey(m)}_1`;
}
function mediaFolder(t){
  t = normType(t);
  return t === "image" ? "photos" : t === "video" ? "videos" : "audio";
}
function contentTypeExt(ct,t){
  ct = String(ct||"").split(";")[0].trim().toLowerCase();
  const map = {
    "image/jpeg":".jpg","image/png":".png","image/webp":".webp","image/gif":".gif","image/heic":".heic",
    "video/mp4":".mp4","video/quicktime":".mov","video/webm":".webm",
    "audio/mp4":".m4a","audio/x-m4a":".m4a","audio/mpeg":".mp3","audio/aac":".aac",
    "audio/wav":".wav","audio/x-wav":".wav","audio/ogg":".ogg"
  };
  return map[ct] || (normType(t)==="image"?".jpg":normType(t)==="video"?".mp4":".m4a");
}
function previewUrl(m){
  const t = normType(m?.type);

  // For legacy sound messages, thumbnail is the AUDIO URL, not a visual preview.
  if(t === "sound"){
    return proxyUrl(m,false);
  }

  return normalizeMediaUrl(m?.thumbnail || "") || proxyUrl(m,false);
}

function markThumbReady(el){
  const thumb = el?.closest?.(".thumb") || el?.parentElement;
  if(thumb) thumb.classList.add("media-ready");
}

function prefetchImage(url){
  return new Promise(resolve=>{
    if(!url){ resolve(); return; }
    const img = new Image();
    img.decoding = "async";
    img.onload = ()=>resolve();
    img.onerror = ()=>resolve();
    img.src = url;
  });
}

function prefetchMediaRange(startIndex){
  const list = state.infiniteList || [];
  const end = Math.min(startIndex + state.prefetchAhead, list.length);

  for(let i=startIndex;i<end;i++){
    const m = list[i];
    if(!m || !hasUsableMedia(m)) continue;

    const id = String(m.messageId || `${m.createdAt}|${m.type}`);
    if(state.prefetching.has(id)) continue;
    state.prefetching.add(id);

    const t = normType(m.type);

    if(t==="image"){
      // First warm the lightweight preview. Full image is loaded only when the card exists.
      prefetchImage(previewUrl(m));
    }else if(t==="video"){
      // Warm the poster only; never pre-download the whole video.
      if(m.thumbnail) prefetchImage(previewUrl(m));
    }else if(t==="sound"){
      // Warm audio metadata with a detached element.
      try{
        const a = document.createElement("audio");
        a.preload = "metadata";
        a.src = proxyUrl(m,false);
        a.load();
        setTimeout(()=>{ a.src=""; }, 12000);
      }catch{}
    }
  }
}

function proxyUrl(m, download=false){
  // GitHub Pages build: media is requested directly from Fromm/CDN.
  // The companion Chrome extension adjusts the required CORS/origin headers.
  return resolveMediaUrl(m);
}

const FROMM_API_BASE = "https://api.frommyarti.com";
let activeAuth = {token:"", uuid:""};

function setActiveAuth(token="",uuid=""){
  activeAuth = {
    token:String(token || "").trim(),
    uuid:String(uuid || "").trim()
  };
}

function currentAuth(){
  if(activeAuth.token && activeAuth.uuid){
    return activeAuth;
  }

  const saved = readSavedAuth();
  return {
    token:String(saved.token || "").trim(),
    uuid:String(saved.uuid || "").trim()
  };
}

function friendlyNetworkError(error){
  const raw = String(error?.message || error || "");

  if(/failed to fetch|networkerror|load failed|cors/i.test(raw)){
    return new Error(
      "Fromm API에 연결하지 못했습니다. Fromm Viewer Bridge 확장프로그램이 설치·활성화되어 있는지 확인해주세요."
    );
  }

  return error instanceof Error ? error : new Error(raw || "네트워크 오류");
}

async function frommApiJson(path, query=null){
  const auth = currentAuth();

  if(!auth.token || !auth.uuid){
    throw new Error("토큰과 Device ID를 먼저 연결해주세요.");
  }

  const url = new URL(path, FROMM_API_BASE);

  if(query){
    for(const [key,value] of Object.entries(query)){
      if(value !== undefined && value !== null && value !== ""){
        url.searchParams.set(key,String(value));
      }
    }
  }

  let r;
  try{
    r = await fetch(url.toString(),{
      method:"GET",
      headers:{
        "Authorization":auth.token,
        "uuid":auth.uuid,
        "Accept":"application/json"
      },
      cache:"no-store"
    });
  }catch(e){
    throw friendlyNetworkError(e);
  }

  let data = null;
  const text = await r.text();

  if(text){
    try{
      data = JSON.parse(text);
    }catch{
      data = null;
    }
  }

  if(!r.ok){
    const detail =
      data?.error ||
      data?.message ||
      data?.detail ||
      text ||
      `HTTP ${r.status}`;

    throw new Error(`Fromm API HTTP ${r.status}: ${String(detail).slice(0,500)}`);
  }

  if(data?.ok === false){
    throw new Error(data?.error || data?.message || "Fromm API 요청 실패");
  }

  return data;
}

const AUTH_TOKEN_KEY = "fromm_local_access_token_v1";
const AUTH_UUID_KEY = "fromm_local_device_id_v1";
const AUTH_REFRESH_KEY = "fromm_refresh_token";
const AUTH_RESOURCE_KEY = "fromm_resource_token";
const AUTH_EXPIRY_KEY = "fromm_token_expiry";
const AUTH_EMAIL_KEY = "fromm_login_email_v1";

function readSavedAuth(){
  try{
    return {
      token: localStorage.getItem(AUTH_TOKEN_KEY) || "",
      uuid: localStorage.getItem(AUTH_UUID_KEY) || ""
    };
  }catch{
    return {token:"",uuid:""};
  }
}

function saveAuthLocally(token,uuid,extra={}){
  try{
    localStorage.setItem(AUTH_TOKEN_KEY, token);
    localStorage.setItem(AUTH_UUID_KEY, uuid);

    if(extra.email){
      localStorage.setItem(AUTH_EMAIL_KEY, extra.email);
    }
    if(extra.refreshToken){
      localStorage.setItem(AUTH_REFRESH_KEY, extra.refreshToken);
    }
    if(extra.resourceToken){
      localStorage.setItem(AUTH_RESOURCE_KEY, extra.resourceToken);
    }
    if(extra.expiry){
      localStorage.setItem(AUTH_EXPIRY_KEY, String(extra.expiry));
    }
  }catch(e){
    console.warn("인증정보 저장 실패", e);
  }
}

function fillSavedAuth(){

  try{

function validLoginEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || "").trim());
}

function getOrCreateLoginDeviceId(){
  let id = $("#loginDeviceId")?.value.trim() || "";

  if(!id){
    try{
      id =
        localStorage.getItem(AUTH_UUID_KEY) ||
        localStorage.getItem("fromm_device_id") ||
        "";
    }catch{}
  }

  if(!id){
    id = crypto.randomUUID();
  }

  if($("#loginDeviceId")){
    $("#loginDeviceId").value = id;
  }

  return id;
}

async function encryptLoginPassword(password,deviceId){
  const encoder = new TextEncoder();
  const keySource = encoder.encode(deviceId);
  const rawKey = keySource.slice(0,32);

  if(![16,24,32].includes(rawKey.length)){
    throw new Error("Device ID 형식이 올바르지 않습니다.");
  }

  const iv = rawKey.slice(0,16);

  const cryptoKey = await crypto.subtle.importKey(
    "raw",
    rawKey,
    {name:"AES-CBC"},
    false,
    ["encrypt"]
  );

  const encryptedBuffer = await crypto.subtle.encrypt(
    {name:"AES-CBC",iv},
    cryptoKey,
    encoder.encode(password)
  );

  return Array.from(new Uint8Array(encryptedBuffer))
    .map(b=>b.toString(16).padStart(2,"0"))
    .join("");
}

function readTokenExpiryMs(){
  let raw = "";

  try{
    raw =
      localStorage.getItem(AUTH_EXPIRY_KEY) ||
      localStorage.getItem("fromm_token_expiry") ||
      "";
  }catch{}

  if(!raw) return 0;

  const n = Number(raw);

  if(!Number.isFinite(n) || n <= 0){
    return 0;
  }

  // v0.46 stored an epoch value in seconds.
  return n < 10_000_000_000 ? n * 1000 : n;
}

function formatTokenRemaining(ms){
  if(ms <= 0){
    return "만료";
  }

  const totalMinutes = Math.max(0,Math.floor(ms/60000));
  const days = Math.floor(totalMinutes/1440);
  const hours = Math.floor((totalMinutes%1440)/60);
  const minutes = totalMinutes%60;

  // Similar compact style to the reference site's 91h 34m timer.
  if(days > 0){
    return `${days*24 + hours}h ${minutes}m`;
  }

  return `${hours}h ${minutes}m`;
}

let tokenCountdownTimer = null;

function stopTokenCountdown(){
  if(tokenCountdownTimer){
    clearInterval(tokenCountdownTimer);
    tokenCountdownTimer = null;
  }
}

function syncTokenCountdown(){
  const wrap = $("#tokenLifeWrap");
  const text = $("#tokenLifeText");

  if(!wrap || !text){
    return;
  }

  const expiry = readTokenExpiryMs();

  // Tokens entered/saved before email-login support may have no expiry metadata.
  if(!expiry){
    text.textContent = "유효시간 확인불가";
    wrap.classList.remove("expiring","expired");
    return;
  }

  const remaining = expiry - Date.now();

  text.textContent = formatTokenRemaining(remaining);
  wrap.classList.toggle(
    "expiring",
    remaining > 0 && remaining <= 6*60*60*1000
  );
  wrap.classList.toggle("expired",remaining <= 0);

  if(remaining <= 0){
    stopTokenCountdown();
    setActiveAuth();

    showLoginGate(
      "로그인 유효시간이 끝났습니다. 다시 로그인해주세요.",
      "error"
    );
  }
}

function startTokenCountdown(){
  stopTokenCountdown();
  syncTokenCountdown();

  tokenCountdownTimer = setInterval(
    syncTokenCountdown,
    30000
  );
}

async function checkLoginEmail(){
  const email = $("#loginEmail").value.trim();

  $("#loginBtn").disabled = true;

  if(!validLoginEmail(email)){
    setLoginStatus("이메일 형식을 확인해주세요.","error");
    return;
  }

  $("#checkEmailBtn").disabled = true;
  setLoginStatus("이메일 확인 중...");

  try{
    const response = await fetch(
      "https://account-api.frommyarti.com/auth/exist",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json; charset=UTF-8"
        },
        body:JSON.stringify({username:email})
      }
    );

    const text = await response.text();
    let data = {};

    try{
      data = text ? JSON.parse(text) : {};
    }catch{}

    if(response.ok && data?.success === true){
      $("#loginBtn").disabled = false;

      setLoginStatus(
        "이메일 확인 완료. 비밀번호를 입력하고 로그인하세요.",
        "ok"
      );

      try{
        localStorage.setItem(AUTH_EMAIL_KEY,email);
      }catch{}
    }else{
      setLoginStatus(
        data?.message || "등록된 Fromm 계정을 확인하지 못했습니다.",
        "error"
      );
    }
  }catch(e){
    setLoginStatus(
      "이메일 확인 요청에 실패했습니다. 확장프로그램이 켜져 있는지 확인해주세요.",
      "error"
    );
  }finally{
    $("#checkEmailBtn").disabled = false;
  }
}

async function loginWithFromm(){
  const email = $("#loginEmail").value.trim();
  const password = $("#loginPassword").value;

  if(!validLoginEmail(email)){
    setLoginStatus("이메일 형식을 확인해주세요.","error");
    return;
  }

  if(!password){
    setLoginStatus("비밀번호를 입력해주세요.","error");
    return;
  }

  const btn = $("#loginBtn");
  btn.disabled = true;
  setLoginStatus("로그인 중...");

  try{
    const deviceId = getOrCreateLoginDeviceId();
    const encryptedHex = await encryptLoginPassword(password,deviceId);

    const response = await fetch(
      "https://account-api.frommyarti.com/auth/signin",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json; charset=UTF-8",
          "uuid":deviceId
        },
        body:JSON.stringify({
          username:email,
          password:encryptedHex,
          deviceId,
          from:"store",
          allowUpdateDeviceId:true
        })
      }
    );

    const text = await response.text();
    let data = {};

    try{
      data = text ? JSON.parse(text) : {};
    }catch{}

    const responseData = data?.data;

    if(!response.ok || !data?.success || !responseData?.accessToken){
      throw new Error(
        data?.message ||
        data?.error ||
        "로그인 정보를 확인해주세요."
      );
    }

    const expiresIn = Number(responseData.expiresIn || 0);

    const expiry = expiresIn > 0
      ? Math.floor(Date.now()/1000) + expiresIn
      : "";

    setActiveAuth(
      responseData.accessToken,
      deviceId
    );

    await loadRooms();

    saveAuthLocally(
      responseData.accessToken,
      deviceId,
      {
        email,
        refreshToken:responseData.refreshToken || "",
        resourceToken:responseData.resourceToken || "",
        expiry
      }
    );

    try{
      localStorage.setItem(
        "fromm_access_token",
        responseData.accessToken
      );
      localStorage.setItem(
        "fromm_device_id",
        deviceId
      );

      if(responseData.refreshToken){
        localStorage.setItem(
          "fromm_refresh_token",
          responseData.refreshToken
        );
      }

      if(responseData.resourceToken){
        localStorage.setItem(
          "fromm_resource_token",
          responseData.resourceToken
        );
      }

      if(expiry){
        localStorage.setItem(
          "fromm_token_expiry",
          String(expiry)
        );
      }
    }catch{}

    $("#loginPassword").value = "";

    hideLoginGate();
    startTokenCountdown();
    return true;
  }catch(e){
    setActiveAuth();

    setLoginStatus(
      e?.message || "로그인에 실패했습니다.",
      "error"
    );

    return false;
  }finally{
    btn.disabled = false;
  }
}

async function connectSavedAuth({silent=false}={}){
  const saved = readSavedAuth();

  if(!saved.token || !saved.uuid){
    showLoginGate();
    return false;
  }

  const expiry = readTokenExpiryMs();

  if(expiry && expiry <= Date.now()){
    setActiveAuth();

    showLoginGate(
      "저장된 로그인 유효시간이 끝났습니다. 다시 로그인해주세요.",
      "error"
    );

    return false;
  }

  setActiveAuth(saved.token,saved.uuid);

  try{
    await loadRooms();

    hideLoginGate();
    startTokenCountdown();
    return true;
  }catch(e){
    setActiveAuth();

    showLoginGate(
      "저장된 로그인이 만료됐거나 유효하지 않습니다. 다시 로그인해주세요.",
      "error"
    );

    return false;
  }
}

async function autoConnectSaved(){
  fillSavedAuth();

  const saved = readSavedAuth();

  if(!saved.token || !saved.uuid){
    showLoginGate();
    return false;
  }

  return connectSavedAuth({silent:true});
}

function saveRoomCache(){

  if(!key) return;

  state.roomCache.set(key,{
    messages: state.messages,
    cursorEnd: state.cursorEnd ? new Date(state.cursorEnd).toISOString() : null,
    hasMoreMessages: state.hasMoreMessages,
    pageRequestLimit: state.pageRequestLimit
  });
}

function restoreRoomCache(entry){
  state.messages = Array.isArray(entry?.messages) ? entry.messages : [];
  state.cursorEnd = entry?.cursorEnd ? new Date(entry.cursorEnd) : new Date();
  state.hasMoreMessages = entry?.hasMoreMessages !== false;
  state.pageRequestLimit = Number(entry?.pageRequestLimit || 500);

  state.seenMessageKeys = new Set(
    state.messages.map(m=>String(m.messageId || `${m.createdAt}|${m.type}|${m.content}`))
  );

  buildMediaSequences();
  updateHistoryStatus("캐시");
}

function resetHistoryPaging(){
  state.messages = [];
  state.cursorEnd = new Date();
  state.hasMoreMessages = true;
  state.loadingMessages = false;
  state.pageRequestLimit = 500;
  state.seenMessageKeys = new Set();

  state.mediaSequence.clear();
  disconnectInfiniteObserver();
  state.infiniteList = [];
  state.infiniteRendered = 0;
  state.infiniteLastDate = "";
  state.prefetching.clear();
}

function resetFullChatHistory(){
  if(state.chatRenderObserver){
    state.chatRenderObserver.disconnect();
    state.chatRenderObserver = null;
  }

  state.chatMessages = [];
  state.chatHistoryComplete = false;
  state.chatHistoryLoading = false;
  state.chatHistoryProgress = 0;
}

function chatCacheKey(){
  return String(state.room?.hostChatRoomId || "");
}

function restoreFullChatCache(){
  const cached = state.chatCache.get(chatCacheKey());
  if(!cached?.length) return false;

  state.chatMessages = cached;
  state.chatHistoryComplete = true;
  state.chatHistoryLoading = false;
  state.chatHistoryProgress = cached.length;
  buildMediaSequences();
  renderDateCalendar();
  return true;
}

async function ensureFullChatHistory(){
  if(!state.room) return false;
  if(state.chatHistoryComplete) return true;

  if(state.chatHistoryLoading){
    while(state.chatHistoryLoading){
      await sleep(80);
    }
    return state.chatHistoryComplete;
  }

  if(restoreFullChatCache()){
    return true;
  }

  const generation = state.scanGeneration;
  const roomId = String(state.room.hostChatRoomId);

  state.chatHistoryLoading = true;
  state.chatHistoryProgress = 0;
  syncLoadingUI();

  const seen = new Set();
  const all = [];

  let cursorEnd = new Date();
  let requestLimit = 500;
  let safety = 0;

  try{
    while(true){
      if(generation !== state.scanGeneration) return false;

      safety++;
      if(safety > 10000){
        throw new Error("전체 대화 페이지 안전 제한에 도달했습니다.");
      }

      let data;
      try{
        data = await requestHistoryPage(roomId,cursorEnd,requestLimit);
      }catch(e){
        if(requestLimit > 100){
          requestLimit = 100;
          data = await requestHistoryPage(roomId,cursorEnd,100);
        }else{
          throw e;
        }
      }

      if(generation !== state.scanGeneration) return false;

      const batch = data?.data?.messages || [];
      if(!batch.length) break;

      for(const msg of batch){
        const key = String(msg.messageId || `${msg.createdAt}|${msg.type}|${msg.content}`);
        if(!seen.has(key)){
          seen.add(key);
          all.push(msg);
        }
      }

      state.chatHistoryProgress = all.length;

      if(state.filter === "all"){
        $("#scanState").textContent =
          `${state.room?.host?.nick || "아티스트"} · 전체 대화 준비 중 ${all.length.toLocaleString()}개...`;
      }

      const dated = batch
        .filter(msg=>msg.createdAt)
        .sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));

      if(!dated.length) break;

      const next = new Date(new Date(dated[0].createdAt).getTime()-1);

      if(!Number.isFinite(next.getTime()) || next >= cursorEnd){
        break;
      }

      cursorEnd = next;
    }

    if(generation !== state.scanGeneration) return false;

    all.sort((a,b)=>compareMessages(a,b,"asc"));

    state.chatMessages = all;
    state.chatHistoryComplete = true;
    state.chatHistoryProgress = all.length;
    state.chatCache.set(chatCacheKey(), all);

    buildMediaSequences();
    renderDateCalendar();

    if(state.filter === "all"){
      $("#scanState").textContent =
        `${state.room?.host?.nick || "아티스트"} · 전체 대화 ${all.length.toLocaleString()}개 · 오래된 순`;
    }

    return true;
  }catch(e){
    if(generation === state.scanGeneration){
      $("#scanState").textContent = "전체 대화 불러오기 실패";
      alert(e.message);
    }
    return false;
  }finally{
    if(generation === state.scanGeneration){
      state.chatHistoryLoading = false;
      syncLoadingUI();
    }
  }
}

async function loadRooms(){
  const data = await frommApiJson("/v2/chat/fanFriendAndChatRooms");
  state.rooms = data?.data?.chatRooms || [];
  const el = $("#rooms");
  el.innerHTML = "";
  state.rooms.forEach((r,i)=>{
    const b = document.createElement("button");
    b.className = "room";
    b.textContent = r?.host?.nick || r?.chatRoomName || `채팅방 ${i+1}`;
    b.onclick = ()=>selectRoom(i,b);
    el.appendChild(b);
  });
}

function selectRoom(i, btn){
  state.scanGeneration++;

  if(document.body.classList.contains("sidebar-open")){
    setSidebarOpen(false);
  }

  state.room = state.rooms[i];
  state.chatQuery = "";
  state.selectedDate = "";
  state.calendarMonth = null;

  if($("#chatSearchInput")) $("#chatSearchInput").value = "";
  if($("#datePickerText")) $("#datePickerText").textContent = "날짜 선택";

  state.selected.clear();
  updateSelectedCount();

  $$(".room").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");

  const artist = state.room?.host?.nick || "아티스트";
  $("#artistTitle").textContent = artist;
  $("#scanBtn").disabled = false;
  syncLoadingUI();

  resetFullChatHistory();

  const cached = state.roomCache.get(roomCacheKey());

  if(cached && cached.messages?.length){
    restoreRoomCache(cached);
  }else{
    resetHistoryPaging();
  }

  restoreFullChatCache();

  updateChatSearchCount();

  if(state.filter === "all"){
    state.chatAutoTopPending = true;
  }

  render();

  setTimeout(async ()=>{
    // Media tabs retain their progressive latest-500 loader.
    if(!state.messages.length){
      await loadMoreHistory({initial:true});
    }

    // Full conversation needs the actual first message, so prepare its
    // complete history separately.
    if(state.filter === "all"){
      await ensureFullChatHistory();
      if(state.filter === "all") render();
    }else{
      render();
    }
  },0);
}

async function requestHistoryPage(roomId, cursorEnd, limit){
  return frommApiJson(
    `/v2/chat/message/${encodeURIComponent(roomId)}/messages`,
    {
      findStartAt:"2000-01-01T00:00:00.000Z",
      findEndAt:cursorEnd.toISOString(),
      limit:String(limit)
    }
  );
}

async function loadMoreHistory({initial=false, forceAll=false}={}){
  if(!state.room || state.loadingMessages || !state.hasMoreMessages) return 0;

  const generation = state.scanGeneration;
  const roomId = String(state.room.hostChatRoomId);
  const target = forceAll ? Number.POSITIVE_INFINITY : state.pageTarget;

  state.loadingMessages = true;
  $("#scanBtn").disabled = true;
  syncLoadingUI();
  updateHistoryStatus(initial ? "처음 500개 불러오는 중" : "과거 기록 더 불러오는 중");

  let addedTotal = 0;
  let safety = 0;

  try{
    while(state.hasMoreMessages && addedTotal < target){
      if(generation !== state.scanGeneration) return addedTotal;
      safety++;
      if(safety > 10000) throw new Error("페이지 안전 제한에 도달했습니다.");

      let data;
      try{
        data = await requestHistoryPage(roomId, state.cursorEnd, state.pageRequestLimit);
      }catch(e){
        // If 500 is rejected by Fromm, use 100 from then on.
        if(state.pageRequestLimit > 100){
          state.pageRequestLimit = 100;
          data = await requestHistoryPage(roomId, state.cursorEnd, 100);
        }else{
          throw e;
        }
      }

      if(generation !== state.scanGeneration) return addedTotal;

      const batch = data?.data?.messages || [];
      if(!batch.length){
        state.hasMoreMessages = false;
        break;
      }

      for(const msg of batch){
        const key = String(msg.messageId || `${msg.createdAt}|${msg.type}|${msg.content}`);
        if(!state.seenMessageKeys.has(key)){
          state.seenMessageKeys.add(key);
          state.messages.push(msg);
          addedTotal++;
        }
      }

      const dated = batch
        .filter(msg=>msg.createdAt)
        .sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));

      if(!dated.length){
        state.hasMoreMessages = false;
        break;
      }

      const nextCursor = new Date(new Date(dated[0].createdAt).getTime()-1);

      if(!Number.isFinite(nextCursor.getTime()) || nextCursor >= state.cursorEnd){
        state.hasMoreMessages = false;
        break;
      }

      state.cursorEnd = nextCursor;

      // A logical page is 500 new messages. If Fromm silently caps at 100,
      // this loop simply performs up to five small requests.
      if(!forceAll && addedTotal >= state.pageTarget) break;
    }

    if(generation !== state.scanGeneration) return addedTotal;

    // Keep the backing data deterministic.
    state.messages.sort((a,b)=>compareMessages(a,b,"asc"));
    buildMediaSequences();
    saveRoomCache();
    renderCountsOnly();
    updateHistoryStatus();

    return addedTotal;
  }catch(e){
    if(generation === state.scanGeneration){
      $("#scanState").textContent = "불러오기 실패";
      alert(e.message);
    }
    return addedTotal;
  }finally{
    if(generation === state.scanGeneration){
      state.loadingMessages = false;
      $("#scanBtn").disabled = false;
      updateHistoryStatus();
      syncLoadingUI();
    }
  }
}

function buildMediaSequences(){
  state.mediaSequence.clear();

  const source = state.chatHistoryComplete && state.chatMessages.length
    ? state.chatMessages
    : state.messages;

  const perDay = new Map();

  const sorted = [...source].sort((a,b)=>compareMessages(a,b,"asc"));

  for(const m of sorted){
    if(!isArtist(m) || !isMedia(m)) continue;

    const day = dateKey(m);
    const n = (perDay.get(day) || 0) + 1;
    perDay.set(day,n);

    state.mediaSequence.set(String(m.messageId), `${day}_${n}`);
  }
}

function looksLikeIdOnly(s){
  const v = String(s || "").trim();
  return /^[0-9a-f]{8}-[0-9a-f-]{20,}$/i.test(v) || /^[A-Za-z0-9_-]{24,}$/.test(v);
}

function normalizeQuotedValue(value){
  if(value == null) return null;

  if(typeof value === "string"){
    const raw = value.trim();
    if(!raw) return null;

    if((raw.startsWith("{") && raw.endsWith("}")) ||
       (raw.startsWith("[") && raw.endsWith("]"))){
      try{
        return normalizeQuotedValue(JSON.parse(raw));
      }catch{}
    }

    if(looksLikeIdOnly(raw)){
      return {messageId:raw, content:"", type:"text"};
    }

    return {messageId:"", content:raw, type:"text"};
  }

  if(typeof value !== "object") return null;

  // Some API models wrap the quoted message one level deeper.
  for(const nestedKey of ["message","mentionedMessage","embeddedMentionedMessage","data"]){
    if(value[nestedKey] && value[nestedKey] !== value){
      const nested = normalizeQuotedValue(value[nestedKey]);
      if(nested && (nested.content || nested.messageId)) return nested;
    }
  }

  const messageId = String(
    value.messageId ??
    value.id ??
    value.starChatId ??
    value.chatMessageId ??
    ""
  );

  const type = normType(
    value.type ??
    value.messageType ??
    value.contentType ??
    "text"
  );

  const content = String(
    value.content ??
    value.mentionedContent ??
    value.message ??
    value.text ??
    value.translatedMessage ??
    ""
  );

  if(!messageId && !content) return null;
  return {messageId,content,type};
}

function getQuotedMessage(m){
  const candidates = [
    m?.embeddedMentionedMessage,
    m?.mentionedMessage,
    m?.mentionDetailMessage,
    m?.mentionedContent,
    m?.replyMessage,
    m?.embeddedReplyMessage,
    m?.quotedMessage
  ];

  for(const candidate of candidates){
    const q = normalizeQuotedValue(candidate);
    if(q && (q.content || q.messageId)) return q;
  }

  // Some builds expose mention detail as a nested object.
  if(m?.mentionDetail){
    const q = normalizeQuotedValue(m.mentionDetail);
    if(q && (q.content || q.messageId)) return q;
  }

  return null;
}

function quotedPreview(q){
  if(!q) return "";
  if(q.content) return q.content;

  const t = normType(q.type);
  if(t==="image") return "[사진]";
  if(t==="video") return "[영상]";
  if(t==="sound") return "[음성]";
  return "[원문]";
}

function escapeRegExp(s){
  return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function chatMessageMatches(m, query){
  const q = String(query || "").trim().toLocaleLowerCase();
  if(!q) return true;

  // Search only human-readable chat text, not media CDN URLs.
  const t = normType(m.type);
  if(t !== "text") return false;

  const quoted = getQuotedMessage(m);

  const fields = [
    m.content,
    m.translatedMessage,
    quoted?.content,
    typeof m.emoticon === "string" && !isHttpMediaUrl(m.emoticon) ? m.emoticon : ""
  ].filter(Boolean).map(v=>String(v).toLocaleLowerCase());

  return fields.some(v=>v.includes(q));
}

function highlightText(text, query){
  const raw = String(text ?? "");
  const q = String(query || "").trim();

  if(!q) return esc(raw);

  const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
  const parts = raw.split(re);

  return parts.map(part=>{
    if(part.toLocaleLowerCase() === q.toLocaleLowerCase()){
      return `<mark>${esc(part)}</mark>`;
    }
    return esc(part);
  }).join("");
}

function updateChatSearchCount(){
  const tools = $("#chatTools");
  const count = $("#chatSearchCount");
  if(!tools || !count) return;

  const isAll = state.filter === "all";
  tools.style.display = isAll ? "flex" : "none";

  if(!isAll){
    count.textContent = "";
    closeChatToolsPanel();
    return;
  }

  const q = state.chatQuery.trim();
  if(!q){
    count.textContent = "";
    return;
  }

  const n = state.chatMessages.filter(m=>chatMessageMatches(m,q)).length;
  count.textContent = `${n.toLocaleString()}개`;
}

function filteredMessages(){
  if(state.filter==="all"){
    const q = state.chatQuery.trim();

    const source = state.chatMessages.filter(m=>{
      if(normType(m.type) !== "text") return true;

      const s = specialTextState(m);
      return !s || s.kind !== "hidden-empty";
    });

    const list = q
      ? source.filter(m=>chatMessageMatches(m,q))
      : source;

    // TRUE chronological order: first-ever message -> latest message.
    return [...list].sort((a,b)=>compareMessages(a,b,"asc"));
  }

  let list;
  if(state.filter==="media"){
    list = state.messages.filter(m=>isArtist(m) && isMedia(m));
  }else{
    list = state.messages.filter(
      m=>isArtist(m) && normType(m.type)===state.filter
    );
  }

  return [...list].sort((a,b)=>compareMessages(a,b,state.sortDirection));
}

function disconnectInfiniteObserver(){
  state.infiniteVersion++;

  if(state.infiniteObserver){
    state.infiniteObserver.disconnect();
    state.infiniteObserver = null;
  }

  if(state.chatRenderObserver){
    state.chatRenderObserver.disconnect();
    state.chatRenderObserver = null;
  }

  document.querySelectorAll(".infinite-sentinel,.chat-render-sentinel").forEach(el=>el.remove());
}

function appendChatBatch(chunkCount=1, version=state.infiniteVersion){
  if(version !== state.infiniteVersion) return;
  if(state.filter !== "all") return;

  const list = state.infiniteList || [];
  const tl = $("#timeline");

  for(let batchNo=0;batchNo<chunkCount;batchNo++){
    if(state.infiniteRendered >= list.length) break;

    const start = state.infiniteRendered;
    const end = Math.min(start + state.chunkSize,list.length);
    const frag = document.createDocumentFragment();

    for(let i=start;i<end;i++){
      const m = list[i];
      const dk = dateKey(m);

      if(dk !== state.infiniteLastDate){
        const sep = document.createElement("div");
        sep.className = "date-sep";
        sep.dataset.date = dk;
        sep.id = `chat-date-${dk}`;
        sep.textContent = dk;
        frag.appendChild(sep);
        state.infiniteLastDate = dk;
      }

      frag.appendChild(renderMessage(m));
    }

    tl.appendChild(frag);
    state.infiniteRendered = end;
  }
}

function armChatRenderObserver(version=state.infiniteVersion){
  if(version !== state.infiniteVersion) return;
  if(state.filter !== "all") return;
  if(state.infiniteRendered >= state.infiniteList.length) return;

  if(state.chatRenderObserver){
    state.chatRenderObserver.disconnect();
    state.chatRenderObserver = null;
  }

  document.querySelectorAll(".chat-render-sentinel").forEach(el=>el.remove());

  const tl = $("#timeline");
  const sentinel = document.createElement("div");
  sentinel.className = "chat-render-sentinel";
  sentinel.style.cssText = "height:8px;width:100%;";
  tl.appendChild(sentinel);

  state.chatRenderObserver = new IntersectionObserver(entries=>{
    if(version !== state.infiniteVersion) return;
    if(!entries.some(x=>x.isIntersecting)) return;

    if(state.chatRenderObserver){
      state.chatRenderObserver.disconnect();
      state.chatRenderObserver = null;
    }

    sentinel.remove();

    appendChatBatch(2,version);
    armChatRenderObserver(version);
  },{
    root:null,
    rootMargin:"2600px 0px",
    threshold:0
  });

  state.chatRenderObserver.observe(sentinel);
}

function renderFullConversation(version){
  if(version !== state.infiniteVersion) return;

  const tl = $("#timeline");
  tl.className = "timeline";
  tl.innerHTML = "";

  if(!state.room){
    tl.innerHTML = `<div class="empty artist-select-prompt">아티스트를 선택해주세요.</div>`;
    document.querySelector(".toolbar")?.classList.remove("is-loading");
    syncLoadingUI();
    return;
  }

  if(state.chatHistoryLoading || !state.chatHistoryComplete){
    const progress = state.chatHistoryProgress
      ? ` ${state.chatHistoryProgress.toLocaleString()}개 확인 중`
      : "";

    tl.innerHTML = `<div class="empty">${loadingEmptyHtml(`가장 오래된 메시지를 찾는 중...${progress}`)}</div>`;
    syncLoadingUI();
    return;
  }

  const list = state.infiniteList || [];

  if(!list.length){
    tl.innerHTML = `<div class="empty">${
      state.chatQuery.trim() ? "검색 결과가 없습니다." : "대화가 없습니다."
    }</div>`;
    return;
  }

  state.infiniteRendered = 0;
  state.infiniteLastDate = "";

  // IMPORTANT: starts at the actual first-ever message, at the top.
  appendChatBatch(2,version);
  armChatRenderObserver(version);

  if(state.chatAutoTopPending){
    state.chatAutoTopPending = false;

    requestAnimationFrame(()=>{
      window.scrollTo({top:0,behavior:"auto"});
    });
  }
}

function render(){
  renderCountsOnly();
  updateChatSearchCount();
  syncLoadingUI();

  const list = filteredMessages();
  const tl = $("#timeline");

  disconnectInfiniteObserver();
  const version = state.infiniteVersion;

  state.infiniteList = list;
  state.infiniteRendered = 0;
  state.infiniteLastDate = "";
  state.prefetching.clear();

  if(state.filter === "all"){
    renderFullConversation(version);
    return;
  }

  tl.innerHTML = "";
  tl.className = "gallery";

  if(!list.length){
    tl.innerHTML = `<div class="empty" style="grid-column:1/-1">${
      state.loadingMessages
        ? loadingEmptyHtml("파일 불러오는 중...")
        : (state.messages.length
            ? "이 구간에는 표시할 항목이 없습니다. 아래로 내리면 과거 기록을 더 불러옵니다."
            : "아직 불러온 메시지가 없습니다.")
    }</div>`;

    armInfiniteObserver(version);
    return;
  }

  appendInfiniteBatch(2,version);
  armInfiniteObserver(version);
  prefetchMediaRange(state.infiniteRendered);
}

function appendInfiniteBatch(chunkCount=1, version=state.infiniteVersion){
  if(version !== state.infiniteVersion) return;
  if(state.filter === "all") return;

  const list = state.infiniteList || [];
  const tl = $("#timeline");
  tl.className = "gallery";

  const oldEmpty = tl.querySelector(":scope > .empty");
  if(oldEmpty && list.length) oldEmpty.remove();

  for(let batchNo=0;batchNo<chunkCount;batchNo++){
    if(state.infiniteRendered >= list.length) break;

    const start = state.infiniteRendered;
    const end = Math.min(start + state.chunkSize,list.length);
    const frag = document.createDocumentFragment();

    for(let i=start;i<end;i++){
      frag.appendChild(renderMediaCard(list[i]));
    }

    tl.appendChild(frag);
    state.infiniteRendered = end;
  }

  prefetchMediaRange(state.infiniteRendered);
}

function refreshInfiniteListAfterFetch(version){
  if(version !== state.infiniteVersion) return;
  if(state.filter === "all") return;

  const tl = $("#timeline");
  tl.className = "gallery";

  const nextList = filteredMessages();

  let prefixStable = nextList.length >= state.infiniteList.length;

  if(prefixStable){
    for(let i=0;i<state.infiniteList.length;i++){
      if(messageStableKey(nextList[i]) !== messageStableKey(state.infiniteList[i])){
        prefixStable = false;
        break;
      }
    }
  }

  if(!prefixStable){
    render();
    return;
  }

  state.infiniteList = nextList;
  appendInfiniteBatch(2,version);
}

function armInfiniteObserver(version=state.infiniteVersion){
  if(version !== state.infiniteVersion) return;
  if(state.filter === "all") return;

  const hasRenderedItemsWaiting =
    state.infiniteRendered < state.infiniteList.length;

  if(!hasRenderedItemsWaiting && !state.hasMoreMessages) return;

  if(state.infiniteObserver){
    state.infiniteObserver.disconnect();
    state.infiniteObserver = null;
  }

  document.querySelectorAll(".infinite-sentinel").forEach(el=>el.remove());

  const tl = $("#timeline");
  const sentinel = document.createElement("div");
  sentinel.className = "infinite-sentinel";
  sentinel.style.cssText = "height:12px;grid-column:1/-1;width:100%;";
  tl.appendChild(sentinel);

  state.infiniteObserver = new IntersectionObserver(async entries=>{
    if(version !== state.infiniteVersion) return;
    if(!entries.some(entry=>entry.isIntersecting)) return;

    if(state.infiniteObserver){
      state.infiniteObserver.disconnect();
      state.infiniteObserver = null;
    }

    sentinel.remove();

    if(state.infiniteRendered < state.infiniteList.length){
      appendInfiniteBatch(2,version);
    }

    if(state.infiniteRendered >= state.infiniteList.length &&
       state.hasMoreMessages &&
       !state.loadingMessages){

      await loadMoreHistory();
      if(version !== state.infiniteVersion) return;

      refreshInfiniteListAfterFetch(version);
    }

    armInfiniteObserver(version);
  },{
    root:null,
    rootMargin:"5000px 0px",
    threshold:0
  });

  state.infiniteObserver.observe(sentinel);
}
