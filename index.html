<!doctype html>
<!-- Fromm Viewer · seamless two-row fixed header -->
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Fromm Viewer</title>
<style>:root { --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --text: #f5f6f8; --muted: #9da6b5; --line: #2a303b; --accent: #ff5b73; --accent2: #ff8798; --ok: #69d59a; --warn: #ffcb6b; }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
.brand { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; line-height: 1.5; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 14px; }
label { display: block; color: var(--muted); font-size: 12px; margin: 10px 0px 6px; }
input, textarea { width: 100%; border: 1px solid var(--line); background: rgb(15, 18, 24); color: var(--text); border-radius: 10px; padding: 10px; }
textarea { height: 66px; resize: vertical; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { border: 0px; border-radius: 10px; padding: 9px 12px; background: rgb(42, 48, 59); color: var(--text); }
.btn.primary { background: var(--accent); font-weight: 700; }
.btn.good { background: rgb(36, 106, 73); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.rooms { display: flex; flex-direction: column; gap: 6px; }
.room { width: 100%; text-align: left; background: rgb(17, 21, 27); border: 1px solid var(--line); color: var(--text); border-radius: 11px; padding: 10px 11px; }
.room.active { border-color: var(--accent); background: rgb(34, 23, 28); }
.title { font-size: 24px; font-weight: 800; }
.status { color: var(--muted); font-size: 13px; margin-top: 5px; }
.pill { border: 1px solid var(--line); background: rgb(18, 22, 29); color: var(--muted); border-radius: 999px; padding: 7px 10px; }
.pill.active { background: rgb(42, 27, 33); color: rgb(255, 255, 255); border-color: var(--accent); }
.spacer { flex: 1 1 0%; }
.stats { color: var(--muted); font-size: 13px; }
.timeline { max-width: 880px; margin: 0px auto; display: flex; flex-direction: column; gap: 9px; }
.msg { display: flex; }
.msg.star { justify-content: flex-start; }
.msg.me { justify-content: flex-end; }
.bubble { max-width: min(76%, 680px); background: var(--panel2); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; overflow: hidden; }
.me .bubble { background: rgb(32, 41, 55); }
.meta { font-size: 11px; color: var(--muted); margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
.type { font-weight: 700; color: var(--accent2); }
.text { white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
.media-wrap { display: flex; flex-direction: column; gap: 8px; }
.media-wrap img, .media-wrap video { display: block; max-width: 100%; max-height: 560px; border-radius: 12px; background: rgb(9, 11, 15); }
.media-wrap audio { width: min(100%, 520px); }
.media-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.check { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
a.dl { color: rgb(255, 255, 255); text-decoration: none; background: rgb(48, 55, 68); padding: 7px 9px; border-radius: 8px; font-size: 12px; }
.date-sep { text-align: center; color: var(--muted); font-size: 12px; margin: 12px 0px 4px; }
.more { display: block; margin: 18px auto; background: rgb(37, 43, 53); color: rgb(255, 255, 255); border: 1px solid var(--line); padding: 9px 14px; border-radius: 10px; }
.empty { text-align: center; color: var(--muted); padding: 80px 20px; }
.progress { height: 5px; background: rgb(34, 39, 51); border-radius: 999px; overflow: hidden; margin-top: 10px; }
.progress > div { height: 100%; background: var(--accent); width: 0%; }
.notice { font-size: 12px; color: var(--warn); line-height: 1.5; margin-top: 8px; }
@media (max-width: 850px) {
.bubble { max-width: 92%; }
}
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; align-items: start; }
.media-card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; min-width: 0px; }
.media-card.selected { outline: 2px solid var(--accent); outline-offset: 1px; }
.thumb { position: relative; aspect-ratio: 4 / 3; background: rgb(9, 11, 15); overflow: hidden; }
.thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.audio-thumb { display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, rgb(23, 27, 34), rgb(37, 45, 57)); }
.audio-icon { font-size: 54px; opacity: 0.78; }
.card-badge { position: absolute; top: 11px; left: 11px; background: rgba(0, 0, 0, 0.72); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 8px; padding: 6px 9px; font-size: 12px; font-weight: 800; }
.card-download { position: absolute; top: 10px; right: 10px; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.68); color: rgb(255, 255, 255); text-decoration: none; font-size: 20px; border: 1px solid rgba(255, 255, 255, 0.08); }
.card-select { display: none; }
.card-body { padding: 13px 14px 15px; }
.card-title { font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-date { margin-top: 7px; color: var(--muted); font-size: 13px; }
.card-audio { padding: 10px 12px 0px; background: var(--panel); }
.card-audio audio { display: block; width: 100%; }
.sort-controls { display: flex; gap: 8px; align-items: center; }
.sort-btn { white-space: nowrap; background: rgb(32, 38, 48); border: 1px solid var(--line); }
.card-body { position: relative; min-height: 72px; padding-right: 104px; }
.card-footer-select { position: absolute; right: 12px; bottom: 12px; height: 34px; min-width: 74px; padding: 0px 10px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; background: rgb(16, 20, 27); border: 1px solid var(--line); border-radius: 10px; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; user-select: none; z-index: 2; transition: background 0.14s, border-color 0.14s, color 0.14s, transform 0.08s; }
.card-footer-select:hover { border-color: rgb(81, 91, 107); color: rgb(238, 241, 246); background: rgb(21, 27, 36); }
.card-footer-select:active { transform: translateY(1px); }
.card-select-input { position: absolute; opacity: 0; pointer-events: none; }
.card-select-box { width: 14px; height: 14px; flex: 0 0 14px; border: 1.5px solid rgb(174, 182, 195); border-radius: 4px; display: grid; place-items: center; background: rgb(246, 247, 249); transition: background 0.14s, border-color 0.14s; }
.card-select-box::after { content: ""; width: 7px; height: 4px; border-left: 2px solid transparent; border-bottom: 2px solid transparent; transform: rotate(-45deg) translateY(-1px); }
.media-card.selected .card-footer-select { border-color: var(--accent); background: rgb(40, 26, 32); color: rgb(255, 255, 255); }
.media-card.selected .card-select-box { border-color: var(--accent); background: var(--accent); }
.media-card.selected .card-select-box::after { border-left-color: rgb(255, 255, 255); border-bottom-color: rgb(255, 255, 255); }
.card-select-text::after { content: "선택"; }
.media-card.selected .card-select-text::after { content: "선택됨"; }
.audio-thumb { position: relative; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, rgb(23, 27, 34), rgb(37, 45, 57)); }
.audio-icon { font-size: 54px; opacity: 0.8; transform: translateY(-18px); }
.audio-player-overlay { position: absolute; left: 12px; right: 12px; bottom: 12px; }
.audio-player-overlay audio { display: block; width: 100%; height: 40px; }
.title-line { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.inline-status { margin-top: 0px; white-space: nowrap; }
.scroll-top { position: fixed; right: 22px; bottom: 24px; width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: rgba(30, 34, 43, 0.92); color: rgb(255, 255, 255); font-size: 24px; font-weight: 800; z-index: 80; box-shadow: rgba(0, 0, 0, 0.32) 0px 8px 24px; opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity 0.18s, transform 0.18s, background 0.18s; }
.scroll-top.visible { opacity: 1; pointer-events: auto; transform: translateY(0px); }
.scroll-top:hover { background: var(--accent); }
.media-card .thumb { content-visibility: auto; contain-intrinsic-size: 320px 240px; }
.media-card img { background: rgb(11, 14, 19); }
.auth-card { transition: padding 0.18s; }
.auth-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.auth-toggle { padding: 6px 8px; font-size: 12px; }
.auth-card.collapsed { padding: 12px 14px; }
.auth-card.collapsed #authFields { display: none; }
.auth-compact { margin-top: 9px; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.auth-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: rgba(105, 213, 154, 0.12) 0px 0px 0px 3px; }
.media-card .thumb img, .media-wrap img { cursor: zoom-in; }
.lightbox { position: fixed; inset: 0px; z-index: 1000; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.9); padding: 40px 56px 56px; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 95vw; max-height: 88vh; width: auto; height: auto; object-fit: contain; border-radius: 10px; box-shadow: rgba(0, 0, 0, 0.55) 0px 18px 60px; background: rgb(8, 10, 14); cursor: zoom-out; }
.lightbox-close { position: fixed; top: 16px; right: 22px; width: 44px; height: 44px; border: 0px; border-radius: 50%; background: rgba(255, 255, 255, 0.13); color: rgb(255, 255, 255); font-size: 31px; line-height: 1; cursor: pointer; }
.lightbox-caption { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: min(80vw, 900px); color: rgb(217, 222, 232); background: rgba(0, 0, 0, 0.48); border-radius: 999px; padding: 7px 12px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.infinite-sentinel { pointer-events: none; }
.msg { content-visibility: auto; contain-intrinsic-size: 80px; }
.thumb { background: linear-gradient(110deg, rgb(17, 21, 28) 8%, rgb(27, 32, 41) 18%, rgb(17, 21, 28) 33%) 0% 0% / 200% 100%; animation: 1.35s linear 0s infinite normal none running thumbShimmer; }
.thumb.media-ready { animation: auto ease 0s 1 normal none running none; background: rgb(9, 11, 15); }
.thumb img, .thumb video { opacity: 0; transition: opacity 0.18s; }
.thumb.media-ready img, .thumb.media-ready video { opacity: 1; }
@keyframes thumbShimmer { 
  100% { background-position-x: -200%; }
}
.selected-count { display: inline-flex; align-items: center; justify-content: center; min-width: 72px; padding: 7px 10px; border-radius: 999px; border: 1px solid var(--line); background: rgb(20, 25, 34); color: rgb(255, 255, 255); font-size: 13px; font-weight: 800; }
.selected-count.has-selection { border-color: var(--accent); background: rgb(42, 23, 29); color: rgb(255, 255, 255); }
.chat-search { display: flex; align-items: center; gap: 6px; min-width: 240px; max-width: 360px; height: 38px; padding: 0px 8px 0px 10px; border: 1px solid var(--line); background: rgb(16, 20, 27); border-radius: 10px; }
.chat-search input { flex: 1 1 0%; min-width: 0px; width: auto; border: 0px; outline: 0px; background: transparent; padding: 0px; color: var(--text); }
.chat-search input::placeholder { color: rgb(119, 129, 145); }
.chat-search-count { color: var(--muted); font-size: 12px; white-space: nowrap; }
.chat-search-clear { width: 24px; height: 24px; padding: 0px; border: 0px; border-radius: 50%; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; }
.chat-search-clear:hover { background: rgb(37, 43, 53); color: rgb(255, 255, 255); }
.text mark { background: rgb(255, 218, 99); color: rgb(17, 17, 17); border-radius: 3px; padding: 0px 1px; }
.reply-quote { margin: 2px 0px 9px; padding: 9px 11px; border-left: 3px solid var(--accent); border-radius: 10px; background: rgba(255, 255, 255, 0.055); cursor: pointer; transition: background 0.15s, border-color 0.15s; }
.reply-quote:hover { background: rgba(255, 255, 255, 0.086); }
.reply-label { color: var(--accent2); font-size: 12px; font-weight: 800; margin-bottom: 5px; }
.reply-content { color: rgb(196, 202, 212); font-size: 13px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.reply-media-label { color: rgb(170, 178, 191); font-size: 13px; }
.msg.reply-target-flash .bubble { outline: 2px solid var(--accent); box-shadow: rgba(255, 91, 115, 0.12) 0px 0px 0px 6px; }
.audio-error-note { position: absolute; left: 12px; right: 12px; bottom: 58px; display: none; padding: 6px 8px; border-radius: 8px; background: rgba(0, 0, 0, 0.74); color: rgb(241, 197, 106); font-size: 11px; text-align: center; z-index: 3; }
.audio-thumb.audio-failed .audio-error-note { display: block; }
.infinite-sentinel::after { content: ""; display: block; width: 22px; height: 22px; margin: 10px auto 4px; border-radius: 50%; border-width: 2px; border-style: solid; border-right-color: rgba(255, 255, 255, 0.15); border-bottom-color: rgba(255, 255, 255, 0.15); border-left-color: rgba(255, 255, 255, 0.15); border-image: none; border-top-color: var(--accent); animation: 0.8s linear 0s infinite normal none running sentinelSpin; opacity: 0.65; }
@keyframes sentinelSpin { 
  100% { transform: rotate(360deg); }
}
.media-missing { color: rgb(157, 166, 181); font-size: 13px; font-style: italic; }
.media-card-unavailable { opacity: 0.65; }
.media-unavailable-note { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); padding: 6px 9px; border-radius: 8px; background: rgba(0, 0, 0, 0.72); color: rgb(214, 173, 88); font-size: 12px; white-space: nowrap; }
.media-card-unavailable { opacity: 0.78; }
.media-card-unavailable .thumb { filter: saturate(0.6); }
.gallery { width: 100%; max-width: none; margin: 0px; grid-template-columns: repeat(4, minmax(0px, 1fr)); }
@media (max-width: 1350px) {
.gallery { grid-template-columns: repeat(3, minmax(0px, 1fr)); }
}
@media (max-width: 1050px) {
.gallery { grid-template-columns: repeat(2, minmax(0px, 1fr)); }
}
@media (max-width: 700px) {
.gallery { grid-template-columns: 1fr; }
}
.auth-actions { display: flex; align-items: center; gap: 6px; }
.auth-save-note { margin-top: 6px; color: var(--muted); font-size: 11px; line-height: 1.35; }
.danger-lite { color: rgb(215, 168, 174); }
.danger-lite:hover { color: rgb(255, 255, 255); border-color: rgb(130, 65, 77); }
.date-jump { display: flex; align-items: center; gap: 6px; }
.date-jump input[type="date"] { height: 38px; padding: 0px 9px; border: 1px solid var(--line); border-radius: 10px; background: rgb(16, 20, 27); color: var(--text); color-scheme: dark; }
.date-jump .btn { height: 38px; padding: 0px 11px; white-space: nowrap; }
.msg.date-target-flash .bubble { animation: 1.15s cubic-bezier(0.22, 0.8, 0.32, 1) 0s 1 normal both running date-focus-rose; }
@keyframes date-focus-rose { 
  0% { transform: translateY(0px) scale(1); box-shadow: rgba(255, 91, 115, 0) 0px 0px 0px 0px; filter: brightness(1); }
  18% { transform: translateY(-1px) scale(1.012); box-shadow: rgba(255, 91, 115, 0.48) 0px 0px 0px 1px, rgba(255, 91, 115, 0.1) 0px 0px 0px 7px, rgba(255, 91, 115, 0.1) 0px 8px 24px; filter: brightness(1.07); }
  55% { transform: translateY(0px) scale(1.004); box-shadow: rgba(255, 91, 115, 0.24) 0px 0px 0px 1px, rgba(255, 91, 115, 0.055) 0px 0px 0px 4px, rgba(255, 91, 115, 0.055) 0px 5px 16px; filter: brightness(1.035); }
  100% { transform: translateY(0px) scale(1); box-shadow: rgba(255, 91, 115, 0) 0px 0px 0px 0px; filter: brightness(1); }
}
.chat-tools { position: relative; display: flex; align-items: center; flex: 0 0 auto; }
.chat-tools-btn { width: 38px; height: 38px; padding: 0px; border: 1px solid var(--line); border-radius: 10px; background: rgb(21, 26, 34); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.chat-tools-btn:hover, .chat-tools-btn.active { border-color: var(--accent); background: rgb(36, 23, 28); }
.magnifier-icon { position: relative; display: block; width: 15px; height: 15px; border: 2px solid; border-radius: 50%; }
.magnifier-icon::after { content: ""; position: absolute; width: 7px; height: 2px; background: currentcolor; right: -6px; bottom: -3px; transform: rotate(45deg); transform-origin: left center; border-radius: 2px; }
.chat-tools-panel { position: absolute; right: 0px; top: 46px; z-index: 150; display: none; width: min(390px, -36px + 100vw); padding: 13px; border: 1px solid var(--line); border-radius: 13px; background: rgb(17, 22, 30); box-shadow: rgba(0, 0, 0, 0.45) 0px 18px 48px; }
.chat-tools-panel.open { display: block; }
.chat-tools-title { margin-bottom: 12px; font-size: 14px; font-weight: 800; }
.chat-tools-label { margin: 0px 0px 6px; color: var(--muted); font-size: 12px; font-weight: 700; }
.chat-tools-row { display: flex; align-items: center; gap: 7px; }
.chat-tools-row input[type="search"], .chat-tools-row input[type="date"] { flex: 1 1 0%; min-width: 0px; width: auto; height: 38px; padding: 0px 10px; border: 1px solid var(--line); border-radius: 9px; outline: none; background: rgb(13, 17, 23); color: var(--text); }
.chat-tools-row input[type="date"] { color-scheme: dark; }
.chat-tools-row input:focus { border-color: var(--accent); }
.chat-tools-divider { height: 1px; margin: 12px 0px; background: var(--line); }
.chat-tools-panel .btn { height: 38px; padding: 0px 12px; white-space: nowrap; }
.chat-tools-panel .chat-search-count { white-space: nowrap; }
.chat-tools-panel .chat-search-clear { flex: 0 0 auto; }
.chat-history-loading { width: 100%; padding: 10px 0px; text-align: center; color: var(--muted); font-size: 12px; }
.date-picker-row { position: relative; }
.date-picker-btn { flex: 1 1 0%; min-width: 0px; height: 38px; padding: 0px 11px; border: 1px solid var(--line); border-radius: 9px; background: rgb(13, 17, 23); color: var(--text); display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; font: inherit; }
.date-picker-btn:hover, .date-picker-btn.active { border-color: var(--accent); }
.date-picker-calendar-icon { position: relative; width: 15px; height: 14px; border: 1.5px solid; border-radius: 3px; opacity: 0.85; }
.date-picker-calendar-icon::before { content: ""; position: absolute; left: 2px; right: 2px; top: 3px; border-top: 1.5px solid; }
.date-picker-calendar-icon::after { content: ""; position: absolute; width: 7px; height: 2px; left: 3px; top: -3px; border-left: 1.5px solid; border-right: 1.5px solid; }
.date-calendar { display: none; margin-top: 9px; padding: 10px; border: 1px solid var(--line); border-radius: 11px; background: rgb(12, 17, 24); }
.date-calendar.open { display: block; }
.date-calendar-head { display: grid; grid-template-columns: 34px 1fr 34px; align-items: center; gap: 5px; margin-bottom: 7px; }
.date-calendar-title { text-align: center; font-size: 13px; font-weight: 800; }
.date-nav-btn { width: 32px; height: 30px; border: 0px; border-radius: 7px; background: transparent; color: var(--text); font-size: 22px; cursor: pointer; }
.date-nav-btn:hover { background: rgb(27, 34, 45); }
.date-weekdays, .date-calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.date-weekdays { margin-bottom: 3px; }
.date-weekdays span { padding: 4px 0px; text-align: center; color: var(--muted); font-size: 11px; }
.date-day { position: relative; height: 34px; padding: 0px 0px 5px; border: 0px; border-radius: 8px; background: transparent; color: var(--text); cursor: pointer; font-size: 12px; }
.date-day:hover { background: rgb(27, 34, 45); }
.date-day.outside { color: rgb(88, 97, 112); }
.date-day.selected { background: rgb(40, 77, 117); color: rgb(255, 255, 255); }
.date-day.today { outline: rgb(89, 101, 121) solid 1px; }
.date-day.has-chat::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 4px; height: 4px; border-radius: 50%; background: rgb(74, 163, 255); transform: translateX(-50%); }
.date-day.selected.has-chat::after { background: rgb(159, 208, 255); }
.date-calendar-foot { display: flex; justify-content: flex-end; margin-top: 7px; }
.date-calendar-link { border: 0px; background: transparent; color: rgb(103, 173, 255); cursor: pointer; font-size: 12px; }
.date-calendar-link:hover { text-decoration: underline; }
.msg { scroll-margin-top: 92px; }
.date-sep { scroll-margin-top: 110px; }
.date-sep.date-jump-start { color: rgb(200, 221, 255); }
.bubble.emoticon-only { background: transparent; border-color: transparent; box-shadow: none; padding: 4px 0px; }
.bubble.emoticon-only .meta { margin: 0px 0px 5px 4px; }
.emoticon-wrap { display: flex; align-items: center; justify-content: flex-start; min-width: 72px; min-height: 72px; }
.emoticon-img { display: block; width: auto; height: auto; max-width: 160px; max-height: 160px; object-fit: contain; cursor: zoom-in; filter: none; }
.emoticon-unavailable { max-width: 220px; padding: 8px 10px; border-radius: 9px; border: 1px dashed var(--line); background: rgb(21, 26, 34); color: rgb(155, 165, 180); font-size: 12px; line-height: 1.4; }
.empty-text-note { color: rgb(119, 129, 145); font-size: 12px; font-style: italic; }
.sidebar-toggle-btn span { display: block; width: 22px; height: 2.5px; border-radius: 2px; background: rgb(231, 235, 242); transform-origin: center center; transition: transform 0.22s, opacity 0.16s; }
.sidebar-toggle-btn.active span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
.sidebar-toggle-btn.active span:nth-child(2) { opacity: 0; transform: scaleX(0.45); }
.sidebar-toggle-btn.active span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }

<body>

<div id="loginGate" class="login-gate" aria-hidden="false">
  <div class="login-panel">
    <div class="login-brand">Fromm Viewer</div>
    <div class="login-subtitle">Fromm 계정으로 로그인</div>

    <label for="loginEmail">이메일</label>

           placeholder="Fromm 가입 이메일" />

    <input id="loginPassword" type="password" autocomplete="current-password"
           placeholder="Fromm 비밀번호" />

      고급 옵션
    </button>

    <div id="authAdvanced" class="auth-advanced" style="display:none">
      <label for="loginDeviceId">Device ID (비워두면 자동 생성)</label>
      <input id="loginDeviceId" type="text" placeholder="자동 생성" />
    </div>

    <div id="loginStatus" class="login-status">먼저 이메일을 확인해주세요.</div>

    <div class="login-actions">
      <button class="btn" id="checkEmailBtn" type="button">이메일 확인</button>
      <button class="btn primary" id="loginBtn" type="button" disabled>로그인</button>
    </div>

    <div class="auth-save-note login-privacy-note">
      로그인 성공 시 토큰과 Device ID만 이 브라우저에 저장합니다. 비밀번호는 저장하지 않습니다.
    </div>
  </div>
</div>




<div id="sidebarBackdrop" class="sidebar-backdrop"></div>

<div class="app">


  <main class="main">
    <header class="viewer-header">
    <div class="topbar">
<button id="sidebarToggleBtn" class="sidebar-toggle-btn" type="button"

  <span></span><span></span><span></span>
</button>
      <div class="title-line">

    </div>

    </header>

    <div id="timeline" class="timeline">

<button id="scrollTopBtn" class="scroll-top" title="맨 위로" aria-label="맨 위로">↑</button>

</div>

function isHttpMediaUrl(value){
  if(typeof value !== "string") return false;
  let s = value.trim();
  if(!s) return false;

  if(s.startsWith("//")) s = "https:" + s;

  try{
    const u = new URL(s);
    return u.protocol === "https:" || u.protocol === "http:";
  }catch{
    return false;
  }
}

function normalizeMediaUrl(value){
  if(typeof value !== "string") return "";
  let s = value.trim();
  if(!s) return "";
  if(s.startsWith("//")) s = "https:" + s;
  return isHttpMediaUrl(s) ? s : "";
}

function resolveMediaUrl(m){
  if(!m || typeof m !== "object") return "";

  const t = normType(m.type);

  // Normal/current message shapes first.
  const directKeys = [
    "content","url","mediaUrl","mediaURL","fileUrl","fileURL",
    "audioUrl","audioURL","soundUrl","soundURL",
    "videoUrl","videoURL","imageUrl","imageURL",
    "originalUrl","originalURL","downloadUrl","downloadURL",
    "resourceUrl","resourceURL","sourceUrl","sourceURL"
  ];

  for(const key of directKeys){
    const v = m[key];

    if(typeof v === "string"){
      const direct = normalizeMediaUrl(v);
      if(direct) return direct;

      const raw = v.trim();
      if((raw.startsWith("{") && raw.endsWith("}")) ||
         (raw.startsWith("[") && raw.endsWith("]"))){
        try{
          const found = findMediaUrlDeep(JSON.parse(raw), 0);
          if(found) return found;
        }catch{}
      }
    }else if(v && typeof v === "object"){
      const found = findMediaUrlDeep(v, 0);
      if(found) return found;
    }
  }

  // Legacy Fromm sound messages:
  // the API can return content:"" while thumbnail contains the actual audio URL.
  // Do this ONLY for sound; video/image thumbnails are preview images.
  if(t === "sound"){
    const legacyAudio = normalizeMediaUrl(m.thumbnail || "");
    if(legacyAudio) return legacyAudio;
  }

  const nestedKeys = [
    "media","file","resource","attachment","attachments",
    "audio","sound","video","image","asset","source"
  ];

  for(const key of nestedKeys){
    if(m[key]){
      const found = findMediaUrlDeep(m[key], 0);
      if(found) return found;
    }
  }

  return "";
}

function findMediaUrlDeep(value, depth=0){
  if(depth > 4 || value == null) return "";

  if(typeof value === "string"){
    const direct = normalizeMediaUrl(value);
    if(direct) return direct;

    const raw = value.trim();
    if((raw.startsWith("{") && raw.endsWith("}")) ||
       (raw.startsWith("[") && raw.endsWith("]"))){
      try{
        return findMediaUrlDeep(JSON.parse(raw), depth+1);
      }catch{}
    }
    return "";
  }

  if(Array.isArray(value)){
    for(const item of value){
      const found = findMediaUrlDeep(item, depth+1);
      if(found) return found;
    }
    return "";
  }

  if(typeof value === "object"){
    // Prefer URL-ish keys over arbitrary nested strings.
    const priority = [
      "url","mediaUrl","fileUrl","audioUrl","soundUrl","videoUrl","imageUrl",
      "originalUrl","downloadUrl","resourceUrl","sourceUrl",
      "thumbnail","thumbnailUrl","thumb","thumbUrl","poster","posterUrl",
      "preview","previewUrl","previewImage","previewImageUrl","content"
    ];

    for(const key of priority){
      if(key in value){
        const found = findMediaUrlDeep(value[key], depth+1);
        if(found) return found;
      }
    }

    for(const [key,val] of Object.entries(value)){
      if(/url|media|file|audio|sound|video|image|resource|source|asset|thumb|poster|preview/i.test(key)){
        const found = findMediaUrlDeep(val, depth+1);
        if(found) return found;
      }
    }
  }

  return "";
}

function resolveEmoticonUrl(m){
  if(!m || typeof m !== "object") return "";

  const candidates = [
    m.emoticon,
    m.emoticonUrl,

    m.sticker,
    m.stickerUrl,
    m.stickerURL,
    m.emoji,
    m.emojiUrl,
    m.emojiURL
  ];

  for(const candidate of candidates){
    if(candidate == null) continue;

    if(typeof candidate === "string"){
      const direct = normalizeMediaUrl(candidate);
      if(direct) return direct;

      const raw = candidate.trim();
      if((raw.startsWith("{") && raw.endsWith("}")) ||
         (raw.startsWith("[") && raw.endsWith("]"))){
        try{
          const found = findMediaUrlDeep(JSON.parse(raw),0);
          if(found) return found;
        }catch{}
      }
    }else if(typeof candidate === "object"){
      const found = findMediaUrlDeep(candidate,0);
      if(found) return found;
    }
  }

  // Some historical text-emoticon payloads expose the image through thumbnail.
  if(normType(m.type) === "text" &&
     !String(m.content || "").trim() &&
     m.emoticon){
    const thumb = normalizeMediaUrl(m.thumbnail || "");
    if(thumb) return thumb;
  }

  return "";
}

function compareMessages(a,b,direction="asc"){
  const ta = new Date(a?.createdAt).getTime() || 0;
  const tb = new Date(b?.createdAt).getTime() || 0;

  if(ta !== tb){
    return direction === "asc" ? (ta - tb) : (tb - ta);
  }

  // Same timestamp: deterministic tie-breaker so cards do not reshuffle.
  const ka = messageStableKey(a);
  const kb = messageStableKey(b);
  const cmp = ka.localeCompare(kb);
  return direction === "asc" ? cmp : -cmp;
}

function contentTypeExt(ct,t){
  ct = String(ct||"").split(";")[0].trim().toLowerCase();

    "image/jpeg":".jpg","image/png":".png","image/webp":".webp","image/gif":".gif","image/heic":".heic",
    "video/mp4":".mp4","video/quicktime":".mov","video/webm":".webm",

function resolvePreviewUrl(m){

    m.file?.thumbnail, m.file?.poster, m.file?.preview,

    const item = previewQueue.shift();

function prefetchMediaRange(startIndex){
  previewQueue = previewQueue.filter(item=>item.version === state.infiniteVersion);
  const list = state.infiniteList || [];
  for(let i=startIndex;i<Math.min(startIndex+state.prefetchAhead,list.length);i++){
    const m=list[i], t=normType(m?.type);
    if(t!=="image" && t!=="video") continue;
    const url=resolvePreviewUrl(m);
    // A missing thumbnail must never turn speculative prefetch into an original download.
    if(!url || imageUrlSame(url,resolveMediaUrl(m))) continue;
    if(state.prefetching.has(url)) continue;
    state.prefetching.add(url);
    previewQueue.push({url,version:state.infiniteVersion});
  }
  drainPreviewQueue();
}

async function frommApiJson(path, query=null){
  const auth = currentAuth();

  if(!auth.token || !auth.uuid){
    throw new Error("토큰과 Device ID를 먼저 연결해주세요.");
  }

  const url = new URL(path, FROMM_API_BASE);

  if(query){
    for(const [key,value] of Object.entries(query)){
      if(value !== undefined && value !== null && value !== ""){
        url.searchParams.set(key,String(value));
      }
    }
  }

  let r;
  try{
    r = await fetch(url.toString(),{
      method:"GET",
      headers:{
        "Authorization":auth.token,
        "uuid":auth.uuid,
        "Accept":"application/json"
      },
      cache:"no-store"
    });
  }catch(e){
    throw friendlyNetworkError(e);
  }

  let data = null;
  const text = await r.text();

  if(text){
    try{
      data = JSON.parse(text);
    }catch{
      data = null;
    }
  }

  if(!r.ok){
    const detail =
      data?.error ||
      data?.message ||
      data?.detail ||
      text ||
      `HTTP ${r.status}`;

    throw new Error(`Fromm API HTTP ${r.status}: ${String(detail).slice(0,500)}`);
  }

  if(data?.ok === false){
    throw new Error(data?.error || data?.message || "Fromm API 요청 실패");
  }

  return data;
}

async function frommApiRequest(path,{method="GET",query=null,body=null,base=FROMM_API_BASE,channelId=""}={}){

  }

  const url = new URL(path, base);
  if(query){
    for(const [key,value] of Object.entries(query)){
      if(value !== undefined && value !== null && value !== ""){
        url.searchParams.set(key,String(value));
      }
    }

  const headers = {
    "Authorization":/^Bearer\s/i.test(auth.token) ? auth.token : `Bearer ${auth.token}`,
    "uuid":auth.uuid,
    "Accept":"application/json"
  };
  if(channelId) headers["channel-id"] = channelId;
  if(body !== null) headers["Content-Type"] = "application/json";

  let r;
  try{
    r = await fetch(url.toString(),{
      method,
      headers,
      body: body === null ? undefined : JSON.stringify(body),
      cache:"no-store"
    });
  }catch(e){
    throw friendlyNetworkError(e);
  }

  const text = await r.text();

    const error=new Error(`Fromm API 요청 실패: ${String(detail).slice(0,500)}`);

function deepFindObject(value,predicate,depth=0,seen=new Set()){
  if(depth > 9 || value == null || typeof value !== "object") return null;
  if(seen.has(value)) return null;
  seen.add(value);
  try{ if(predicate(value)) return value; }catch{}
  if(Array.isArray(value)){
    for(const item of value){
      const found = deepFindObject(item,predicate,depth+1,seen);
      if(found) return found;
    }
  }else{
    for(const item of Object.values(value)){
      const found = deepFindObject(item,predicate,depth+1,seen);
      if(found) return found;
    }
  }
  return null;
}

function deepFindValue(value,keyNames,depth=0,seen=new Set()){
  if(depth > 9 || value == null || typeof value !== "object") return undefined;
  if(seen.has(value)) return undefined;
  seen.add(value);
  const keys = new Set(keyNames.map(x=>String(x).toLowerCase()));
  if(!Array.isArray(value)){
    for(const [k,v] of Object.entries(value)){
      if(keys.has(String(k).toLowerCase()) && v !== undefined && v !== null && v !== "") return v;
    }
  }
  for(const item of (Array.isArray(value) ? value : Object.values(value))){
    const found = deepFindValue(item,keyNames,depth+1,seen);
    if(found !== undefined) return found;
  }
  return undefined;
}

function findAgoraToken(value,depth=0,seen=new Set()){
  if(depth > 9 || value == null) return "";
  if(typeof value === "string"){
    const v=value.trim();
    if(/^(006|007)[A-Za-z0-9+/=_-]{30,}$/.test(v)) return v;
    return "";
  }
  if(typeof value !== "object" || seen.has(value)) return "";
  seen.add(value);

  if(!Array.isArray(value)){
    const preferred=["agoraToken","token","rtcToken","accessToken"];
    for(const key of preferred){
      if(key in value){
        const t=findAgoraToken(value[key],depth+1,seen);
        if(t) return t;
      }
    }
  }
  for(const item of (Array.isArray(value) ? value : Object.values(value))){
    const t=findAgoraToken(item,depth+1,seen);
    if(t) return t;
  }
  return "";
}

function base64Bytes(input){
  let s=String(input||"").replace(/-/g,"+").replace(/_/g,"/");
  while(s.length % 4) s += "=";
  const bin=atob(s);
  const out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}

async function inflateAgoraToken(bytes){
  if(typeof DecompressionStream === "undefined"){
    throw new Error("이 브라우저는 Agora 토큰 분석에 필요한 압축 해제를 지원하지 않습니다.");
  }
  const ds=new DecompressionStream("deflate");
  const stream=new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

function agoraTokenReader(bytes){
  let p=0;
  const dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
  const td=new TextDecoder();
  const need=n=>{ if(p+n>bytes.length) throw new Error("Agora 토큰 형식이 예상과 다릅니다."); };
  return {
    u16(){ need(2); const v=dv.getUint16(p,true); p+=2; return v; },
    u32(){ need(4); const v=dv.getUint32(p,true); p+=4; return v; },
    raw(n){ need(n); const v=bytes.slice(p,p+n); p+=n; return v; },
    bytes(){ const n=this.u16(); return this.raw(n); },
    str(){ return td.decode(this.bytes()); },
    skipIntMap(){ const n=this.u16(); for(let i=0;i<n;i++){this.u16();this.u32();} },
    pos(){return p;}
  };
}

async function parseAgoraToken(token){
  token=String(token||"").trim();
  if(token.startsWith("006")){
    return {
      version:"006",
      appId:token.slice(3,35),
      channelName:"",
      uid:"",
      issueTs:0,
      expire:0
    };
  }
  if(!token.startsWith("007")) throw new Error("지원하지 않는 Agora 토큰 형식입니다.");

  const packed=base64Bytes(token.slice(3));
  const raw=await inflateAgoraToken(packed);
  const r=agoraTokenReader(raw);
  r.bytes(); // signature
  const appId=r.str();
  const issueTs=r.u32();
  const expire=r.u32();
  r.u32(); // salt
  const serviceCount=r.u16();
  let channelName="";
  let uid="";

  for(let i=0;i<serviceCount;i++){
    const type=r.u16();
    r.skipIntMap();
    if(type===1){
      const ch=r.str();
      const id=r.str();
      if(!channelName){ channelName=ch; uid=id; }
    }else if(type===2 || type===5){
      r.str();
    }else if(type===3 || type===6){
      const ch=r.str(); r.str();
      if(!channelName) channelName=ch;
    }else if(type===4){
      // no extra payload
    }else if(type===7){
      r.str(); r.str(); r.u16();
    }else if(type===8){
      // RTM2 is not required for video playback. Stop parsing unknown nested permissions safely.
      break;
    }else{
      break;
    }
  }
  return {version:"007",appId,channelName,uid,issueTs,expire};
}

function saltBytes(value){
  if(value == null || value === "") return null;
  if(value instanceof Uint8Array) return value.length===32 ? value : null;
  if(Array.isArray(value)){
    const a=new Uint8Array(value.map(v=>Number(v)&255));
    return a.length===32 ? a : null;
  }
  const s=String(value).trim();
  if(/^[0-9a-f]{64}$/i.test(s)){
    const a=new Uint8Array(32);
    for(let i=0;i<32;i++) a[i]=parseInt(s.slice(i*2,i*2+2),16);
    return a;
  }
  try{
    const a=base64Bytes(s);
    if(a.length===32) return a;
  }catch{}
  const text=new TextEncoder().encode(s);
  return text.length===32 ? text : null;
}

function liveEncryptionCandidates(room){
  if(!room?.encryptionKey || !room?.encryptionSalt){
    throw new Error("라이브 응답에 암호화 키 또는 salt가 없습니다.");
  }
  let salt;
  try{ salt=base64Bytes(room.encryptionSalt); }catch{}
  if(!salt || salt.length!==32) throw new Error("라이브 암호화 salt 형식이 올바르지 않습니다.");
  return [{mode:"aes-256-gcm2",key:String(room.encryptionKey),salt}];
}

function ensureAgoraRtcSdk(){
  if(window.AgoraRTC) return Promise.resolve(window.AgoraRTC);
  if(state.live.sdkPromise) return state.live.sdkPromise;
  state.live.sdkPromise=new Promise((resolve,reject)=>{
    const script=document.createElement("script");
    script.src=AGORA_WEB_SDK_URL;
    script.async=true;
    script.onload=()=>window.AgoraRTC ? resolve(window.AgoraRTC) : reject(new Error("Agora SDK를 불러오지 못했습니다."));
    script.onerror=()=>reject(new Error("Agora SDK 다운로드에 실패했습니다."));
    document.head.appendChild(script);
  }).catch(e=>{state.live.sdkPromise=null;throw e;});
  return state.live.sdkPromise;
}

function liveRoomTitle(){
  return String(
    deepFindValue(state.live.room,["title","liveTitle"]) ||
    `${liveArtistName()} LIVE`
  );
}

function liveStartedLabel(){
  const raw=deepFindValue(state.live.room,["startedAt","startAt","createdAt"]);
  if(raw == null || raw === "") return "";
  let d;
  if(typeof raw === "number") d=new Date(raw < 10_000_000_000 ? raw*1000 : raw);
  else d=new Date(raw);
  if(Number.isNaN(d.getTime())) return "";
  return d.toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
}

function liveStatusText(text,isError=false){
  const el=$("#liveConnectionStatus");
  if(el){
    el.textContent=text || "";
    el.classList.toggle("live-error",!!isError);
  }
  state.live.lastError=isError ? String(text||"") : "";
}

function syncHeaderLiveIndicator(){
  const btn=document.querySelector(".header-live-btn");
  if(!btn) return;
  const streaming=state.live.entrances.length>0 || !!state.live.config?.isStreaming;
  btn.classList.toggle("is-streaming",streaming);
  btn.title=streaming ? "시청 가능한 라이브 · 눌러서 목록 보기" : "현재 라이브 보기";
  btn.setAttribute("aria-label",streaming ? "라이브 중" : "라이브");
}

function syncLiveToolbarControls(){
  syncHeaderLiveIndicator();
  const live=state.filter==="live";
  const sort=$("#sortControls");
  if(sort) sort.style.display = (!live && state.filter!=="all") ? "flex" : "none";
  for(const id of ["selectedCount","selectAllBtn","saveSelectedBtn"]){
    const el=$("#"+id);
    if(el) el.style.display=live ? "none" : "";
  }
  const counts=$("#counts");
  if(counts && live){
    const isStreaming=!!state.live.config?.isStreaming;
    counts.textContent=isStreaming ? "LIVE" : state.live.entrances.length ? `방송 ${state.live.entrances.length}개` : "대기 중";
  }
}

function renderLiveView(){
  const tl=$("#timeline");
  if(!tl) return;
  disconnectInfiniteObserver();
  tl.className="timeline live-timeline";
  syncLiveToolbarControls();

  if(!state.room){
    tl.innerHTML=`<div class="live-shell"><div class="live-card"><div class="live-stage-empty"><div class="big">아티스트를 먼저 선택해줘</div><div class="small">왼쪽 메뉴에서 아티스트를 고른 다음 라이브 탭을 열면 현재 방송 목록을 자동으로 확인합니다.</div></div></div></div>`;
    return;
  }

  const streaming=!!state.live.config?.isStreaming;
  const loading=state.live.loading;
  const roomId=String(state.live.config?.liveRoomId || state.live.currentLiveRoomId || "");
  const title=streaming ? liveRoomTitle() : `${liveArtistName()} LIVE`;
  const started=streaming ? liveStartedLabel() : "";

  let stageHtml;
  if(!streaming){
    // No signal: keep the Live screen deliberately quiet so the user never
    // mistakes a background status check for an active broadcast.
    const message=state.live.status==="error" ? "연결을 확인해주세요" : !state.live.discoveryLoaded ? "현재 방송 확인 중..." : state.live.entrances.length ? "위 목록에서 시청할 방송을 선택해주세요" : "현재 시청 가능한 방송이 없습니다";
    stageHtml=`<div class="live-stage-empty"><div class="big">${esc(message)}</div></div>`;
  }else{
    stageHtml=`<div id="liveVideoGrid" class="live-video-grid"><div id="liveWaiting" class="live-stage-empty"><div class="live-spinner"></div><div class="big">방송 연결 중...</div><div class="small">영상 스트림을 기다리고 있습니다.</div></div></div>`;
  }

  const footerText=state.live.lastError || (streaming ? "방송 정보 확인됨" : "");
  const footerHtml=(footerText || roomId) ? `
        <div class="live-foot">
          <span id="liveConnectionStatus" class="status">${esc(footerText)}</span>
          ${roomId ? `<span class="live-debug">room ${esc(roomId.slice(0,8))}</span>` : ""}
        </div>` : "";

  tl.innerHTML=`
    <div class="live-shell">
      <div class="live-card">
        <div class="live-head">
          ${streaming ? `<span class="live-badge">LIVE</span>` : ""}
          <div class="live-head-text">
            <div class="live-title">${esc(title)}</div>
            <div class="live-sub">${esc([liveArtistName(),started].filter(Boolean).join(" · "))}</div>
          </div>
          <div class="live-head-actions">
            <button id="liveSoundBtn" class="live-mini-btn" type="button" ${streaming?"":"disabled"}>소리 켜기</button>
            <button id="liveRefreshBtn" class="live-mini-btn" type="button">새로고침</button>
          </div>
        </div>
        <div id="liveEntrances" class="live-entry-form" aria-live="polite"></div>
        <div class="live-stage">${stageHtml}</div>
        ${footerHtml}
      </div>
    </div>`;

  $("#liveRefreshBtn")?.addEventListener("click",()=>refreshLiveStatus({force:true,autoplay:true}));
  $("#liveSoundBtn")?.addEventListener("click",resumeLiveAudio);
  renderLiveEntrances();
}

function liveTileId(uid){
  return `live-user-${String(uid).replace(/[^a-zA-Z0-9_-]/g,"_")}`;
}

function ensureLiveTile(user){
  const grid=$("#liveVideoGrid");
  if(!grid) return null;
  $("#liveWaiting")?.remove();
  const id=liveTileId(user.uid);
  let tile=document.getElementById(id);
  if(!tile){
    tile=document.createElement("div");
    tile.className="live-video-tile";
    tile.id=id;
    const label=document.createElement("div");
    label.className="live-video-label";
    label.textContent=String(user.uid);
    tile.appendChild(label);
    grid.appendChild(tile);
  }
  const tiles=grid.querySelectorAll(".live-video-tile");
  grid.classList.toggle("single",tiles.length===1);
  return tile;
}

async function subscribeLiveUser(user,mediaType){
  const client=state.live.client;
  if(!client || !user) return;
  try{
    await client.subscribe(user,mediaType);
    if(client!==state.live.client || state.filter!=="live") return;
    if(mediaType==="video" && user.videoTrack){
      const tile=ensureLiveTile(user);
      user.videoTrack.play(tile,{fit:"contain",mirror:false});
      liveStatusText("LIVE 재생 중");
    }
    if(mediaType==="audio" && user.audioTrack){
      state.live.remoteTracks.set(`audio:${user.uid}`,user.audioTrack);
      try{ user.audioTrack.play(); state.live.audioBlocked=false; }
      catch{ state.live.audioBlocked=true; liveStatusText("영상 재생 중 · 소리가 안 나면 ‘소리 켜기’를 눌러줘"); }
    }
  }catch(e){
    liveStatusText(`스트림 구독 실패: ${e?.message || e}`,true);
  }
}

async function resumeLiveAudio(){
  try{ await window.AgoraRTC?.resumeAudioContext?.(); }catch{}
  for(const user of state.live.client?.remoteUsers || []){
    try{ user.audioTrack?.play(); }catch{}
  }
  state.live.audioBlocked=false;
  liveStatusText("LIVE 재생 중");
}

async function stopLivePlayback({clearRoom=false}={}){
  const client=state.live.client;
  state.live.client=null;
  state.live.connectionSeq++;
  state.live.remoteTracks.clear();
  if(client){
    try{ await client.leave(); }catch{}
    try{ client.removeAllListeners?.(); }catch{}
  }
  if(clearRoom){
    state.live.liveChat=null;
    state.live.liveChatError=null;
    state.live.chatProvider="";
    state.live.currentLiveRoomId="";
    state.live.room=null;
    state.live.token="";
    state.live.tokenInfo=null;
  }
}

function liveApiOptions(entry=state.live.entry){
  return entry.kind==="group" ? {} : {base:FROMM_CHANNEL_API_BASE,channelId:entry.channelId};
}

function liveApiPath(roomId,suffix="",entry=state.live.entry){
  return `${entry.kind==="group" ? "/v2/group-live" : "/live/agora"}/rooms/${encodeURIComponent(roomId)}${suffix}`;
}

async function requestViewerToken(liveRoomId,{renew=false,entry=state.live.entry,currentToken=state.live.token}={}){
  const response=await frommApiRequest(liveApiPath(liveRoomId,renew?"/token/renew":"/token",entry),{
    ...liveApiOptions(entry), method:"POST",
    body:renew ? {role:"subscriber",currentToken} : {role:"subscriber"}
  });
  const data=response?.data;
  if(typeof data?.token!=="string" || !data.token) throw new Error("라이브 토큰 응답을 확인하지 못했습니다.");
  return {token:data.token,expireTime:data.expireTime};
}

async function renewLiveToken(){
  const liveRoomId=state.live.currentLiveRoomId;
  const client=state.live.client;
  const seq=state.live.connectionSeq;
  if(!liveRoomId || !client || state.live.renewing) return;
  state.live.renewing=true;
  try{
    const {token}=await requestViewerToken(liveRoomId,{renew:true});
    if(client!==state.live.client || seq!==state.live.connectionSeq) return;
    await client.renewToken(token);
    if(client===state.live.client && seq===state.live.connectionSeq) state.live.token=token;
  }catch(e){
    if(client===state.live.client) liveStatusText(`토큰 갱신 실패: ${e?.message || e}`,true);
  }finally{ state.live.renewing=false; }
}

async function connectAgoraLive({candidateIndex=0}={}){
  const room=state.live.room;
  const token=state.live.token;
  const info=state.live.tokenInfo;
  if(!room || !token || !info) return;

  const appId=String(info.appId || deepFindValue(room,["agoraAppId","appId"]) || "");
  const channelName=String(room.id || state.live.currentLiveRoomId || "");
  const uid=String(room.user?.userId || "");
  if(!uid) throw new Error("라이브 응답에 시청자 userId가 없습니다.");
  if(!appId || !channelName){
    throw new Error("Agora App ID 또는 실제 채널명을 확인하지 못했습니다. 라이브가 켜진 상태에서 다시 시도해주세요.");
  }

  const requestSeq=state.live.requestSeq;
  const generation=state.scanGeneration;
  const current=()=>requestSeq===state.live.requestSeq && generation===state.scanGeneration && state.filter==="live";
  const AgoraRTC=await ensureAgoraRtcSdk();
  if(!current()) return;
  await stopLivePlayback();
  if(!current()) return;
  const seq=++state.live.connectionSeq;
  const client=AgoraRTC.createClient({mode:"live",codec:"vp8"});
  state.live.client=client;

  try{ await client.setClientRole("audience",{level:1}); }catch{
    try{ await client.setClientRole("audience"); }catch{}
  }

  const candidates=state.live.encryptionCandidates.length
    ? state.live.encryptionCandidates
    : liveEncryptionCandidates(room);
  state.live.encryptionCandidates=candidates;
  state.live.encryptionIndex=Math.min(candidateIndex,candidates.length-1);
  const enc=candidates[state.live.encryptionIndex];
  if(enc && enc.mode!=="none"){
    client.setEncryptionConfig(enc.mode,enc.key,enc.salt || undefined);
  }

  let cryptRetryQueued=false;
  client.on("crypt-error",()=>{
    if(seq!==state.live.connectionSeq || cryptRetryQueued) return;
    cryptRetryQueued=true;
    const next=state.live.encryptionIndex+1;
    if(next < state.live.encryptionCandidates.length){
      liveStatusText("암호화 방식 자동 재시도 중...");
      setTimeout(()=>connectAgoraLive({candidateIndex:next}).catch(e=>liveStatusText(e.message,true)),250);
    }else{
      liveStatusText("라이브 암호화 설정이 맞지 않아 영상을 해독하지 못했습니다.",true);
    }
  });
  client.on("user-published",(user,mediaType)=>subscribeLiveUser(user,mediaType));
  client.on("user-unpublished",(user,mediaType)=>{
    if(mediaType==="video") document.getElementById(liveTileId(user.uid))?.remove();
  });
  client.on("user-left",user=>document.getElementById(liveTileId(user.uid))?.remove());
  client.on("token-privilege-will-expire",renewLiveToken);
  client.on("token-privilege-did-expire",renewLiveToken);
  client.on("connection-state-change",(cur)=>{
    if(seq!==state.live.connectionSeq) return;
    if(cur==="RECONNECTING") liveStatusText("LIVE 재연결 중...");
    if(cur==="CONNECTED") liveStatusText("LIVE 연결됨 · 영상 스트림 대기 중");
    if(cur==="DISCONNECTED" && state.live.config?.isStreaming) liveStatusText("LIVE 연결이 끊겼습니다.",true);
  });

  liveStatusText("Agora LIVE 연결 중...");
  try{ await client.join(appId,channelName,token,uid); }catch(e){
    if(state.live.client===client) await stopLivePlayback();
    throw e;
  }
  if(seq!==state.live.connectionSeq || !current()){
    try{ await client.leave(); }catch{}
    client.removeAllListeners?.();
    return;
  }
  liveStatusText("LIVE 연결됨 · 영상 스트림 대기 중");

  // Subscribe to users already present in the room as well.
  for(const user of client.remoteUsers || []){
    if(user.hasVideo) await subscribeLiveUser(user,"video");
    if(user.hasAudio) await subscribeLiveUser(user,"audio");
  }
}

async function fetchLiveEntrances(){
  const response=await frommApiRequest("/live/entrances",{base:FROMM_CHANNEL_API_BASE});
  const rooms=response?.data?.liveRooms;
  if(!Array.isArray(rooms)) throw new Error("현재 방송 목록 응답을 확인하지 못했습니다.");
  if(rooms.some(room=>!room || typeof room.channelId!=="string" || !room.channelId || typeof room.liveRoomId!=="string" || !room.liveRoomId)){
    throw new Error("방송 목록에 올바르지 않은 연결 정보가 있습니다.");
  }
  return rooms.map(room=>({channelId:room.channelId,liveRoomId:room.liveRoomId,
    channelPath:room.channelPath || "",artiName:room.artiName || "라이브 방송",
    profileUrl:room.profileUrl || "",streamingProvider:room.streamingProvider || ""}));
}

function renderLiveEntrances(){
  const el=$("#liveEntrances");
  if(!el) return;
  const live=state.live;
  el.innerHTML=`<p class="live-entry-note">현재 시청 가능한 방송 · 15초마다 자동 확인</p>`+
    (live.discoveryError ? `<p class="live-entry-note live-error">${esc(live.discoveryError)}</p>` : "")+
    (live.entrances.length ? live.entrances.map((room,index)=>{
      const selected=room.liveRoomId===live.currentLiveRoomId;
      return `<button type="button" class="live-mini-btn" data-live-index="${index}" aria-pressed="${selected}">${esc(room.artiName)} · ${selected?"시청 중":"방송 보기"}</button>`;
    }).join("") : `<p class="live-entry-note">${live.discoveryLoaded?"현재 방송이 없습니다.":"방송 목록을 확인하고 있습니다."}</p>`);
  for(const button of el.querySelectorAll("[data-live-index]")){
    button.addEventListener("click",()=>chooseLiveEntrance(Number(button.dataset.liveIndex)));
  }
}

async function chooseLiveEntrance(index){
  const room=state.live.entrances[index];
  if(!room) return;
  const generation=state.scanGeneration, seq=++state.live.requestSeq;
  state.live.entry={kind:"channel",channelId:room.channelId,liveRoomId:room.liveRoomId};
  state.live.loading=false;
  state.live.config=null;
  state.live.lastError="";
  await stopLivePlayback({clearRoom:true});
  if(seq!==state.live.requestSeq || generation!==state.scanGeneration || state.filter!=="live") return;
  await refreshLiveStatus({force:true});
}

async function probeLiveIndicator(){
  if(!state.room || state.live.probeLoading || state.live.loading) return;
  const generation=state.scanGeneration, seq=state.live.requestSeq;
  state.live.probeLoading=true;
  try{
    const rooms=await fetchLiveEntrances();
    if(generation!==state.scanGeneration || seq!==state.live.requestSeq) return;
    state.live.entrances=rooms;
    state.live.discoveryLoaded=true;
    state.live.discoveryError="";
    syncHeaderLiveIndicator();
  }catch(e){
    if(generation===state.scanGeneration && seq===state.live.requestSeq) state.live.discoveryError=String(e?.message || "방송 목록 확인 실패");
  }finally{state.live.probeLoading=false;}
}

async function refreshLiveStatus({force=false,autoplay=true,silent=false}={}){
  if(state.filter!=="live" || !state.room || state.live.loading) return;
  const generation=state.scanGeneration, seq=++state.live.requestSeq;
  const current=()=>generation===state.scanGeneration && seq===state.live.requestSeq && state.filter==="live";
  state.live.loading=true;
  syncLoadingUI();
  // Discovery failures do not tear down a playing stream or falsely report offline.
  let rooms;
  try{
    rooms=await fetchLiveEntrances();
  }catch(e){
    if(current()){
      state.live.discoveryError=String(e?.message || "방송 목록 확인 실패");
      if(!state.live.client){state.live.status="error";state.live.lastError=state.live.discoveryError;renderLiveView();}
      else renderLiveEntrances();
      state.live.loading=false;
      syncLoadingUI();
    }
    return;
  }
  if(!current()) return;
  state.live.entrances=rooms;
  state.live.discoveryLoaded=true;
  state.live.discoveryError="";
  try{
    const previous=state.live.entry;
    const channelRooms=rooms.filter(room=>room.channelId===previous.channelId);
    // Preserve the chosen channel across broadcasts; never guess by artist nickname.
    const entryRoom=channelRooms.find(room=>room.liveRoomId===previous.liveRoomId) || (channelRooms.length===1 ? channelRooms[0] : null) || (rooms.length===1 ? rooms[0] : null);
    if(!entryRoom){
      await stopLivePlayback({clearRoom:true});
      if(!current()) return;
      state.live.config=null;
      state.live.status=rooms.length?"choose-live":"offline";
      state.live.lastError="";
      renderLiveView();
      return;
    }
    const entry={kind:"channel",channelId:entryRoom.channelId,liveRoomId:entryRoom.liveRoomId};
    if(!force && state.live.currentLiveRoomId===entry.liveRoomId && state.live.client){
      renderLiveEntrances();
      return;
    }
    // An access error needs an explicit retry, but a newly started room can connect.
    if(!force && state.live.status==="error" && previous.liveRoomId===entry.liveRoomId){renderLiveEntrances();return;}
    state.live.entry=entry;
    state.live.lastError="";
    state.live.status="loading";
    await stopLivePlayback({clearRoom:true});
    if(!current()) return;
    if(entryRoom.streamingProvider && entryRoom.streamingProvider.toLowerCase()!=="agora"){
      throw new Error("이 방송은 현재 뷰어가 지원하는 Agora 방식이 아닙니다.");
    }
    const response=await frommApiRequest(liveApiPath(entry.liveRoomId,"/enter",entry),{
      ...liveApiOptions(entry),method:"POST",query:{channelId:entry.channelId},body:{role:"subscriber"}
    });
    if(!current()) return;
    const data=response?.data,room=data?.liveRoom,token=data?.agoraToken?.token;
    if(!room || room.id!==entry.liveRoomId || typeof token!=="string" || !token){
      throw new Error("라이브 입장 응답에 방 정보 또는 시청 토큰이 없습니다.");
    }
    const tokenInfo=await parseAgoraToken(token);
    if(!current()) return;
    const encryption=liveEncryptionCandidates(room);
    Object.assign(state.live,{
      currentLiveRoomId:entry.liveRoomId,room,token,tokenInfo,
      chatProvider:data.chatProvider || "",liveChat:data.liveChat || null,liveChatError:data.liveChatError || null,
      config:{isStreaming:true,liveRoomId:entry.liveRoomId,channelId:entry.channelId},
      encryptionCandidates:encryption,encryptionIndex:0,status:"ready",lastError:""
    });
    renderLiveView();
    if(autoplay) await connectAgoraLive({candidateIndex:0});
  }catch(e){
    if(!current()) return;
    await stopLivePlayback({clearRoom:true});
    if(!current()) return;
    state.live.config=null;
    state.live.status="error";
    state.live.lastError=e?.errorType==="NOT_FOUND_LIVE_ROOM"
      ? "방송이 종료되었거나 방송 정보를 다시 확인해야 합니다. 새로고침을 눌러주세요."
      : String(e?.message || "라이브 연결 실패");
    renderLiveView();
  }finally{
    if(current()){
      state.live.loading=false;
      syncLoadingUI();
      syncLiveToolbarControls();
    }
  }
}

function stopLivePolling(){
  if(state.live.timer){ clearInterval(state.live.timer); state.live.timer=null; }

  state.live.timer=setInterval(()=>{

    }else{

    }
  },15000);
}

const AUTH_TOKEN_KEY = "fromm_local_access_token_v1";
const AUTH_UUID_KEY = "fromm_local_device_id_v1";
const AUTH_REFRESH_KEY = "fromm_refresh_token";
const AUTH_RESOURCE_KEY = "fromm_resource_token";
const AUTH_EXPIRY_KEY = "fromm_token_expiry";
const AUTH_EMAIL_KEY = "fromm_login_email_v1";

function readSavedAuth(){
  try{
    return {
      token: localStorage.getItem(AUTH_TOKEN_KEY) || "",
      uuid: localStorage.getItem(AUTH_UUID_KEY) || ""
    };
  }catch{
    return {token:"",uuid:""};
  }
}

function saveAuthLocally(token,uuid,extra={}){
  try{
    localStorage.setItem(AUTH_TOKEN_KEY, token);
    localStorage.setItem(AUTH_UUID_KEY, uuid);

    if(extra.email){
      localStorage.setItem(AUTH_EMAIL_KEY, extra.email);
    }
    if(extra.refreshToken){
      localStorage.setItem(AUTH_REFRESH_KEY, extra.refreshToken);
    }
    if(extra.resourceToken){
      localStorage.setItem(AUTH_RESOURCE_KEY, extra.resourceToken);
    }
    if(extra.expiry){
      localStorage.setItem(AUTH_EXPIRY_KEY, String(extra.expiry));
    }
  }catch(e){
    console.warn("인증정보 저장 실패", e);
  }
}

function fillSavedAuth(){

  try{

    if(email && $("#loginEmail")){

  }catch{}

}

function validLoginEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || "").trim());
}

function getOrCreateLoginDeviceId(){
  let id = $("#loginDeviceId")?.value.trim() || "";

  if(!id){
    try{
      id =
        localStorage.getItem(AUTH_UUID_KEY) ||
        localStorage.getItem("fromm_device_id") ||
        "";
    }catch{}
  }

  if(!id){
    id = crypto.randomUUID();
  }

  if($("#loginDeviceId")){
    $("#loginDeviceId").value = id;
  }

  return id;
}

async function encryptLoginPassword(password,deviceId){
  const encoder = new TextEncoder();
  const keySource = encoder.encode(deviceId);
  const rawKey = keySource.slice(0,32);

  if(![16,24,32].includes(rawKey.length)){
    throw new Error("Device ID 형식이 올바르지 않습니다.");
  }

  const iv = rawKey.slice(0,16);

  const cryptoKey = await crypto.subtle.importKey(
    "raw",
    rawKey,
    {name:"AES-CBC"},
    false,
    ["encrypt"]
  );

  const encryptedBuffer = await crypto.subtle.encrypt(
    {name:"AES-CBC",iv},
    cryptoKey,
    encoder.encode(password)
  );

  return Array.from(new Uint8Array(encryptedBuffer))
    .map(b=>b.toString(16).padStart(2,"0"))
    .join("");
}

function readTokenExpiryMs(){
  let raw = "";

  try{
    raw =
      localStorage.getItem(AUTH_EXPIRY_KEY) ||
      localStorage.getItem("fromm_token_expiry") ||
      "";
  }catch{}

  if(!raw) return 0;

  const n = Number(raw);

  if(!Number.isFinite(n) || n <= 0){
    return 0;
  }

  // v0.46 stored an epoch value in seconds.
  return n < 10_000_000_000 ? n * 1000 : n;
}

function formatTokenRemaining(ms){
  if(ms <= 0){
    return "만료";
  }

  const totalMinutes = Math.max(0,Math.floor(ms/60000));
  const days = Math.floor(totalMinutes/1440);
  const hours = Math.floor((totalMinutes%1440)/60);
  const minutes = totalMinutes%60;

  // Similar compact style to the reference site's 91h 34m timer.
  if(days > 0){
    return `${days*24 + hours}h ${minutes}m`;
  }

  return `${hours}h ${minutes}m`;
}

let tokenCountdownTimer = null;

function stopTokenCountdown(){
  if(tokenCountdownTimer){
    clearInterval(tokenCountdownTimer);
    tokenCountdownTimer = null;
  }
}

function syncTokenCountdown(){
  const wrap = $("#tokenLifeWrap");
  const text = $("#tokenLifeText");

  if(!wrap || !text){
    return;
  }

  const expiry = readTokenExpiryMs();

  // Tokens entered/saved before email-login support may have no expiry metadata.
  if(!expiry){
    text.textContent = "유효시간 확인불가";
    wrap.classList.remove("expiring","expired");
    return;
  }

  const remaining = expiry - Date.now();

  text.textContent = formatTokenRemaining(remaining);
  wrap.classList.toggle(
    "expiring",
    remaining > 0 && remaining <= 6*60*60*1000
  );
  wrap.classList.toggle("expired",remaining <= 0);

  if(remaining <= 0){
    stopTokenCountdown();
    setActiveAuth();

    showLoginGate(
      "로그인 유효시간이 끝났습니다. 다시 로그인해주세요.",
      "error"
    );
  }
}

function startTokenCountdown(){
  stopTokenCountdown();
  syncTokenCountdown();

  tokenCountdownTimer = setInterval(
    syncTokenCountdown,
    30000
  );
}

async function checkLoginEmail(){
  const email = $("#loginEmail").value.trim();

  $("#loginBtn").disabled = true;

  if(!validLoginEmail(email)){
    setLoginStatus("이메일 형식을 확인해주세요.","error");
    return;
  }

  $("#checkEmailBtn").disabled = true;
  setLoginStatus("이메일 확인 중...");

  try{
    const response = await fetch(
      "https://account-api.frommyarti.com/auth/exist",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json; charset=UTF-8"
        },
        body:JSON.stringify({username:email})
      }
    );

    const text = await response.text();
    let data = {};

    try{
      data = text ? JSON.parse(text) : {};
    }catch{}

    if(response.ok && data?.success === true){
      $("#loginBtn").disabled = false;

      setLoginStatus(
        "이메일 확인 완료. 비밀번호를 입력하고 로그인하세요.",
        "ok"
      );

      try{
        localStorage.setItem(AUTH_EMAIL_KEY,email);
      }catch{}
    }else{
      setLoginStatus(
        data?.message || "등록된 Fromm 계정을 확인하지 못했습니다.",
        "error"
      );
    }
  }catch(e){
    setLoginStatus(
      "이메일 확인 요청에 실패했습니다. 확장프로그램이 켜져 있는지 확인해주세요.",
      "error"
    );
  }finally{
    $("#checkEmailBtn").disabled = false;
  }
}

async function loginWithFromm(){
  const email = $("#loginEmail").value.trim();
  const password = $("#loginPassword").value;

  if(!validLoginEmail(email)){
    setLoginStatus("이메일 형식을 확인해주세요.","error");
    return;
  }

  if(!password){
    setLoginStatus("비밀번호를 입력해주세요.","error");
    return;
  }

  const btn = $("#loginBtn");
  btn.disabled = true;
  setLoginStatus("로그인 중...");

  try{
    const deviceId = getOrCreateLoginDeviceId();
    const encryptedHex = await encryptLoginPassword(password,deviceId);

    const response = await fetch(
      "https://account-api.frommyarti.com/auth/signin",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json; charset=UTF-8",
          "uuid":deviceId
        },
        body:JSON.stringify({
          username:email,
          password:encryptedHex,
          deviceId,
          from:"store",
          allowUpdateDeviceId:true
        })
      }
    );

    const text = await response.text();
    let data = {};

    try{
      data = text ? JSON.parse(text) : {};
    }catch{}

    const responseData = data?.data;

    if(!response.ok || !data?.success || !responseData?.accessToken){
      throw new Error(
        data?.message ||
        data?.error ||
        "로그인 정보를 확인해주세요."
      );
    }

    const expiresIn = Number(responseData.expiresIn || 0);

    const expiry = expiresIn > 0
      ? Math.floor(Date.now()/1000) + expiresIn
      : "";

    setActiveAuth(
      responseData.accessToken,
      deviceId
    );

    await loadRooms();

    saveAuthLocally(
      responseData.accessToken,
      deviceId,
      {
        email,
        refreshToken:responseData.refreshToken || "",
        resourceToken:responseData.resourceToken || "",
        expiry
      }
    );

    try{
      localStorage.setItem(
        "fromm_access_token",
        responseData.accessToken
      );
      localStorage.setItem(
        "fromm_device_id",
        deviceId
      );

      if(responseData.refreshToken){
        localStorage.setItem(
          "fromm_refresh_token",
          responseData.refreshToken
        );
      }

      if(responseData.resourceToken){
        localStorage.setItem(
          "fromm_resource_token",
          responseData.resourceToken
        );
      }

      if(expiry){
        localStorage.setItem(
          "fromm_token_expiry",
          String(expiry)
        );
      }
    }catch{}

    $("#loginPassword").value = "";

    hideLoginGate();
    startTokenCountdown();
    return true;
  }catch(e){
    setActiveAuth();

    setLoginStatus(
      e?.message || "로그인에 실패했습니다.",
      "error"
    );

    return false;
  }finally{
    btn.disabled = false;
  }
}

async function connectSavedAuth({silent=false}={}){
  const saved = readSavedAuth();

  if(!saved.token || !saved.uuid){
    showLoginGate();
    return false;
  }

  const expiry = readTokenExpiryMs();

  if(expiry && expiry <= Date.now()){
    setActiveAuth();

    showLoginGate(
      "저장된 로그인 유효시간이 끝났습니다. 다시 로그인해주세요.",
      "error"
    );

    return false;
  }

  setActiveAuth(saved.token,saved.uuid);

  try{
    await loadRooms();

    hideLoginGate();
    startTokenCountdown();
    return true;
  }catch(e){
    setActiveAuth();

    showLoginGate(
      "저장된 로그인이 만료됐거나 유효하지 않습니다. 다시 로그인해주세요.",
      "error"
    );

    return false;
  }
}

async function autoConnectSaved(){
  fillSavedAuth();

  const saved = readSavedAuth();

  if(!saved.token || !saved.uuid){
    showLoginGate();
    return false;
  }

  return connectSavedAuth({silent:true});
}

function saveRoomCache(){
  const key = roomCacheKey();
  if(!key) return;

  state.roomCache.set(key,{
    messages: state.messages,
    cursorEnd: state.cursorEnd ? new Date(state.cursorEnd).toISOString() : null,
    hasMoreMessages: state.hasMoreMessages,
    pageRequestLimit: state.pageRequestLimit
  });
}

function restoreRoomCache(entry){
  state.messages = Array.isArray(entry?.messages) ? entry.messages : [];
  state.cursorEnd = entry?.cursorEnd ? new Date(entry.cursorEnd) : new Date();
  state.hasMoreMessages = entry?.hasMoreMessages !== false;
  state.pageRequestLimit = Number(entry?.pageRequestLimit || 500);

  state.seenMessageKeys = new Set(
    state.messages.map(m=>String(m.messageId || `${m.createdAt}|${m.type}|${m.content}`))
  );

  buildMediaSequences();
  updateHistoryStatus("캐시");
}

function resetHistoryPaging(){
  state.messages = [];
  state.cursorEnd = new Date();
  state.hasMoreMessages = true;
  state.loadingMessages = false;
  state.pageRequestLimit = 500;
  state.seenMessageKeys = new Set();

  state.mediaSequence.clear();
  state.legacyMediaSequence.clear();
  disconnectInfiniteObserver();
  state.infiniteList = [];
  state.infiniteRendered = 0;
  state.infiniteLastDate = "";
  state.prefetching.clear();
}

function resetFullChatHistory(){
  if(state.chatRenderObserver){
    state.chatRenderObserver.disconnect();
    state.chatRenderObserver = null;
  }

  state.chatMessages = [];
  state.chatHistoryComplete = false;
  state.chatHistoryLoading = false;
  state.chatHistoryProgress = 0;
}

function chatCacheKey(){
  return String(state.room?.hostChatRoomId || "");
}

function restoreFullChatCache(){
  const cached = state.chatCache.get(chatCacheKey());
  if(!cached?.length) return false;

  state.chatMessages = cached;
  state.chatHistoryComplete = true;
  state.chatHistoryLoading = false;
  state.chatHistoryProgress = cached.length;
  buildMediaSequences();
  renderDateCalendar();
  return true;
}

async function ensureFullChatHistory(){
  if(!state.room) return false;
  if(state.chatHistoryComplete) return true;

  if(state.chatHistoryLoading){
    while(state.chatHistoryLoading){
      await sleep(80);
    }
    return state.chatHistoryComplete;
  }

  if(restoreFullChatCache()){
    return true;
  }

  const generation = state.scanGeneration;
  const roomId = String(state.room.hostChatRoomId);

  state.chatHistoryLoading = true;
  state.chatHistoryProgress = 0;
  syncLoadingUI();

  const seen = new Set();
  const all = [];

  let cursorEnd = new Date();
  let requestLimit = 500;
  let safety = 0;

  try{
    while(true){
      if(generation !== state.scanGeneration) return false;

      safety++;
      if(safety > 10000){
        throw new Error("전체 대화 페이지 안전 제한에 도달했습니다.");
      }

      let data;
      try{
        data = await requestHistoryPage(roomId,cursorEnd,requestLimit);
      }catch(e){
        if(requestLimit > 100){
          requestLimit = 100;
          data = await requestHistoryPage(roomId,cursorEnd,100);
        }else{
          throw e;
        }
      }

      if(generation !== state.scanGeneration) return false;

      const batch = data?.data?.messages || [];
      if(!batch.length) break;

      for(const msg of batch){
        const key = String(msg.messageId || `${msg.createdAt}|${msg.type}|${msg.content}`);
        if(!seen.has(key)){
          seen.add(key);
          all.push(msg);
        }
      }

      state.chatHistoryProgress = all.length;

      if(state.filter === "all"){
        $("#scanState").textContent =
          `${state.room?.host?.nick || "아티스트"} · 전체 대화 준비 중 ${all.length.toLocaleString()}개...`;
      }

      const dated = batch
        .filter(msg=>msg.createdAt)
        .sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));

      if(!dated.length) break;

      const next = new Date(new Date(dated[0].createdAt).getTime()-1);

      if(!Number.isFinite(next.getTime()) || next >= cursorEnd){
        break;
      }

      cursorEnd = next;
    }

    if(generation !== state.scanGeneration) return false;

    all.sort((a,b)=>compareMessages(a,b,"asc"));

    state.chatMessages = all;
    state.chatHistoryComplete = true;
    state.chatHistoryProgress = all.length;
    state.chatCache.set(chatCacheKey(), all);

    buildMediaSequences();
    renderDateCalendar();

    if(state.filter === "all"){
      $("#scanState").textContent =
        `${state.room?.host?.nick || "아티스트"} · 전체 대화 ${all.length.toLocaleString()}개 · 오래된 순`;
    }

    return true;
  }catch(e){
    if(generation === state.scanGeneration){
      $("#scanState").textContent = "전체 대화 불러오기 실패";
      alert(e.message);
    }
    return false;
  }finally{
    if(generation === state.scanGeneration){
      state.chatHistoryLoading = false;
      syncLoadingUI();
    }
  }
}

async function loadRooms(){
